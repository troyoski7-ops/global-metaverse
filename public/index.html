
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe 3D Metaverse</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; }
    .top-bar, .side-dock, .chat-box, .modal-card, #joystick-base, #proximity-prompt, #dismount-btn, #mic-float-btn, #game-hud { pointer-events: auto; }

    /* ഹെഡർ */
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .badges { display: flex; gap: 5px; align-items: center; }
    .badge { background: rgba(15, 23, 42, 0.9); color: #fff; padding: 5px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); }
    .owner-tag { background: linear-gradient(45deg, #ffd700, #ff8c00); color: #000; }
    
    .top-btns { display: flex; gap: 4px; }
    .btn-top { background: rgba(15, 23, 42, 0.85); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); padding: 5px 8px; border-radius: 12px; font-size: 11px; backdrop-filter: blur(8px); cursor: pointer; }
    .star-btn { background: linear-gradient(45deg, #eab308, #ca8a04); color: #000; font-weight: bold; border: none; }

    /* എപ്പോഴും കാണുന്ന ലൈവ് വോയ്‌സ് മൈക്ക് */
    #mic-float-btn { position: absolute; top: 52px; left: 10px; width: 44px; height: 44px; border-radius: 50%; background: #22c55e; color: #fff; border: 2px solid #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(34, 197, 94, 0.8); cursor: pointer; z-index: 20; }
    #mic-float-btn.muted { background: #ef4444; box-shadow: 0 0 12px rgba(239, 68, 68, 0.8); }

    /* വഴിയിൽ കിടക്കുന്ന കാറിന്റെയോ ജീവിയുടെയോ അടുത്തേക്ക് ചെല്ലുമ്പോൾ വരുന്ന പ്രോംപ്റ്റ് */
    #proximity-prompt { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); background: linear-gradient(45deg, #2563eb, #38bdf8); color: #fff; padding: 10px 22px; border-radius: 25px; font-weight: bold; font-size: 13px; border: 2px solid #fff; box-shadow: 0 0 20px rgba(56, 189, 248, 0.9); display: none; cursor: pointer; z-index: 30; animation: bounce 1s infinite alternate; }
    @keyframes bounce { 0% { transform: translate(-50%, 0); } 100% { transform: translate(-50%, -8px); } }

    /* ഇറങ്ങാനുള്ള ഡിസ്മൗണ്ട് ബട്ടൺ */
    #dismount-btn { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 12px; border: 2px solid #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.9); display: none; cursor: pointer; z-index: 20; }

    /* ഗെയിം HUD ഇന്റർഫേസ് */
    #game-hud { position: absolute; top: 60px; right: 10px; background: rgba(15, 23, 42, 0.9); color: #fff; padding: 8px 14px; border-radius: 14px; font-size: 12px; border: 1px solid rgba(255, 255, 255, 0.2); display: none; }
    #kick-ball-btn { position: absolute; bottom: 80px; right: 80px; width: 60px; height: 60px; border-radius: 50%; background: #eab308; color: #000; font-weight: 900; font-size: 14px; border: 2px solid #fff; display: none; align-items: center; justify-content: center; box-shadow: 0 0 15px #eab308; cursor: pointer; z-index: 30; }

    /* സൈഡ് പാനൽ */
    .side-dock { position: absolute; right: 8px; top: 100px; display: flex; flex-direction: column; gap: 5px; }
    .dock-btn { background: rgba(15, 23, 42, 0.85); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 7px 10px; border-radius: 12px; font-size: 10px; backdrop-filter: blur(8px); text-align: left; cursor: pointer; }

    /* 🕹️ 360° അനലോഗ് ജോയ്സ്റ്റിക്ക് */
    #joystick-base { position: absolute; left: 16px; bottom: 20px; width: 110px; height: 110px; background: rgba(0, 0, 0, 0.35); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); touch-action: none; }
    #joystick-stick { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 10px rgba(56, 189, 248, 0.8); pointer-events: none; }

    /* ഗ്രൂപ്പ് ചാറ്റ് */
    .chat-box { position: absolute; right: 8px; bottom: 12px; width: 210px; background: rgba(15, 23, 42, 0.9); border-radius: 12px; padding: 6px; border: 1px solid rgba(255, 255, 255, 0.2); }
    #chat-content { height: 45px; overflow-y: auto; font-size: 10px; color: #fff; margin-bottom: 4px; }
    .chat-controls { display: flex; gap: 3px; }
    .chat-controls input { flex: 1; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 4px 6px; border-radius: 6px; font-size: 10px; }
    .chat-controls button { background: #0284c7; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }

    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-card { background: #1e293b; color: #fff; padding: 14px; border-radius: 16px; width: 85%; max-width: 310px; display: flex; flex-direction: column; gap: 8px; text-align: center; max-height: 85vh; overflow-y: auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 4px 0; }
    .btn-act { background: #0284c7; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .btn-close { background: #64748b; color: #fff; border: none; padding: 6px; border-radius: 6px; font-size: 10px; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- ഫ്ലോട്ടിംഗ് മൈക്ക് ബട്ടൺ (എപ്പോഴും സ്ക്രീനിൽ) -->
  <button id="mic-float-btn" onclick="toggleAlwaysVoiceMic()" title="Voice Mic">🎙️</button>

  <!-- പ്രോക്സിമിറ്റി റൈഡ് പ്രോംപ്റ്റ് -->
  <button id="proximity-prompt" onclick="interactWithNearbyObject()"></button>

  <!-- ഡിസ്മൗണ്ട് ബട്ടൺ -->
  <button id="dismount-btn" onclick="dismountActiveRide()">🚪 Dismount / Walk Normal</button>

  <!-- ഫുട്ബോൾ കിക്ക് ബട്ടൺ & സ്കോർ HUD -->
  <div id="game-hud">⚽ Goals: <span id="goal-count">0</span> | Streak: <span id="kick-streak">0</span></div>
  <button id="kick-ball-btn" onclick="triggerBallKick()">⚽ KICK</button>

  <div id="ui-layer">
    <div class="top-bar">
      <div class="badges">
        <div id="owner-tag" class="badge owner-tag hidden">👑 OWNER</div>
        <div class="badge">🪙 <span id="pts">100</span></div>
      </div>
      <div class="top-btns">
        <button class="btn-top" onclick="openBox('country-box')">🌍 Server</button>
        <button class="btn-top" onclick="openBox('lang-box')">⚙️ Lang</button>
        <button class="btn-top" onclick="openBox('avatar-box')">🧑 Avatar</button>
        <button class="btn-top star-btn" onclick="openBox('stars-box')">⭐ Stars Shop</button>
      </div>
    </div>

    <div class="side-dock">
      <button class="dock-btn" onclick="teleportFootballZone()">⚽ Football Stadium</button>
      <button class="dock-btn" onclick="teleportParkourZone()">🌋 Lava Parkour Game</button>
      <button class="dock-btn" onclick="teleportMountainPeak()">🏔️ Realistic Mountain Climb</button>
      <button class="dock-btn" onclick="openBox('stage-box')">🎤 Concert Stage & Seats</button>
      <button class="dock-btn" onclick="openBox('room-box')">💬 Group Chats</button>
    </div>

    <!-- 🕹️ ജോയ്സ്റ്റിക്ക് -->
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>

    <!-- ചാറ്റ് ബോക്സ് -->
    <div class="chat-box">
      <div id="chat-content"></div>
      <div class="chat-controls">
        <input type="text" id="chat-txt" placeholder="Group chat..." maxlength="80">
        <button onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- 1. രാജ്യങ്ങൾ (10+ സജീവ രാജ്യങ്ങൾ) -->
  <div id="country-box" class="modal hidden">
    <div class="modal-card">
      <h3>🌍 Select Telegram Active Server</h3>
      <div class="grid-2">
        <button onclick="changeServer('kerala', '🌴 Kerala Hub')" class="btn-act">🌴 Kerala</button>
        <button onclick="changeServer('india', '🇮🇳 India Lounge')" class="btn-act">🇮🇳 India</button>
        <button onclick="changeServer('uae', '🇦🇪 UAE/Dubai')" class="btn-act">🇦🇪 UAE</button>
        <button onclick="changeServer('russia', '🇷🇺 Russia')" class="btn-act">🇷🇺 Russia</button>
        <button onclick="changeServer('usa', '🇺🇸 USA')" class="btn-act">🇺🇸 USA</button>
        <button onclick="changeServer('brazil', '🇧🇷 Brazil')" class="btn-act">🇧🇷 Brazil</button>
        <button onclick="changeServer('indonesia', '🇮🇩 Indonesia')" class="btn-act">🇮🇩 Indonesia</button>
        <button onclick="changeServer('germany', '🇩🇪 Germany')" class="btn-act">🇩🇪 Germany</button>
        <button onclick="changeServer('italy', '🇮🇹 Italy')" class="btn-act">🇮🇹 Italy</button>
        <button onclick="changeServer('nigeria', '🇳🇬 Nigeria')" class="btn-act">🇳🇬 Nigeria</button>
      </div>
      <button onclick="closeBox('country-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 2. ഭാഷ മാറ്റം (Language Settings) -->
  <div id="lang-box" class="modal hidden">
    <div class="modal-card">
      <h3>⚙️ Select Language</h3>
      <div class="grid-2">
        <button onclick="setGameLanguage('ml')" class="btn-act">മലയാളം</button>
        <button onclick="setGameLanguage('en')" class="btn-act">English</button>
        <button onclick="setGameLanguage('hi')" class="btn-act">हिन्दी</button>
        <button onclick="setGameLanguage('ar')" class="btn-act">العربية</button>
        <button onclick="setGameLanguage('ru')" class="btn-act">Русский</button>
      </div>
      <button onclick="closeBox('lang-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 3. ക്യാരക്ടർ കസ്റ്റമൈസ് -->
  <div id="avatar-box" class="modal hidden">
    <div class="modal-card">
      <h3>🧑 Avatar Model</h3>
      <div class="grid-2">
        <button onclick="setCharGender('boy')" class="btn-act">👦 Boy Model</button>
        <button onclick="setCharGender('girl')" class="btn-act" style="background:#ec4899;">👧 Girl Model</button>
      </div>
      <p style="font-size:11px;">Shirt Color:</p>
      <div style="display:flex; justify-content:space-around; margin:5px 0;">
        <div style="width:28px;height:28px;border-radius:50%;background:#ef4444;cursor:pointer;" onclick="setCharColor('#ef4444')"></div>
        <div style="width:28px;height:28px;border-radius:50%;background:#2563eb;cursor:pointer;" onclick="setCharColor('#2563eb')"></div>
        <div style="width:28px;height:28px;border-radius:50%;background:#10b981;cursor:pointer;" onclick="setCharColor('#10b981')"></div>
        <div style="width:28px;height:28px;border-radius:50%;background:#f59e0b;cursor:pointer;" onclick="setCharColor('#f59e0b')"></div>
      </div>
      <button onclick="closeBox('avatar-box')" class="btn-close">Done</button>
    </div>
  </div>

  <!-- 4. കോൺസേർട്ട് സ്റ്റേജ് -->
  <div id="stage-box" class="modal hidden">
    <div class="modal-card">
      <h3>🎤 Concert Arena</h3>
      <button onclick="sitInAudienceSeat()" class="btn-act" style="background:#8b5cf6;">🪑 Sit in Audience Seat</button>
      <button onclick="closeBox('stage-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 5. ഗ്രൂപ്പ് റൂമുകൾ -->
  <div id="room-box" class="modal hidden">
    <div class="modal-card">
      <h3>💬 Custom Group Lounges</h3>
      <div id="room-buttons" class="grid-2"></div>
      <p style="font-size:11px; margin-top:8px;">Create New Group Room:</p>
      <div style="display:flex; gap:4px;">
        <input type="text" id="new-group-name" placeholder="Room title..." style="flex:1; padding:6px; border-radius:6px; border:none; font-size:10px;">
        <button onclick="createRoomAction()" class="btn-act">Create</button>
      </div>
      <button onclick="closeBox('room-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 6. Telegram Stars സ്റ്റോർ -->
  <div id="stars-box" class="modal hidden">
    <div class="modal-card">
      <h3>⭐ Telegram Stars Official Store</h3>
      <button onclick="purchaseStarsItem('Godzilla & King Kong Beast Pass', 'beast_ride', 25)" class="btn-act" style="background:#15803d;">🦖 Unlock Giants (25 Stars)</button>
      <button onclick="purchaseStarsItem('1-on-1 Video Calling Pass', 'video_pass', 35)" class="btn-act" style="background:#ca8a04;">📹 Video Call Pass (35 Stars)</button>
      <button onclick="closeBox('stars-box')" class="btn-close">Close</button>
    </div>
  </div>

  <script>
    const socket = io();
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let isOwner = false;
    let unlockedBeast = false;
    let userGender = 'boy';
    let userColor = '#2563eb';
    let activeRide = 'walk';
    let userPts = 100;
    let goalsScored = 0;

    // --- 3D Scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.002);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(60, 120, 60);
    scene.add(dirLight);

    // വിശാലമായ ദ്വീപ് & സമുദ്രം
    const island = new THREE.Mesh(new THREE.CylinderGeometry(220, 240, 5, 48), new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 }));
    island.position.y = -2.5;
    scene.add(island);

    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(3500, 3500), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1 }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = -4;
    scene.add(ocean);

    // റോഡ് ട്രാക്ക് (Road for Vehicles)
    const road = new THREE.Mesh(new THREE.RingGeometry(50, 64, 48), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 }));
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.05;
    scene.add(road);

    // ----------------------------------------------------
    // 🚗 1. ചിത്രത്തിൽ കാണുന്ന റിയലിസ്റ്റിക് കാർട്ടൂൺ റെഡ് കാർ
    // ----------------------------------------------------
    function createCartoonRedCar(x, z) {
      const g = new THREE.Group();
      // വളഞ്ഞ ചുവന്ന കാർ ബോഡി
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.4, 5.8), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
      body.position.y = 1; g.add(body);

      // വിൻഡോസ് ഉള്ള കാബിൻ
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.2, 3.2), new THREE.MeshStandardMaterial({ color: 0x93c5fd }));
      cabin.position.set(0, 2.2, -0.2); g.add(cabin);

      // ബമ്പർ (സിൽവർ)
      const bFront = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.4, 0.6), new THREE.MeshStandardMaterial({ color: 0xd1d5db }));
      bFront.position.set(0, 0.6, 3); g.add(bFront);
      const bBack = bFront.clone(); bBack.position.set(0, 0.6, -3); g.add(bBack);

      // മഞ്ഞ റൗണ്ട് ഹെഡ്‌ലൈറ്റുകൾ
      const hlGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
      const hlMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 0.6 });
      const hl1 = new THREE.Mesh(hlGeo, hlMat); hl1.rotation.x = Math.PI / 2; hl1.position.set(-1.1, 1.2, 2.95); g.add(hl1);
      const hl2 = hl1.clone(); hl2.position.set(1.1, 1.2, 2.95); g.add(hl2);

      // 4 കറുത്ത വീലുകൾ
      const wGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.5, 16);
      const wMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
      const wPos = [ [-1.8, 0.55, 1.8], [1.8, 0.55, 1.8], [-1.8, 0.55, -1.8], [1.8, 0.55, -1.8] ];
      wPos.forEach(p => {
        const w = new THREE.Mesh(wGeo, wMat); w.rotation.z = Math.PI / 2; w.position.set(...p); g.add(w);
      });

      g.position.set(x, 0, z);
      scene.add(g);
      return { mesh: g, type: 'car', prompt: '🚗 Drive Red Car' };
    }

    // ----------------------------------------------------
    // 🦖 2. ചിത്രത്തിൽ കാണുന്ന റിയലിസ്റ്റിക് ഗോഡ്‌സില്ല (Godzilla)
    // ----------------------------------------------------
    function createRealisticGodzilla(x, z) {
      const g = new THREE.Group();
      // പരുക്കൻ കടും ചാരനിറം
      const skinMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
      const chestMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 });

      // ഉടൽ & വയർ
      const body = new THREE.Mesh(new THREE.BoxGeometry(6, 10, 8), skinMat); body.position.y = 5.5; g.add(body);
      const chest = new THREE.Mesh(new THREE.BoxGeometry(4.8, 7, 2), chestMat); chest.position.set(0, 5.5, 4); g.add(chest);

      // തല
      const head = new THREE.Mesh(new THREE.BoxGeometry(3.5, 3.5, 5), skinMat); head.position.set(0, 11, 3.5); g.add(head);

      // നീണ്ട വാൽ (Tail)
      const tail1 = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 7), skinMat); tail1.position.set(0, 3, -6); g.add(tail1);
      const tail2 = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 7), skinMat); tail2.position.set(0, 4.5, -12); tail2.rotation.x = 0.2; g.add(tail2);

      // തിളങ്ങുന്ന നീല മുളളുകൾ (Neon Blue Dorsal Spikes)
      const spikeGeo = new THREE.ConeGeometry(0.8, 3, 4);
      const spikeMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.8 });
      for (let i = 0; i < 6; i++) {
        const sp = new THREE.Mesh(spikeGeo, spikeMat);
        sp.rotation.x = -Math.PI / 3;
        sp.position.set(0, 5 + (i * 1.3), -3 - (i * 1.5));
        g.add(sp);
      }

      g.position.set(x, 0, z);
      scene.add(g);
      return { mesh: g, type: 'godzilla', prompt: '🦖 Ride Godzilla' };
    }

    // ----------------------------------------------------
    // 🦍 3. കിംഗ് കോങ് (King Kong)
    // ----------------------------------------------------
    function createKingKong(x, z) {
      const g = new THREE.Group();
      const kMat = new THREE.MeshStandardMaterial({ color: 0x171717, roughness: 0.95 });
      const kBody = new THREE.Mesh(new THREE.BoxGeometry(6, 9, 5), kMat); kBody.position.y = 4.5; g.add(kBody);
      const kHead = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), kMat); kHead.position.set(0, 9.5, 0.5); g.add(kHead);
      g.position.set(x, 0, z);
      scene.add(g);
      return { mesh: g, type: 'kong', prompt: '🦍 Ride King Kong' };
    }

    // 🏍️ 4. സൂപ്പർ ബൈക്ക്
    function createBike(x, z) {
      const g = new THREE.Group();
      const bBody = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 2.5), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
      bBody.position.y = 0.9; g.add(bBody);
      const wGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 16);
      const wMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
      const w1 = new THREE.Mesh(wGeo, wMat); w1.rotation.z = Math.PI / 2; w1.position.set(0, 0.5, 1.2); g.add(w1);
      const w2 = new THREE.Mesh(wGeo, wMat); w2.rotation.z = Math.PI / 2; w2.position.set(0, 0.5, -1.2); g.add(w2);
      g.position.set(x, 0, z);
      scene.add(g);
      return { mesh: g, type: 'bike', prompt: '🏍️ Ride Super Bike' };
    }

    // 🚁 5. ഹെലികോപ്റ്റർ
    function createHelicopter(x, z) {
      const g = new THREE.Group();
      const hBody = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 16), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
      hBody.position.y = 1.6; g.add(hBody);
      const rotor = new THREE.Mesh(new THREE.BoxGeometry(7, 0.05, 0.5), new THREE.MeshStandardMaterial({ color: 0x111827 }));
      rotor.position.set(0, 3.2, 0); g.add(rotor);
      g.userData = { rotor };
      g.position.set(x, 0, z);
      scene.add(g);
      return { mesh: g, type: 'heli', prompt: '🚁 Fly Helicopter' };
    }

    // മാപ്പിൽ പലയിടത്തായി വാഹനങ്ങളും ജയന്റ്സും വിന്യസിക്കുന്നു
    const worldInteractables = [
      createCartoonRedCar(0, 56),
      createCartoonRedCar(-55, 10),
      createBike(25, 52),
      createBike(-30, 48),
      createHelicopter(-15, -70),
      createRealisticGodzilla(-70, 40),
      createKingKong(70, 40)
    ];

    // 🏔️ റിയലിസ്റ്റിക് മലനിരകൾ (Mountain Range)
    const mountain = new THREE.Mesh(new THREE.ConeGeometry(40, 50, 16), new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 }));
    mountain.position.set(-110, 23, -80);
    scene.add(mountain);

    // 🌋 ലാവ അഗ്നിപർവ്വതം (Volcano)
    const volcano = new THREE.Mesh(new THREE.ConeGeometry(45, 45, 16), new THREE.MeshStandardMaterial({ color: 0x262626 }));
    volcano.position.set(110, 20, -90);
    scene.add(volcano);

    // ⚽ ഫുട്ബോൾ സ്റ്റേഡിയം
    const football = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }));
    football.position.set(0, 0.7, -20);
    scene.add(football);

    const goalPost = new THREE.Mesh(new THREE.BoxGeometry(12, 6, 0.5), new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true }));
    goalPost.position.set(0, 3, -40);
    scene.add(goalPost);

    // 🌋 ലാവ പാർക്കൂർ പ്ലാറ്റ്‌ഫോമുകൾ
    for (let i = 0; i < 7; i++) {
      const plat = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.8, 0.8, 16), new THREE.MeshStandardMaterial({ color: 0xf97316, emissive: 0xe11d48, emissiveIntensity: 0.5 }));
      plat.position.set(70 + (i * 6), 2 + (i * 2.5), -60 - (i * 5));
      scene.add(plat);
    }

    // 🧑‍🤝‍🧑 പ്ലെയർ അവതാർ
    let myPlayer = new THREE.Group();
    scene.add(myPlayer);

    function buildAvatar() {
      while(myPlayer.children.length > 0) myPlayer.remove(myPlayer.children[0]);

      const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.4, 0.7), new THREE.MeshStandardMaterial({ color: userColor }));
      body.position.y = 1.4; myPlayer.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.44, 16, 16), new THREE.MeshStandardMaterial({ color: '#ffd166' }));
      head.position.y = 2.4; myPlayer.add(head);

      if (userGender === 'girl') {
        const hair = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1, 0.95), new THREE.MeshStandardMaterial({ color: 0x7c2d12 }));
        hair.position.set(0, 2.5, -0.1); myPlayer.add(hair);
      } else {
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.48, 0.22, 12), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        cap.position.y = 2.85; myPlayer.add(cap);
      }

      const legMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.85, 0.45), legMat); legL.position.set(-0.28, 0.42, 0); myPlayer.add(legL);
      const legR = legL.clone(); legR.position.set(0.28, 0.42, 0); myPlayer.add(legR);

      myPlayer.userData = { body, legL, legR };
    }
    buildAvatar();

    // രജിസ്ട്രേഷൻ
    socket.emit('registerUser', {
      name: tg?.initDataUnsafe?.user?.first_name || "Gokul",
      telegramId: tg?.initDataUnsafe?.user?.id || 1689374364,
      gender: userGender,
      shirtColor: userColor
    });

    socket.on('ownerVerified', (d) => {
      isOwner = d.isOwner;
      unlockedBeast = d.unlockedBeast;
      if (isOwner) document.getElementById('owner-tag').classList.remove('hidden');
      renderRooms(d.rooms);
    });

    // 👆 ക്യാമറ 360° ടച്ച് ഡ്രാഗ്
    let isDragging = false, prevX = 0, cameraAngle = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#joystick-base') || e.target.closest('#ui-layer') || e.target.closest('button')) return;
      isDragging = true; prevX = e.touches[0].clientX;
    });
    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const curX = e.touches[0].clientX;
      cameraAngle -= (curX - prevX) * 0.008;
      prevX = curX;
    });
    window.addEventListener('touchend', () => { isDragging = false; });

    // 🕹️ ജോയ്സ്റ്റിക്ക്
    let moveX = 0, moveZ = 0;
    const jBase = document.getElementById('joystick-base');
    const jStick = document.getElementById('joystick-stick');
    const center = { x: 55, y: 55 };

    function touchHandler(cx, cy) {
      const b = jBase.getBoundingClientRect();
      let dx = cx - b.left - center.x;
      let dy = cy - b.top - center.y;
      const dist = Math.hypot(dx, dy);
      const maxR = 35;
      if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
      jStick.style.left = `${center.x + dx - 20}px`;
      jStick.style.top = `${center.y + dy - 20}px`;
      moveX = dx / maxR;
      moveZ = dy / maxR;
    }

    const clearTouch = () => { jStick.style.left = '35px'; jStick.style.top = '35px'; moveX = 0; moveZ = 0; };
    jBase.addEventListener('touchstart', (e) => { e.preventDefault(); touchHandler(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });
    jBase.addEventListener('touchmove', (e) => { e.preventDefault(); touchHandler(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });
    jBase.addEventListener('touchend', clearTouch);
    jBase.addEventListener('touchcancel', clearTouch);

    // മോഡലുകൾ
    window.openBox = (id) => document.getElementById(id).classList.remove('hidden');
    window.closeBox = (id) => document.getElementById(id).classList.add('hidden');

    window.setCharGender = (g) => { userGender = g; buildAvatar(); };
    window.setCharColor = (c) => { userColor = c; buildAvatar(); };
    window.changeServer = (k, name) => { closeBox('country-box'); alert(`🌍 Connected to ${name}!`); };
    window.setGameLanguage = (l) => { closeBox('lang-box'); alert(`Language changed to ${l.toUpperCase()}!`); };

    // പ്രോക്സിമിറ്റി റൈഡ് സിസ്റ്റം (അടുത്തെത്തുമ്പോൾ കയറാൻ)
    let nearbyTarget = null;
    function checkProximityToVehicles() {
      if (activeRide !== 'walk') {
        document.getElementById('proximity-prompt').style.display = 'none';
        return;
      }
      let found = null;
      for (let item of worldInteractables) {
        const d = myPlayer.position.distanceTo(item.mesh.position);
        if (d < 6) {
          found = item;
          break;
        }
      }
      const promptBtn = document.getElementById('proximity-prompt');
      if (found) {
        nearbyTarget = found;
        promptBtn.innerText = found.prompt;
        promptBtn.style.display = 'block';
      } else {
        nearbyTarget = null;
        promptBtn.style.display = 'none';
      }
    }

    window.interactWithNearbyObject = () => {
      if (!nearbyTarget) return;
      if (['godzilla', 'kong'].includes(nearbyTarget.type) && !unlockedBeast && !isOwner) {
        openBox('stars-box');
        alert("⭐ Giants require Beast Pass!");
        return;
      }
      activeRide = nearbyTarget.type;
      document.getElementById('proximity-prompt').style.display = 'none';
      document.getElementById('dismount-btn').style.display = 'block';

      if (activeRide === 'car') myPlayer.position.set(nearbyTarget.mesh.position.x, 1.2, nearbyTarget.mesh.position.z);
      if (activeRide === 'bike') myPlayer.position.set(nearbyTarget.mesh.position.x, 1, nearbyTarget.mesh.position.z);
      if (activeRide === 'godzilla') myPlayer.position.set(nearbyTarget.mesh.position.x, 11, nearbyTarget.mesh.position.z);
      if (activeRide === 'kong') myPlayer.position.set(nearbyTarget.mesh.position.x, 10, nearbyTarget.mesh.position.z);
      if (activeRide === 'heli') myPlayer.position.set(nearbyTarget.mesh.position.x, 22, nearbyTarget.mesh.position.z);
    };

    window.dismountActiveRide = () => {
      activeRide = 'walk';
      myPlayer.position.y = 0;
      document.getElementById('dismount-btn').style.display = 'none';
      alert("🚶 Dismounted to normal walk!");
    };

    // ഗെയിം സോണുകളിലേക്ക് ടെലിപോർട്ട് ചെയ്യൽ
    window.teleportFootballZone = () => {
      myPlayer.position.set(0, 0, -10);
      document.getElementById('game-hud').style.display = 'block';
      document.getElementById('kick-ball-btn').style.display = 'flex';
      alert("⚽ Football Stadium! Walk to ball & press KICK!");
    };

    window.teleportParkourZone = () => {
      myPlayer.position.set(68, 2, -58);
      alert("🌋 Lava Parkour Started! Jump on glowing platforms!");
    };

    window.teleportMountainPeak = () => {
      myPlayer.position.set(mountain.position.x, 48, mountain.position.z);
      document.getElementById('dismount-btn').style.display = 'block';
      alert("🏔️ Reached Mountain Peak!");
    };

    // ⚽ കിക്ക് ബട്ടൺ വഴി ബോൾ തട്ടൽ
    let ballSpeedZ = 0;
    window.triggerBallKick = () => {
      const d = myPlayer.position.distanceTo(football.position);
      if (d < 4) {
        ballSpeedZ = 1.2;
      } else {
        alert("⚽ Walk closer to the ball to kick!");
      }
    };

    // 🎙️ എപ്പോഴും കാണുന്ന ലൈവ് വോയ്‌സ് മൈക്ക്
    let isVoiceActive = false, voiceRecorder = null, voiceStream = null;
    window.toggleAlwaysVoiceMic = async () => {
      const btn = document.getElementById('mic-float-btn');
      if (!isVoiceActive) {
        try {
          voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          voiceRecorder = new MediaRecorder(voiceStream);
          voiceRecorder.ondataavailable = (e) => {
            if (e.data.size > 0 && isVoiceActive) {
              const r = new FileReader();
              r.onload = () => socket.emit('voiceTalkStream', r.result);
              r.readAsDataURL(e.data);
            }
          };
          voiceRecorder.start(250);
          isVoiceActive = true;
          btn.classList.remove('muted');
          btn.innerText = "🎙️";
          alert("🎙️ Voice LIVE! Everyone can hear you talk.");
        } catch (err) { alert("Mic Permission: " + err.message); }
      } else {
        isVoiceActive = false;
        if (voiceRecorder) voiceRecorder.stop();
        if (voiceStream) voiceStream.getTracks().forEach(t => t.stop());
        btn.classList.add('muted');
        btn.innerText = "🔇";
        alert("🔇 Mic Muted.");
      }
    };
    socket.on('incomingLiveVoice', (d) => new Audio(d.audio).play().catch(() => {}));

    // സ്റ്റാർസ് പർച്ചേസ്
    window.purchaseStarsItem = (title, type, stars) => {
      closeBox('stars-box');
      socket.emit('requestStarsAction', { title, desc: title, type, stars });
    };
    socket.on('openOfficialInvoice', (d) => {
      if (tg?.openInvoice) tg.openInvoice(d.invoiceUrl, (st) => { if (st === 'paid') alert("⭐ Stars Paid! Features Unlocked."); });
      else window.open(d.invoiceUrl, '_blank');
    });

    // ഗ്രൂപ്പ് റൂമുകൾ
    function renderRooms(rooms) {
      const c = document.getElementById('room-buttons');
      c.innerHTML = '';
      rooms.forEach(r => {
        c.innerHTML += `<button onclick="switchRoom('${r}')" class="btn-act">#${r}</button>`;
      });
    }
    window.switchRoom = (r) => { closeBox('room-box'); socket.emit('joinChatRoom', r); };
    window.createRoomAction = () => {
      const inp = document.getElementById('new-group-name');
      if (inp.value.trim()) { socket.emit('createNewRoom', inp.value.trim()); inp.value = ''; }
    };

    window.sendChatMessage = () => {
      const f = document.getElementById('chat-txt');
      if (f.value.trim()) { socket.emit('roomChatMessage', { text: f.value.trim() }); f.value = ''; }
    };
    socket.on('broadcastRoomChat', (d) => {
      const c = document.getElementById('chat-content');
      c.innerHTML += `<div><strong>${d.sender}:</strong> ${d.text}</div>`;
      c.scrollTop = c.scrollHeight;
    });

    // ആനിമേഷൻ ലൂപ്പ്
    let wCycle = 0;
    function animate() {
      requestAnimationFrame(animate);

      checkProximityToVehicles();

      // ഹെലികോപ്റ്റർ റോട്ടർ കറങ്ങൽ
      worldInteractables.forEach(i => {
        if (i.mesh.userData?.rotor) i.mesh.userData.rotor.rotation.y += 0.25;
      });

      const spd = ['godzilla', 'kong'].includes(activeRide) ? 0.7 : (['car', 'bike', 'heli'].includes(activeRide) ? 0.9 : 0.4);

      if (moveX !== 0 || moveZ !== 0) {
        const forwardX = moveX * Math.cos(cameraAngle) + moveZ * Math.sin(cameraAngle);
        const forwardZ = -moveX * Math.sin(cameraAngle) + moveZ * Math.cos(cameraAngle);

        myPlayer.position.x += forwardX * spd;
        myPlayer.position.z += forwardZ * spd;
        myPlayer.rotation.y = Math.atan2(forwardX, forwardZ);

        wCycle += 0.2;
        if (myPlayer.userData.legL) {
          myPlayer.userData.legL.rotation.x = Math.sin(wCycle) * 0.6;
          myPlayer.userData.legR.rotation.x = -Math.sin(wCycle) * 0.6;
        }

        // വാഹനം അല്ലെങ്കിൽ ജീവി ഒപ്പം നീങ്ങുന്നു
        if (nearbyTarget && activeRide !== 'walk') {
          nearbyTarget.mesh.position.set(myPlayer.position.x, 0, myPlayer.position.z);
          nearbyTarget.mesh.rotation.y = myPlayer.rotation.y;
        }

        socket.emit('updatePosition', { x: myPlayer.position.x, y: myPlayer.position.y, z: myPlayer.position.z });
      }

      // ഫുട്ബോൾ കിക്ക് ഫിസിക്സ്
      if (ballSpeedZ > 0) {
        football.position.z -= ballSpeedZ;
        football.rotation.x -= 0.1;
        ballSpeedZ *= 0.97;
        if (football.position.z <= -39 && Math.abs(football.position.x) < 6) {
          ballSpeedZ = 0;
          football.position.set(0, 0.7, -20);
          goalsScored++;
          userPts += 50;
          document.getElementById('goal-count').innerText = goalsScored;
          document.getElementById('pts').innerText = userPts;
          alert("⚽ GOAAAAL! +50 Points Added! 🎉");
        }
      }

      const camDist = 14;
      camera.position.x = myPlayer.position.x + Math.sin(cameraAngle) * camDist;
      camera.position.y = myPlayer.position.y + 8;
      camera.position.z = myPlayer.position.z + Math.cos(cameraAngle) * camDist;
      camera.lookAt(myPlayer.position.x, myPlayer.position.y + 2, myPlayer.position.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
