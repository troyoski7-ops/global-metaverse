<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <div id="ui-layer">
    <!-- മുകളിലെ വരി (സ്ക്രോൾ ചെയ്യാവുന്നത്) -->
    <div class="top-nav">
      <div id="owner-tag" class="owner-pill hidden">👑 OWNER</div>
      <div class="points-badge">🪙 <span id="user-points">100</span></div>
      <button class="nav-btn" onclick="takeSelfie()">📸 Selfie Zone</button>
      <button class="nav-btn mic-free" id="mic-btn">🎙️ Free Mic</button>
      <button class="nav-btn video-star" onclick="startVideoCall()">📹 Video Call</button>
    </div>

    <!-- ഗെയിംസ് ബട്ടൺ -->
    <div class="game-launcher">
      <button onclick="openGamesModal()">🎮 Games</button>
    </div>

    <!-- വാഹനങ്ങൾ -->
    <div class="action-dock">
      <button onclick="setMoveMode('walk')">🏃 Walk</button>
      <button onclick="setMoveMode('bike')">🏍️ Bike</button>
      <button onclick="setMoveMode('elephant')">🐘 Elephant</button>
      <button onclick="setMoveMode('beast')" class="star-btn">🦖 Ride Dino</button>
      <button onclick="setMoveMode('heli')">🚁 Helicopter</button>
      <button onclick="setMoveMode('ship')">🚢 Ship</button>
    </div>

    <!-- മൊബൈലിൽ നടക്കാനുള്ള ടച്ച് ബട്ടണുകൾ -->
    <div class="touch-controls">
      <div></div>
      <button class="touch-btn" id="btn-up">⬆️</button>
      <div></div>
      <button class="touch-btn" id="btn-left">⬅️</button>
      <div></div>
      <button class="touch-btn" id="btn-right">➡️</button>
      <div></div>
      <button class="touch-btn" id="btn-down">⬇️</button>
      <div></div>
    </div>

    <!-- ചാറ്റ് ബോക്സ് -->
    <div class="chat-wrapper">
      <div id="chat-messages"></div>
      <div class="emoji-bar">
        <span onclick="sendEmoji('❤️')">❤️</span>
        <span onclick="sendEmoji('🔥')">🔥</span>
        <span onclick="sendEmoji('👏')">👏</span>
        <span onclick="sendEmoji('🎉')">🎉</span>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chat-field" placeholder="Chat...">
        <button onclick="dispatchChat()">Send</button>
      </div>
    </div>
  </div>

  <div id="selfie-banner" class="banner hidden">
    <span>🌟 Near <strong id="star-name">BTS Zone</strong></span>
    <button onclick="takeSelfie()">📸 Click</button>
  </div>

  <div id="beast-modal" class="modal hidden">
    <div class="modal-card">
      <h3>🦖 Unlock Godzilla / Dino Ride</h3>
      <button onclick="redeemWithPoints()" class="action-btn">🪙 500 Points</button>
      <button onclick="buyWithStars()" class="star-full-btn">⭐ 50 Stars</button>
      <button onclick="closeBeastModal()" class="close-btn">Cancel</button>
    </div>
  </div>

  <div id="games-modal" class="modal hidden">
    <div class="modal-card">
      <h3>🎮 Mini Games</h3>
      <button onclick="playMiniGame('football')" class="action-btn">⚽ Football (+50 pts)</button>
      <button onclick="playMiniGame('dice')" class="action-btn">🎲 Lucky Dice (+30 pts)</button>
      <button onclick="playMiniGame('parkour')" class="action-btn">🌋 Lava Parkour (+100 pts)</button>
      <button onclick="closeGamesModal()" class="close-btn">Close</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
