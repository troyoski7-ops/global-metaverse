<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe GTA Ultra</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top Bar HUD */
    .top-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 5px; z-index: 40; }
    .top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .badges { display: flex; gap: 5px; }
    .badge { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); color: #fff; padding: 5px 10px; border-radius: 16px; font-size: 11px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); }
    .badge.stars { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
    .badge.room { background: #0284c7; cursor: pointer; }

    .comm-btns { display: flex; gap: 5px; }
    .btn-circle { width: 36px; height: 36px; border-radius: 50%; background: rgba(15, 23, 42, 0.9); border: 1.5px solid rgba(255,255,255,0.2); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-circle.active { background: #22c55e; box-shadow: 0 0 10px #22c55e; }

    /* Scoreboard */
    #score-hud { position: absolute; top: 80px; left: 8px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid #38bdf8; border-radius: 12px; padding: 8px 12px; color: #fff; font-size: 11px; font-weight: 700; z-index: 30; }
    .row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 2px; }
    .val { color: #38bdf8; font-family: monospace; }

    /* Chat */
    #chat-box { position: absolute; bottom: 20px; left: 110px; width: 180px; background: rgba(15, 23, 42, 0.9); border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); padding: 6px; z-index: 30; }
    #chat-msgs { height: 45px; overflow-y: auto; font-size: 10px; color: #fff; margin-bottom: 4px; }
    .msg { background: rgba(255,255,255,0.08); padding: 2px 4px; border-radius: 4px; margin-bottom: 2px; }
    .chat-in { display: flex; gap: 4px; }
    #chat-input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #fff; font-size: 10px; padding: 2px 4px; }
    #chat-btn { background: #0284c7; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

    /* Controls */
    #speedo { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); color: #38bdf8; border: 1px solid #38bdf8; padding: 4px 14px; border-radius: 16px; font-size: 12px; font-weight: bold; display: none; z-index: 35; }
    #action-btn { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: #0284c7; color: #fff; border: 2px solid #fff; padding: 10px 22px; border-radius: 25px; font-size: 12px; font-weight: 900; display: none; z-index: 35; }
    #dismount-btn { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; border: 1px solid #fff; padding: 6px 16px; border-radius: 16px; font-size: 11px; font-weight: bold; display: none; z-index: 40; }
    #jump-btn { position: absolute; bottom: 40px; right: 20px; width: 62px; height: 62px; border-radius: 50%; background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; color: #fff; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; z-index: 35; }
    
    .car-pedals { position: absolute; bottom: 30px; right: 18px; display: none; flex-direction: column; gap: 6px; z-index: 35; }
    .pedal { width: 65px; height: 42px; border-radius: 10px; border: 1.5px solid #fff; color: #fff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    #pedal-gas { background: #22c55e; }
    #pedal-brake { background: #ef4444; }

    #joy-base { position: absolute; left: 14px; bottom: 25px; width: 90px; height: 90px; background: rgba(15, 23, 42, 0.6); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); z-index: 30; }
    #joy-stick { position: absolute; left: 27px; top: 27px; width: 36px; height: 36px; background: #38bdf8; border-radius: 50%; pointer-events: none; }

    /* Modals */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; }
    .modal-content { background: #0f172a; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 16px; width: 300px; color: #fff; display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-row">
      <div class="badges">
        <div class="badge stars">⭐ <span id="hud-stars">0</span> STARS</div>
        <div class="badge room" onclick="openRoomModal()">🚪 <span id="room-label">Public Room</span></div>
        <div class="badge">🟢 <span id="online-count">1</span> Online</div>
      </div>
      <div class="comm-btns">
        <button id="mic-btn" class="btn-circle" onclick="toggleMic()">🎙</button>
      </div>
    </div>
  </div>

  <!-- Score HUD -->
  <div id="score-hud">
    <div class="row"><span>⚽ Penalty Goals:</span><span id="hud-goals" class="val">0</span></div>
    <div class="row"><span>🏀 Baskets:</span><span id="hud-baskets" class="val">0</span></div>
    <div class="row"><span>🏎️ Track Lap:</span><span id="hud-lap" class="val">1/3</span></div>
  </div>

  <!-- Controls -->
  <div id="speedo">0 KM/H</div>
  <button id="action-btn" onclick="triggerAction()">ACTION</button>
  <button id="dismount-btn" onclick="exitVehicle()">🚪 Exit Car</button>
  <button id="jump-btn" onclick="doJump()">JUMP</button>

  <div class="car-pedals" id="car-pedals">
    <button id="pedal-gas" class="pedal">GAS 🏎️️</button>
    <button id="pedal-brake" class="pedal">BRAKE 🛑</button>
  </div>

  <div id="joy-base"><div id="joy-stick"></div></div>

  <!-- Chat -->
  <div id="chat-box">
    <div id="chat-msgs"><div class="msg"><b>System:</b> Connected to Server!</div></div>
    <div class="chat-in">
      <input type="text" id="chat-input" placeholder="Chat..." maxlength="40">
      <button id="chat-btn" onclick="sendChat()">Send</button>
    </div>
  </div>

  <!-- Room Modal -->
  <div id="room-modal" class="modal">
    <div class="modal-content">
      <h3>🎮 GTA Room / Server</h3>
      <input type="text" id="room-input" style="padding:8px; border-radius:6px; background:#1e293b; color:#fff; border:1px solid #38bdf8;" placeholder="Enter Room Name">
      <div style="display:flex; gap:6px;">
        <button onclick="joinCustomRoom()" style="flex:1; padding:8px; background:#0284c7; color:#fff; border:none; border-radius:6px; font-weight:bold;">Join Room</button>
        <button onclick="closeModal('room-modal')" style="flex:1; padding:8px; background:#64748b; color:#fff; border:none; border-radius:6px; font-weight:bold;">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentRoom = "Global";

    function openRoomModal() { document.getElementById('room-modal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function joinCustomRoom() {
      const r = document.getElementById('room-input').value.trim();
      if (r) {
        currentRoom = r;
        document.getElementById('room-label').innerText = "Room: " + r;
        socket.emit('joinRoom', { room: r, player: playerName });
      }
      closeModal('room-modal');
    }

    // Audio SFX
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioContext();
    function playSfx(type) {
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);
      const now = actx.currentTime;

      if (type === 'kick') {
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'goal') {
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.15);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'engine') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(70, now);
        osc.frequency.linearRampToValueAtTime(130, now + 0.2);
        gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'roar') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.7);
        gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.7);
        osc.start(now); osc.stop(now + 0.7);
      }
    }

    let isMicOn = false;
    window.toggleMic = async () => {
      const btn = document.getElementById('mic-btn');
      if (!isMicOn) {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ audio: true });
          isMicOn = true; btn.classList.add('active');
          const src = actx.createMediaStreamSource(s);
          src.connect(actx.destination);
        } catch(e) { alert("Mic Permission Denied!"); }
      } else {
        isMicOn = false; btn.classList.remove('active');
      }
    };

    // =========================================================
    // THREE.JS SCENE SETUP (COMPACT GTA WORLD)
    // =========================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 1.2);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfffaed, 1.8);
    sun.position.set(60, 100, 50);
    sun.castShadow = true;
    scene.add(sun);

    // 1. Compact Island (ചെറിയ ദ്വീപ് - Radius: 90m)
    const island = new THREE.Mesh(
      new THREE.CylinderGeometry(85, 95, 2, 48),
      new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.9 })
    );
    island.position.y = 0;
    island.receiveShadow = true;
    scene.add(island);

    // 2. Surrounding Ocean (കടൽ)
    const ocean = new THREE.Mesh(
      new THREE.PlaneGeometry(1200, 1200),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2, metalness: 0.6 })
    );
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = -0.6;
    scene.add(ocean);

    // 3. GTA Asphalt Road & Racing Circuit (കാർ പുറത്ത് പോകാതിരിക്കാൻ ബാരിയർ സഹിതം)
    const roadRing = new THREE.Mesh(
      new THREE.RingGeometry(55, 68, 48),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 })
    );
    roadRing.rotation.x = -Math.PI / 2;
    roadRing.position.y = 1.02;
    scene.add(roadRing);

    // Road Outer Guardrail (Barrier)
    const guardRail = new THREE.Mesh(
      new THREE.CylinderGeometry(68.5, 68.5, 1.2, 48, 1, true),
      new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.6 })
    );
    guardRail.position.y = 1.6;
    scene.add(guardRail);

    // 4. Loader for GLB
    const loader = new THREE.GLTFLoader();
    function loadGLB(file, size, cb) {
      const run = (gltf) => {
        const root = gltf.scene;
        const b = new THREE.Box3().setFromObject(root);
        const s = new THREE.Vector3(); b.getSize(s);
        const m = Math.max(s.x, s.y, s.z);
        if (m > 0 && size) root.scale.setScalar(size / m);
        cb(root);
      };
      loader.load(file, run, undefined, () => loader.load('/' + file, run));
    }

    // GTA City Buildings (Walkable Town Center)
    for (let i = 0; i < 8; i++) {
      const h = 8 + Math.random() * 12;
      const bldg = new THREE.Mesh(
        new THREE.BoxGeometry(10, h, 10),
        new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 })
      );
      const ang = (i / 8) * Math.PI * 2;
      bldg.position.set(Math.cos(ang) * 25, h / 2 + 1, Math.sin(ang) * 25);
      bldg.castShadow = true;
      scene.add(bldg);
    }

    // Ferris Wheel (Strictly on Ground)
    loadGLB('ferris_wheel.glb', 12, m => {
      m.position.set(38, 1.0, 38);
      scene.add(m);
    });

    // Elephant (Strictly Fixed to Ground - No sinking)
    loadGLB('elephant.glb', 4, m => {
      m.position.set(-20, 1.0, -20);
      scene.add(m);
    });

    // Godzilla (NPC Animation Only - NOT Rideable)
    let godzilla = null;
    loadGLB('godzilla.glb', 10, m => {
      m.position.set(-45, 1.0, 0);
      scene.add(m);
      godzilla = m;
    });

    // Shark & Whale (Strictly in Sea - Radius > 95m)
    let shark = null, whale = null;
    loadGLB('shark.glb', 4, m => { m.position.set(110, -0.6, 20); scene.add(m); shark = m; });
    loadGLB('Whale.glb', 8, m => { m.position.set(-115, -0.6, -40); scene.add(m); whale = m; });

    // Penalty Football Field (Interactive Shoot)
    const goalPost = new THREE.Mesh(
      new THREE.BoxGeometry(6, 3, 1),
      new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true })
    );
    goalPost.position.set(0, 2.5, -45);
    scene.add(goalPost);

    const fBall = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
    );
    fBall.position.set(0, 1.4, -38);
    scene.add(fBall);

    // Basketball Hoop & Court
    const hoop = new THREE.Mesh(
      new THREE.TorusGeometry(0.5, 0.08, 8, 16),
      new THREE.MeshStandardMaterial({ color: 0xea580c })
    );
    hoop.rotation.x = Math.PI / 2;
    hoop.position.set(35, 3.5, -15);
    scene.add(hoop);

    // Driveable GTA Car on Track
    const carGroup = new THREE.Group();
    carGroup.position.set(62, 1.2, 0);
    scene.add(carGroup);
    loadGLB('car.glb', 2.4, m => carGroup.add(m));

    // Player
    const player = new THREE.Group();
    player.position.set(0, 1.0, 0);
    scene.add(player);
    const avatar = new THREE.Group();
    player.add(avatar);
    loadGLB('man.glb', 2.0, m => avatar.add(m));

    // Multiplayer Players Sync Map
    const otherPlayers = {};
    socket.on('playerJoined', (data) => {
      document.getElementById('online-count').innerText = data.count;
      if (data.id !== socket.id && !otherPlayers[data.id]) {
        const op = new THREE.Group();
        loadGLB('man.glb', 2.0, m => op.add(m));
        scene.add(op);
        otherPlayers[data.id] = op;
      }
    });

    socket.on('playerMoved', (data) => {
      if (otherPlayers[data.id]) {
        otherPlayers[data.id].position.set(data.x, data.y, data.z);
        otherPlayers[data.id].rotation.y = data.rotY;
      }
    });

    socket.on('playerLeft', (data) => {
      document.getElementById('online-count').innerText = data.count;
      if (otherPlayers[data.id]) {
        scene.remove(otherPlayers[data.id]);
        delete otherPlayers[data.id];
      }
    });

    // Controls Logic
    let inCar = false;
    let carSpeed = 0;
    let isGas = false, isBrake = false;
    let joyX = 0, joyZ = 0;
    let camRotX = 0;
    let goals = 0, baskets = 0;

    document.getElementById('pedal-gas').addEventListener('touchstart', e => { e.preventDefault(); isGas = true; });
    document.getElementById('pedal-gas').addEventListener('touchend', () => isGas = false);
    document.getElementById('pedal-brake').addEventListener('touchstart', e => { e.preventDefault(); isBrake = true; });
    document.getElementById('pedal-brake').addEventListener('touchend', () => isBrake = false);

    const joyBase = document.getElementById('joy-base');
    const joyStick = document.getElementById('joy-stick');
    joyBase.addEventListener('touchmove', e => {
      e.preventDefault();
      const b = joyBase.getBoundingClientRect();
      let dx = e.touches[0].clientX - b.left - 45;
      let dy = e.touches[0].clientY - b.top - 45;
      const d = Math.hypot(dx, dy);
      if (d > 28) { dx = (dx / d) * 28; dy = (dy / d) * 28; }
      joyStick.style.left = `${45 + dx - 18}px`;
      joyStick.style.top = `${45 + dy - 18}px`;
      joyX = dx / 28; joyZ = dy / 28;
    }, { passive: false });
    joyBase.addEventListener('touchend', () => { joyStick.style.left = '27px'; joyStick.style.top = '27px'; joyX = 0; joyZ = 0; });

    let isDrag = false, px = 0;
    window.addEventListener('touchstart', e => {
      if (e.target.closest('#joy-base') || e.target.closest('button')) return;
      isDrag = true; px = e.touches[0].clientX;
    });
    window.addEventListener('touchmove', e => {
      if (!isDrag) return;
      camRotX -= (e.touches[0].clientX - px) * 0.005;
      px = e.touches[0].clientX;
    });
    window.addEventListener('touchend', () => isDrag = false);

    function doJump() {
      if (player.position.y <= 1.2 && !inCar) player.position.y = 2.8;
    }

    // Trigger Interaction (Enter Car / Kick Penalty / Shoot Hoop)
    const actBtn = document.getElementById('action-btn');
    let actType = null;
    function checkInteractions() {
      if (inCar) { actBtn.style.display = 'none'; return; }
      const p = player.position;

      // 1. Enter Car
      if (p.distanceTo(carGroup.position) < 4) {
        actType = 'car'; actBtn.innerText = "🏎️ DRIVE GTA CAR"; actBtn.style.display = 'block'; return;
      }
      // 2. Penalty Kick
      if (p.distanceTo(fBall.position) < 2.5) {
        actType = 'kick'; actBtn.innerText = "⚽ PENALTY KICK"; actBtn.style.display = 'block'; return;
      }
      // 3. Shoot Basket
      if (p.distanceTo(new THREE.Vector3(35, 1, -15)) < 3.5) {
        actType = 'basket'; actBtn.innerText = "🏀 SHOOT BASKET"; actBtn.style.display = 'block'; return;
      }

      actBtn.style.display = 'none';
      actType = null;
    }

    window.triggerAction = () => {
      if (actType === 'car') {
        inCar = true;
        carGroup.add(avatar);
        avatar.position.set(0, 0.4, 0); // Driver Seat
        document.getElementById('car-pedals').style.display = 'flex';
        document.getElementById('speedo').style.display = 'block';
        document.getElementById('dismount-btn').style.display = 'block';
        document.getElementById('jump-btn').style.display = 'none';
      } else if (actType === 'kick') {
        playSfx('kick');
        fBall.position.set(0, 2.2, -45); // Into goal
        setTimeout(() => {
          playSfx('goal');
          goals++;
          document.getElementById('hud-goals').innerText = goals;
          fBall.position.set(0, 1.4, -38);
        }, 500);
      } else if (actType === 'basket') {
        baskets += 2;
        document.getElementById('hud-baskets').innerText = baskets;
        playSfx('goal');
      }
    };

    window.exitVehicle = () => {
      if (!inCar) return;
      inCar = false;
      player.add(avatar);
      avatar.position.set(0, 0, 0);
      player.position.set(carGroup.position.x + 3, 1.0, carGroup.position.z);
      document.getElementById('car-pedals').style.display = 'none';
      document.getElementById('speedo').style.display = 'none';
      document.getElementById('dismount-btn').style.display = 'none';
      document.getElementById('jump-btn').style.display = 'flex';
      carSpeed = 0;
    };

    // Chat
    function sendChat() {
      const inp = document.getElementById('chat-input');
      const txt = inp.value.trim();
      if (!txt) return;
      socket.emit('chatMessage', { room: currentRoom, sender: playerName, text: txt });
      inp.value = '';
    }
    socket.on('chatMessage', d => {
      const b = document.getElementById('chat-msgs');
      const m = document.createElement('div');
      m.className = 'msg'; m.innerHTML = `<b>${d.sender}:</b> ${d.text}`;
      b.appendChild(m); b.scrollTop = b.scrollHeight;
    });

    // Render Loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      checkInteractions();
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Godzilla Breathing & Growl
      if (godzilla) {
        godzilla.position.y = 1.0 + Math.sin(time * 2) * 0.1;
        godzilla.rotation.y = Math.sin(time * 0.5) * 0.2;
      }

      // Sea Animals restricted to Ocean
      if (shark) shark.position.x = 110 + Math.sin(time * 0.8) * 15;
      if (whale) whale.position.z = -115 + Math.cos(time * 0.6) * 15;

      // On-Foot Walking (GTA Style)
      if (!inCar) {
        if (joyX !== 0 || joyZ !== 0) {
          const fx = joyX * Math.cos(camRotX) + joyZ * Math.sin(camRotX);
          const fz = -joyX * Math.sin(camRotX) + joyZ * Math.cos(camRotX);
          player.position.x += fx * 0.45;
          player.position.z += fz * 0.45;
          player.rotation.y = Math.atan2(fx, fz);

          // Boundary: Keep on Island
          const dist = Math.hypot(player.position.x, player.position.z);
          if (dist > 82) {
            player.position.x = (player.position.x / dist) * 82;
            player.position.z = (player.position.z / dist) * 82;
          }

          socket.emit('playerMove', { room: currentRoom, x: player.position.x, y: player.position.y, z: player.position.z, rotY: player.rotation.y });
        }
        if (player.position.y > 1.0) player.position.y = Math.max(1.0, player.position.y - 0.1);
      } 
      // Car Driving Physics (Circuit Restricted)
      else {
        if (isGas) { carSpeed = Math.min(carSpeed + 0.05, 1.8); playSfx('engine'); }
        else if (isBrake) { carSpeed = Math.max(carSpeed - 0.06, -0.4); }
        else { carSpeed *= 0.96; }

        carGroup.rotation.y -= joyX * 0.04;
        const nx = carGroup.position.x + Math.sin(carGroup.rotation.y) * carSpeed;
        const nz = carGroup.position.z + Math.cos(carGroup.rotation.y) * carSpeed;

        // Keep car strictly inside track (Radius between 54m and 67m)
        const cDist = Math.hypot(nx, nz);
        if (cDist >= 54 && cDist <= 67) {
          carGroup.position.x = nx;
          carGroup.position.z = nz;
        } else {
          carSpeed = 0; // Collide with barrier
        }

        player.position.copy(carGroup.position);
        document.getElementById('speedo').innerText = `${Math.abs(Math.round(carSpeed * 65))} KM/H`;
      }

      // Camera Follow
      const target = inCar ? carGroup.position : player.position;
      camera.position.x = target.x + Math.sin(camRotX) * 14;
      camera.position.y = target.y + 5;
      camera.position.z = target.z + Math.cos(camRotX) * 14;
      camera.lookAt(target.x, target.y + 1.2, target.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
