<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe Metaverse GTA Island</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top HUD */
    .top-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 40; pointer-events: none; }
    .top-bar * { pointer-events: auto; }
    .hud-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .badges-group { display: flex; gap: 5px; flex-wrap: wrap; }
    .badge { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .badge.stars { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }

    .comm-btns { display: flex; gap: 6px; }
    .btn-circle { width: 38px; height: 38px; border-radius: 50%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }

    #score-hud { position: absolute; top: 88px; left: 8px; background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; border-radius: 12px; padding: 8px 12px; color: #fff; font-size: 11px; font-weight: 700; z-index: 30; }
    .score-val { color: #38bdf8; font-family: monospace; font-size: 12px; margin-left: 6px; }

    #action-btn { position: absolute; bottom: 135px; left: 50%; transform: translateX(-50%); background: #0284c7; color: #fff; border: 2px solid #fff; padding: 12px 28px; border-radius: 30px; font-size: 13px; font-weight: 900; display: none; z-index: 45; box-shadow: 0 4px 15px rgba(2,132,199,0.7); cursor: pointer; }
    #dismount-btn { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; border: 1.5px solid #fff; padding: 8px 22px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 45; cursor: pointer; }
    #speedo { position: absolute; bottom: 135px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); color: #38bdf8; border: 1px solid #38bdf8; padding: 5px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 35; }
    #swim-indicator { position: absolute; top: 88px; right: 8px; background: rgba(2, 132, 199, 0.9); border: 1px solid #fff; border-radius: 12px; padding: 6px 12px; color: #fff; font-size: 11px; font-weight: 800; display: none; z-index: 30; }

    /* Joystick */
    #joy-base { position: absolute; left: 16px; bottom: 25px; width: 100px; height: 100px; background: rgba(15, 23, 42, 0.65); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); z-index: 30; }
    #joy-stick { position: absolute; left: 32px; top: 32px; width: 36px; height: 36px; background: #38bdf8; border-radius: 50%; pointer-events: none; }

    /* Controls: Dynamic Visibility */
    .extra-controls { position: absolute; bottom: 25px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 35; align-items: flex-end; }
    .ctrl-row { display: flex; gap: 8px; }
    .btn-touch { width: 56px; height: 48px; border-radius: 12px; background: rgba(15, 23, 42, 0.88); border: 2px solid #38bdf8; color: #fff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-touch.jump { background: #0284c7; width: 58px; height: 50px; border-radius: 50%; font-size: 11px; }
    .btn-touch.gas { background: #22c55e; border-color: #4ade80; display: none; }
    .btn-touch.brake { background: #ef4444; border-color: #f87171; display: none; }
    .btn-touch.flyup { background: #8b5cf6; border-color: #a78bfa; display: none; }
    .btn-touch.flydown { background: #6366f1; border-color: #818cf8; display: none; }
    .btn-touch.sprint { background: #eab308; border-color: #fde047; color: #000; }
    .btn-touch.dance { background: #ec4899; border-color: #f472b6; display: none; }
    .btn-touch.dive { background: #06b6d4; border-color: #67e8f9; display: none; }

    /* Clean Chat Box */
    #chat-box { position: absolute; bottom: 20px; left: 125px; width: 175px; background: rgba(15, 23, 42, 0.9); border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); padding: 5px; z-index: 30; }
    .chat-tabs { display: flex; gap: 4px; margin-bottom: 4px; }
    .chat-tab { flex: 1; text-align: center; font-size: 10px; font-weight: bold; color: #94a3b8; background: rgba(0,0,0,0.4); padding: 2px; border-radius: 4px; cursor: pointer; }
    .chat-tab.active { color: #38bdf8; background: rgba(2, 132, 199, 0.4); }
    #chat-msgs { height: 42px; overflow-y: auto; font-size: 10px; color: #fff; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
    .chat-bubble { background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; word-break: break-all; }
    .chat-controls { display: flex; gap: 4px; }
    #chat-in { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #fff; font-size: 10px; padding: 2px 4px; outline: none; }
    #chat-send { background: #0284c7; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }

    /* Settings & Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
    .modal-card { background: #0f172a; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 18px; width: 320px; color: #fff; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; overflow-y: auto; }
    .modal-card h3 { font-size: 15px; color: #38bdf8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-action { background: #1e293b; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-action.primary { background: #0284c7; border-color: #38bdf8; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="hud-row">
      <div class="badges-group">
        <div class="badge stars" onclick="openModal('stars-modal')">⭐ <span id="hud-stars">350</span> STARS</div>
        <div class="badge" onclick="openMasterSettings()">🚪 <span id="hud-room">Global</span></div>
        <div class="badge">🟢 <span id="hud-online">1</span> Online</div>
      </div>
      <div class="comm-btns">
        <button id="btn-mic" class="btn-circle" onclick="toggleMicrophone()">🎙</button>
        <button class="btn-circle" onclick="openModal('weather-modal')">⛅</button>
        <button class="btn-circle" onclick="openMasterSettings()">⚙️</button>
      </div>
    </div>
  </div>

  <div id="score-hud">⚽ Goals: <span id="score-goals" class="score-val">0</span></div>
  <div id="swim-indicator">🏊 SWIMMING</div>
  <div id="speedo">0 KM/H</div>
  <button id="action-btn">ACTION</button>
  <button id="dismount-btn" onclick="exitSeatOrVehicle()">🚪 EXIT</button>

  <!-- Joystick -->
  <div id="joy-base"><div id="joy-stick"></div></div>

  <!-- Dynamic Controls -->
  <div class="extra-controls">
    <div class="ctrl-row">
      <button id="btn-steer-left" class="btn-touch">◀️</button>
      <button id="btn-steer-right" class="btn-touch">▶️</button>
      <button id="btn-flyup" class="btn-touch flyup">🛫 UP</button>
      <button id="btn-sprint" class="btn-touch sprint">⚡ RUN</button>
      <button id="btn-dance" class="btn-touch dance" onclick="triggerDanceEmote()">🕺 DANCE</button>
    </div>
    <div class="ctrl-row">
      <button id="btn-pedal-gas" class="btn-touch gas">⚡ GAS</button>
      <button id="btn-pedal-brake" class="btn-touch brake">🛑 STOP</button>
      <button id="btn-flydown" class="btn-touch flydown">🛬 DOWN</button>
      <button id="btn-dive" class="btn-touch dive" onclick="triggerUnderwaterDive()">🤿 DIVE</button>
      <button id="btn-jump" class="btn-touch jump" onclick="triggerJump()">JUMP</button>
    </div>
  </div>

  <!-- Clean Chat Box -->
  <div id="chat-box">
    <div class="chat-tabs">
      <div id="tab-global" class="chat-tab active" onclick="switchChatTab('global')">Server</div>
      <div id="tab-private" class="chat-tab" onclick="switchChatTab('private')">Friend</div>
    </div>
    <div id="chat-msgs"><div class="chat-bubble"><b>System:</b> Connected to Island!</div></div>
    <div class="chat-controls">
      <input type="text" id="chat-in" placeholder="Chat..." maxlength="45">
      <button id="chat-send" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <!-- Settings Modal (Social IDs, Shares & 11 Languages) -->
  <div id="master-settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⚙️ Settings & Social Profile</h3>
      <input type="text" id="upd-player-name" class="btn-action" style="text-align:left; background:#000;" placeholder="Player Name">
      <div class="grid-btns">
        <button class="btn-action" onclick="applyGenderSelect('man')">👦 Boy</button>
        <button class="btn-action" onclick="applyGenderSelect('girl')">👧 Girl</button>
      </div>
      <input type="text" id="upd-tele-id" class="btn-action" style="text-align:left; background:#000;" placeholder="Telegram ID (@username)">
      <input type="text" id="upd-insta-id" class="btn-action" style="text-align:left; background:#000;" placeholder="Instagram ID (@username)">
      
      <h3 style="font-size:12px; margin-top:4px;">📤 Share Island Link</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="shareSocial('whatsapp')">💬 WhatsApp</button>
        <button class="btn-action" onclick="shareSocial('telegram')">✈️ Telegram</button>
        <button class="btn-action" onclick="shareSocial('insta')">📸 Instagram</button>
        <button class="btn-action" onclick="shareSocial('copy')">📋 Copy Link</button>
      </div>

      <h3 style="font-size:12px; margin-top:4px;">🌐 11 Languages</h3>
      <div class="grid-btns" style="grid-template-columns: 1fr 1fr 1fr; gap:4px;">
        <button class="btn-action" onclick="setLanguage('en')">English</button>
        <button class="btn-action" onclick="setLanguage('ml')">മലയാളം</button>
        <button class="btn-action" onclick="setLanguage('hi')">हिन्दी</button>
        <button class="btn-action" onclick="setLanguage('fa')">فارسی</button>
        <button class="btn-action" onclick="setLanguage('tg')">Тоҷикӣ</button>
        <button class="btn-action" onclick="setLanguage('uz')">O'zbek</button>
        <button class="btn-action" onclick="setLanguage('ru')">Русский</button>
        <button class="btn-action" onclick="setLanguage('it')">Italiano</button>
        <button class="btn-action" onclick="setLanguage('id')">Indo</button>
        <button class="btn-action" onclick="setLanguage('my')">မြန်မာ</button>
      </div>

      <button class="btn-action primary" onclick="closeMasterSettings()">Save & Close</button>
    </div>
  </div>

  <!-- Climate Modal -->
  <div id="weather-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⛅ Climate & Environment</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="applyWeather('day')">☀️ Day</button>
        <button class="btn-action" onclick="applyWeather('night')">🌙 Night</button>
        <button class="btn-action" onclick="applyWeather('rain')">🌧️ Rain</button>
        <button class="btn-action" onclick="applyWeather('snow')">❄️ Snow</button>
        <button class="btn-action" onclick="applyWeather('desert')">🏜️ Desert Sand</button>
      </div>
      <button class="btn-action" onclick="closeModal('weather-modal')">Close</button>
    </div>
  </div>

  <!-- Stars Modal -->
  <div id="stars-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⭐ Telegram Stars Vault</h3>
      <div id="stars-status" style="font-size:11px; color:#cbd5e1;">Enjoy free concerts and fireworks!</div>
      <div class="grid-btns" style="margin-top:6px;">
        <button class="btn-action primary" onclick="buyStars(50)">Unlock 50 ⭐</button>
        <button class="btn-action primary" onclick="buyStars(150)">Unlock 150 ⭐</button>
      </div>
      <button class="btn-action" onclick="closeModal('stars-modal')">Close</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const socket = io();
    let currentRoom = "Global";
    let playerName = "Player_" + Math.floor(Math.random() * 899 + 100);
    let penaltyGoals = 0;
    let starsCount = 350;
    let isDancing = false;
    let isUnderwater = false;
    let isMicActive = false;
    let isMonetizedServer = false;
    let activeChatTab = 'global';
    let selectedFriendId = null;

    window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; };
    window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; };
    window.openMasterSettings = () => { document.getElementById('master-settings-modal').style.display = 'flex'; };
    window.closeMasterSettings = () => {
      const n = document.getElementById('upd-player-name').value.trim();
      if (n) playerName = n;
      document.getElementById('master-settings-modal').style.display = 'none';
    };

    // Synthesizer Audio Engine (Instruments, Nature, SFX)
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
      if (actx.state === 'suspended') actx.resume();
      const now = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);

      if (type === 'piano') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
        osc.start(now); osc.stop(now + 1.2);
      } else if (type === 'drums') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
        gain.gain.setValueAtTime(0.8, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'guitar') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(330, now);
        gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'violin') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(659, now);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 1.0);
        osc.start(now); osc.stop(now + 1.0);
      } else if (type === 'dj') {
        osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(600, now + 0.3);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'firework') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
        gain.gain.setValueAtTime(0.6, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'roar') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(90, now); osc.frequency.linearRampToValueAtTime(40, now + 0.8);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'kick') {
        osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      }
    }

    // Social Sharing
    window.shareSocial = (type) => {
      const url = window.location.href;
      if (type === 'whatsapp') window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('Join GlobeVibe Metaverse: ' + url)}`);
      else if (type === 'telegram') window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent('Join my GTA Island room!')}`);
      else if (type === 'insta') { navigator.clipboard.writeText(url); alert("Link copied for Instagram Bio/Story!"); }
      else { navigator.clipboard.writeText(url); alert("Game link copied successfully!"); }
    };

    // 11 Languages Support
    const dict = {
      en: { jump: "JUMP", run: "⚡ RUN", action: "ACTION" },
      ml: { jump: "ചാടുക", run: "⚡ ഓടുക", action: "പ്രവർത്തിക്കുക" },
      hi: { jump: "कूदें", run: "⚡ दौड़ें", action: "ऐक्शन" },
      fa: { jump: "پرش", run: "⚡ دویدن", action: "اقدام" },
      tg: { jump: "Ҷаҳидан", run: "⚡ Давидан", action: "Амал" },
      uz: { jump: "Sakrash", run: "⚡ Yugurish", action: "Harakat" },
      ru: { jump: "ПРЫЖОК", run: "⚡ БЕГ", action: "ДЕЙСТВИЕ" },
      it: { jump: "SALTO", run: "⚡ CORRI", action: "AZIONE" },
      id: { jump: "LOMPAT", run: "⚡ LARI", action: "AKSI" },
      my: { jump: "ခုန်ရန်", run: "⚡ ပြေးရန်", action: "လုပ်ဆောင်ရန်" }
    };
    window.setLanguage = (lang) => {
      const t = dict[lang] || dict['en'];
      document.getElementById('btn-jump').innerText = t.jump;
      document.getElementById('btn-sprint').innerText = t.run;
      closeMasterSettings();
    };

    // ==========================================
    // THREE.JS SCENE, LIGHTS & CLIMATE
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.0016);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.6);
    scene.add(hemiLight);
    const sun = new THREE.DirectionalLight(0xfff1dc, 0.85);
    sun.position.set(60, 100, 50);
    scene.add(sun);

    // Weather Handler
    window.applyWeather = (mode) => {
      if (mode === 'day') { scene.background.setHex(0x38bdf8); scene.fog.color.setHex(0x38bdf8); sun.intensity = 1.0; }
      else if (mode === 'night') { scene.background.setHex(0x020617); scene.fog.color.setHex(0x020617); sun.intensity = 0.15; }
      else if (mode === 'rain') { scene.background.setHex(0x334155); scene.fog.color.setHex(0x334155); sun.intensity = 0.4; }
      else if (mode === 'snow') { scene.background.setHex(0x94a3b8); scene.fog.color.setHex(0x94a3b8); sun.intensity = 0.5; }
      else if (mode === 'desert') { scene.background.setHex(0x78350f); scene.fog.color.setHex(0x78350f); sun.intensity = 0.7; }
      closeModal('weather-modal');
    };

    // Deep Ocean Water
    const ocean = new THREE.Mesh(
      new THREE.PlaneGeometry(1600, 1600),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.85 })
    );
    ocean.rotation.x = -Math.PI / 2; ocean.position.y = 0.0; scene.add(ocean);

    // Solid Elevated Island Base (Y: 4.4 Floor)
    const island = new THREE.Mesh(new THREE.CylinderGeometry(72, 78, 8, 64), new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.85 }));
    island.position.set(0, 0.4, 0); scene.add(island);

    // Island Zones
    const snowBase = new THREE.Mesh(new THREE.CylinderGeometry(24, 25, 8.1, 32), new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.9 }));
    snowBase.position.set(30, 0.45, 25); scene.add(snowBase);

    const desertBase = new THREE.Mesh(new THREE.CylinderGeometry(24, 25, 8.1, 32), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.9 }));
    desertBase.position.set(-32, 0.45, -28); scene.add(desertBase);

    const turf = new THREE.Mesh(new THREE.BoxGeometry(26, 8.2, 42), new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.6 }));
    turf.position.set(0, 0.45, -44); scene.add(turf);

    // Continuous Ground-Reaching Snow Particles
    const snowGeo = new THREE.BufferGeometry();
    const snowCount = 200;
    const snowPositions = new Float32Array(snowCount * 3);
    for(let i=0; i<snowCount; i++) {
      snowPositions[i*3] = 30 + (Math.random() - 0.5) * 40;
      snowPositions[i*3+1] = 4.4 + Math.random() * 25;

    function loadGLB(file, size, onLoad) {
      const handle = (gltf) => {
        const root = gltf.scene;
        const bbox = new THREE.Box3().setFromObject(root);
        const sz = new THREE.Vector3(); bbox.getSize(sz);
        const maxD = Math.max(sz.x, sz.y, sz.z);
        if (maxD > 0 && size) root.scale.setScalar(size / maxD);
        if (gltf.animations && gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(root);
          mixer.clipAction(gltf.animations[0]).play();
          mixers.push(mixer);
        }
        onLoad(root);
      };
      gltfLoader.load(file, handle, undefined, () => gltfLoader.load('/' + file, handle, undefined, () => {}));
    }

    const remotePlayers = {};
    function renderRemotePlayer(data) {
      if (data.id === socket.id || remotePlayers[data.id]) return;
      const group = new THREE.Group();
      group.position.set(data.x, data.y || 4.4, data.z);
      scene.add(group);

      loadGLB(data.gender === 'girl' ? 'girl.glb' : 'man.glb', 2.0, (mesh) => {
        mesh.rotation.set(0, 0, 0);
        group.add(mesh);
      });
      remotePlayers[data.id] = { group, data };
    }

      isMonetizedServer = data.isMonetized;
      if (isMonetizedServer) document.getElementById('stars-status').innerText = "200+ Users reached! Use Stars for Concert & Fireworks.";
      for (let id in data.players) {
        if (id !== socket.id) renderRemotePlayer(data.players[id]);
      }
      document.getElementById('hud-online').innerText = data.count || 1;
    });

    socket.on('playerJoined', (data) => {
      renderRemotePlayer(data);
      document.getElementById('hud-online').innerText = data.count || Object.keys(remotePlayers).length + 1;
    });

    socket.on('playerMoved', (data) => {
      if (remotePlayers[data.id]) {
        const p = remotePlayers[data.id].group;
        p.position.set(data.x, data.y, data.z);
        p.rotation.y = data.rotY || 0;
      }
    });

    socket.on('playerLeft', (data) => {
      if (remotePlayers[data.id]) {
        scene.remove(remotePlayers[data.id].group);
        delete remotePlayers[data.id];
      }
      document.getElementById('hud-online').innerText = data.count || Object.keys(remotePlayers).length + 1;
    });

    window.toggleMicrophone = async () => {
      if (!isMicActive) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => {
            if (activeChatTab === 'private' && selectedFriendId) {
              socket.emit('privateVoiceStream', { targetId: selectedFriendId, audio: e.data });
            } else {
              socket.emit('voiceStream', e.data);
            }
          };
          mediaRecorder.start(250);
          isMicActive = true;
          document.getElementById('btn-mic').style.background = '#22c55e';
        } catch (err) { alert("Microphone access denied."); }
      } else {
        if (mediaRecorder) mediaRecorder.stop();
        isMicActive = false;
        document.getElementById('btn-mic').style.background = 'rgba(15, 23, 42, 0.9)';
      }
    };

    const jBase = document.getElementById('joy-base');
    const jStick = document.getElementById('joy-stick');
    jBase.addEventListener('touchmove', e => {
      e.preventDefault();
      const b = jBase.getBoundingClientRect();
      let dx = e.touches[0].clientX - b.left - 50;
      let dy = e.touches[0].clientY - b.top - 50;
      const d = Math.hypot(dx, dy);
      const maxR = 38;
      if (d > maxR) { dx = (dx / d) * maxR; dy = (dy / d) * maxR; }
      jStick.style.left = `${50 + dx - 18}px`;
      jStick.style.top = `${50 + dy - 18}px`;
      joyX = dx / maxR; joyZ = dy / maxR;
    }, { passive: false });
    jBase.addEventListener('touchend', () => { jStick.style.left = '32px'; jStick.style.top = '32px'; joyX = 0; joyZ = 0; });

    document.getElementById('btn-sprint').addEventListener('touchstart', e => { e.preventDefault(); isSprint = true; });

    document.getElementById('btn-steer-left').addEventListener('touchstart', e => { e.preventDefault(); steerBtnX = -1; });
    document.getElementById('btn-steer-left').addEventListener('touchend', () => steerBtnX = 0);
    document.getElementById('btn-steer-right').addEventListener('touchstart', e => { e.preventDefault(); steerBtnX = 1; });
    document.getElementById('btn-steer-right').addEventListener('touchend', () => steerBtnX = 0);

    const btnGas = document.getElementById('btn-pedal-gas');
    const btnBrake = document.getElementById('btn-pedal-brake');
    const btnFlyUp = document.getElementById('btn-flyup');
    const btnFlyDown = document.getElementById('btn-flydown');
    btnGas.addEventListener('touchstart', e => { e.preventDefault(); isGas = true; });
    btnGas.addEventListener('touchend', () => isGas = false);
    btnBrake.addEventListener('touchstart', e => { e.preventDefault(); isBrake = true; });
    btnBrake.addEventListener('touchend', () => isBrake = false);
    btnFlyUp.addEventListener('touchstart', e => { e.preventDefault(); isFlyUp = true; });
    btnFlyUp.addEventListener('touchend', () => isFlyUp = false);
    btnFlyDown.addEventListener('touchstart', e => { e.preventDefault(); isFlyDown = true; });
    btnFlyDown.addEventListener('touchend', () => isFlyDown = false);

    let isDrag = false, touchX = 0;
    window.addEventListener('touchstart', e => {
      if (e.target.closest('#joy-base') || e.target.closest('button') || e.target.closest('#chat-box') || e.target.closest('.modal-card')) return;
      isDrag = true; touchX = e.touches[0].clientX;
    });
    window.addEventListener('touchmove', e => {
      if (!isDrag) return;
      camRotX -= (e.touches[0].clientX - touchX) * 0.005;
      touchX = e.touches[0].clientX;
    });
    window.addEventListener('touchend', () => isDrag = false);

    window.triggerJump = () => { if (localPlayer.position.y <= 4.5 && !isUnderwater) localPlayer.position.y = 6.2; };
    window.triggerDanceEmote = () => { isDancing = !isDancing; };
    window.triggerUnderwaterDive = () => {
      isUnderwater = !isUnderwater;
      localPlayer.position.y = isUnderwater ? -1.4 : 0.2;
    };

    // Proximity Interactions (Concert Instruments, Vehicles, Friends)
    const actBtn = document.getElementById('action-btn');
    const btnDance = document.getElementById('btn-dance');
    let currentActiveSeat = null;

    function checkInteractions() {
      if (currentActiveSeat) { actBtn.style.display = 'none'; return; }
      const p = localPlayer.position;

      // Concert Stage: Only Show Dance Button When Near Stage
      const distToStage = p.distanceTo(concertStage.position);
      if (distToStage < 12.0) btnDance.style.display = 'flex';
      else { btnDance.style.display = 'none'; isDancing = false; }

      // Instruments Play
      for(let k in playableInstruments) {
        const inst = playableInstruments[k];
        if (p.distanceTo(inst.obj.position) < 3.2) {
          actBtn.innerText = `🎵 PLAY ${k.toUpperCase()}`;
          actBtn.style.display = 'block';
          actBtn.onclick = () => {
            if (isMonetizedServer && starsCount < 10) { openModal('stars-modal'); return; }
            playSfx(inst.sfx);
            isDancing = true;
          };
          return;
        }
      }

      // Boarding Vehicles (Inside Seating vs Realistic Sit-on)
      for (let key in multiVehicles) {
        const v = multiVehicles[key];
        const worldPos = new THREE.Vector3(); v.object.getWorldPosition(worldPos);
        if (p.distanceTo(worldPos) < (key === 'cruise' ? 25.0 : 6.0)) {
          actBtn.innerText = `🚗 BOARD ${key.toUpperCase()}`;
          actBtn.style.display = 'block';
          actBtn.onclick = () => {
            currentActiveSeat = { rigKey: key };
            v.object.add(localAvatar);
            localAvatar.position.copy(v.offsets[0]);

            // Seating Inside vs Sitting On Top
            if (v.isClosedCockpit) {
              localAvatar.visible = false; // Sitting completely inside cabin/cockpit
            } else {
              localAvatar.visible = true; // Sits on saddle/deck
              localAvatar.position.y += 0.2;
            }

            document.getElementById('speedo').style.display = 'block';
            document.getElementById('dismount-btn').style.display = 'block';
            btnGas.style.display = 'flex';
            btnBrake.style.display = 'flex';
            if (v.isFlyer) { btnFlyUp.style.display = 'flex'; btnFlyDown.style.display = 'flex'; }
          };
          return;
        }
      }

      // Add Friend Near Player
      for (let id in remotePlayers) {
        const rp = remotePlayers[id];
        if (p.distanceTo(rp.group.position) < 3.0) {
          actBtn.innerText = `🤝 FRIEND ${rp.data.name}`;
          actBtn.style.display = 'block';
          actBtn.onclick = () => {
            selectedFriendId = id;
            switchChatTab('private');
            alert(`You are now chatting privately with ${rp.data.name}!`);
          };
          return;
        }
      }

      actBtn.style.display = 'none';
    }

    window.exitSeatOrVehicle = () => {
      if (!currentActiveSeat) return;
      const v = multiVehicles[currentActiveSeat.rigKey];
      localPlayer.add(localAvatar);
      localAvatar.visible = true;
      localAvatar.position.set(0, 0, 0);
      const worldPos = new THREE.Vector3(); v.object.getWorldPosition(worldPos);
      localPlayer.position.set(worldPos.x + 3.0, 4.4, worldPos.z);
      document.getElementById('speedo').style.display = 'none';
      document.getElementById('dismount-btn').style.display = 'none';
      btnGas.style.display = 'none'; btnBrake.style.display = 'none';
      btnFlyUp.style.display = 'none'; btnFlyDown.style.display = 'none';
      currentActiveSeat = null;
    };

    // ==========================================
    // MAIN GAME LOOP & REALISTIC SIMULATION
    // ==========================================
    const clock = new THREE.Clock();
    let metroT = 0, tram1T = 0, tram2T = 0;

    function animate() {
      requestAnimationFrame(animate);
      checkInteractions();
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();
      mixers.forEach(m => m.update(delta));

      // 1. Continuous Ground-Reaching Snow
      const sPos = snowParticles.geometry.attributes.position.array;
      for (let i = 0; i < snowCount; i++) {
        sPos[i * 3 + 1] -= delta * 5.0;
        if (sPos[i * 3 + 1] <= 4.4) sPos[i * 3 + 1] = 28.0;
      }
      snowParticles.geometry.attributes.position.needsUpdate = true;

      // 2. Continuous Sky Fireworks Explosion Loop
      const fArr = fwParticles.geometry.attributes.position.array;
      for(let i=0; i<fwCount; i++) {
        fArr[i*3] += fwVels[i].vx;
        fArr[i*3+1] += fwVels[i].vy;
        fArr[i*3+2] += fwVels[i].vz;
        if (fArr[i*3+1] < 38) {
          fArr[i*3] = (Math.random()-0.5)*30;
          fArr[i*3+1] = 48 + Math.random()*12;
          fArr[i*3+2] = (Math.random()-0.5)*30;
        }
      }
      fwParticles.geometry.attributes.position.needsUpdate = true;
      if (Math.random() < 0.02) playSfx('firework');

      // 3. Active Volcano Lava Loop
      const posArr = lavaParticles.geometry.attributes.position.array;
      for (let i = 0; i < pCount; i++) {
        posArr[i * 3 + 1] += lVels[i].vy;
        posArr[i * 3] += lVels[i].vx;
        posArr[i * 3 + 2] += lVels[i].vz;
        if (posArr[i * 3 + 1] > 26) {
          posArr[i * 3] = (Math.random() - 0.5) * 6;
          posArr[i * 3 + 1] = 18;
          posArr[i * 3 + 2] = -145 + (Math.random() - 0.5) * 6;
        }
      }
      lavaParticles.geometry.attributes.position.needsUpdate = true;
      lavaLight.intensity = 2.5 + Math.sin(time * 4) * 1.0;

      // 4. Safe Outer Loops: Tram 1 (Snow Edge) & Tram 2 (Desert Edge)
      tram1T += delta * 0.22;
      tram1Rig.position.set(30 + Math.sin(tram1T) * 16, 4.4, 25 + Math.cos(tram1T) * 16);
      tram1Rig.rotation.y = tram1T + Math.PI / 2;

      tram2T += delta * 0.22;
      tram2Rig.position.set(-32 + Math.sin(tram2T) * 14, 4.4, -28 + Math.cos(tram2T) * 14);
      tram2Rig.rotation.y = tram2T + Math.PI / 2;

      // 5. Collision-Free Metro City Train (Outer Border)
      metroT += delta * 0.35;
      metroTrainRig.position.set(Math.sin(metroT) * 22, 4.4, Math.cos(metroT) * 22);
      metroTrainRig.rotation.y = metroT + Math.PI / 2;

      // 6. Straight Sky Cruising Flight
      skyPlane.position.x += delta * 24;
      if (skyPlane.position.x > 180) skyPlane.position.x = -180;

      // 7. Mountain Orbit: Dragon & Birds
      flyingGroup.rotation.y = time * 0.25;

      // 8. Joystick-Drivable Soccer Ball Physics
      const pToBall = localPlayer.position.distanceTo(fBall.position);
      if (pToBall < 1.4) {
        const pushDir = new THREE.Vector3().subVectors(fBall.position, localPlayer.position).normalize();
        ballRig.vel.x = pushDir.x * 0.55;
        ballRig.vel.z = pushDir.z * 0.55;
        playSfx('kick');
      }
      fBall.position.add(ballRig.vel);
      ballRig.vel.multiplyScalar(0.92); // Friction damping
      fBall.position.y = 4.75;

      // Goal Detection
      if (fBall.position.z < -60 && Math.abs(fBall.position.x) < 4.0) {
        playSfx('kick');
        penaltyGoals++;
        document.getElementById('score-goals').innerText = penaltyGoals;
        fBall.position.set(0, 4.75, -48);
        ballRig.vel.set(0, 0, 0);
      }

      // 9. Local Player Movement & Clamping
      if (!currentActiveSeat) {
        localAvatar.rotation.z = 0; // Completely cancels flip bug
        
        const distFromCenter = Math.hypot(localPlayer.position.x, localPlayer.position.z);
        const inWater = distFromCenter > 72;

        if (inWater) {
          document.getElementById('swim-indicator').style.display = 'block';
          document.getElementById('btn-dive').style.display = 'flex';
          localAvatar.rotation.x = Math.PI / 3; // Natural swimming horizontal tilt
          localPlayer.position.y = isUnderwater ? -1.4 : 0.2;
        } else {
          document.getElementById('swim-indicator').style.display = 'none';
          document.getElementById('btn-dive').style.display = 'none';
          isUnderwater = false;
          localAvatar.rotation.x = 0; // Upright human standing
          if (localPlayer.position.y > 4.4) localPlayer.position.y = Math.max(4.4, localPlayer.position.y - 0.15);
          else localPlayer.position.y = 4.4;
        }

        const effJoyX = joyX !== 0 ? joyX : steerBtnX;
        if (effJoyX !== 0 || joyZ !== 0) {
          isDancing = false;
          const speed = inWater ? 0.22 : (isSprint ? 0.65 : 0.35);
          const fx = effJoyX * Math.cos(camRotX) + joyZ * Math.sin(camRotX);
          const fz = -effJoyX * Math.sin(camRotX) + joyZ * Math.cos(camRotX);

          // No-Clip Collision Guard (Cannot walk through Mountain Core)
          const nextX = localPlayer.position.x + fx * speed;
          const nextZ = localPlayer.position.z + fz * speed;
          const distToMountain = Math.hypot(nextX - (-36), nextZ - 28);
          if (distToMountain > 16) { // Mountain solid barrier
            localPlayer.position.x = nextX;
            localPlayer.position.z = nextZ;
          }
          localPlayer.rotation.y = Math.atan2(fx, fz);

          socket.emit('playerMoved', { room: currentRoom, x: localPlayer.position.x, y: localPlayer.position.y, z: localPlayer.position.z, rotY: localPlayer.rotation.y });
        }
      } else {
        // Vehicle Driving Engine
        const v = multiVehicles[currentActiveSeat.rigKey];
        const obj = v.object;
        const effJoyX = joyX !== 0 ? joyX : steerBtnX;
        let driveSpeed = 0;
        if (isGas) driveSpeed = 0.7;
        else if (isBrake) driveSpeed = -0.3;
        else if (joyZ !== 0) driveSpeed = -joyZ * 0.5;

        if (effJoyX !== 0 || driveSpeed !== 0 || isFlyUp || isFlyDown) {
          obj.rotation.y -= effJoyX * 0.04;
          obj.position.x += Math.sin(obj.rotation.y) * driveSpeed;
          obj.position.z += Math.cos(obj.rotation.y) * driveSpeed;

          if (v.isFlyer) {
            if (isFlyUp && obj.position.y < 70) obj.position.y += 0.45;
            if (isFlyDown && obj.position.y > 4.4) obj.position.y -= 0.45;
          }
          document.getElementById('speedo').innerText = `${Math.abs(Math.round(driveSpeed * 90))} KM/H`;
        } else {
          document.getElementById('speedo').innerText = `0 KM/H`;
        }
        const wp = new THREE.Vector3(); obj.getWorldPosition(wp);
        localPlayer.position.copy(wp);
      }

      // Camera Orbit
      const t = (currentActiveSeat && currentActiveSeat.rigKey) ? multiVehicles[currentActiveSeat.rigKey].object : localPlayer;
      const tp = new THREE.Vector3(); t.getWorldPosition(tp);
      camera.position.x = tp.x + Math.sin(camRotX) * 10;
      camera.position.y = tp.y + 3.2;
      camera.position.z = tp.z + Math.cos(camRotX) * 10;
      camera.lookAt(tp.x, tp.y + 2.8, tp.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
