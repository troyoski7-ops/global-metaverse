<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe Ultra 3D Metaverse</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: system-ui, -apple-system, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top HUD */
    .top-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 40; }
    .top-row-1 { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .pill-group { display: flex; gap: 6px; align-items: center; }
    .badge { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); display: flex; gap: 5px; align-items: center; }
    .badge.owner { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: 900; }
    .badge.stars { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; font-weight: 900; cursor: pointer; border: 1px solid #fef08a; }
    .badge.online { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #4ade80; }

    .comm-btns { display: flex; gap: 6px; align-items: center; }
    .circle-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(255,255,255,0.25); color: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .circle-btn.active { background: #22c55e; border-color: #4ade80; color: #fff; box-shadow: 0 0 15px rgba(34, 197, 94, 0.6); }

    .tools-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .tool-btn { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.25); padding: 7px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .tool-btn:active { background: #0284c7; color: #fff; }

    #menu-toggle-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(255,255,255,0.25); color: #38bdf8; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    #drawer-menu { position: absolute; top: 90px; right: 8px; width: 235px; background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(15px); border-radius: 16px; border: 1.5px solid #38bdf8; padding: 10px; display: none; flex-direction: column; gap: 7px; box-shadow: 0 10px 35px rgba(0,0,0,0.9); max-height: 65vh; overflow-y: auto; z-index: 1000; }
    .menu-item { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; text-align: left; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .menu-item:active { background: #0284c7; }

    /* Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 99999; align-items: center; justify-content: center; }
    .modal-box { background: #0f172a; border: 1.5px solid rgba(255,255,255,0.25); border-radius: 20px; width: 335px; max-width: 92%; padding: 18px; color: #fff; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.9); }

    /* Live Chat */
    #chat-container { position: absolute; bottom: 20px; left: 130px; width: 230px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 14px; padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 20; }
    .chat-tabs { display: flex; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
    .chat-tab { background: none; border: none; color: #94a3b8; font-size: 10px; font-weight: bold; cursor: pointer; padding: 2px 6px; }
    .chat-tab.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }
    #chat-messages { height: 50px; overflow-y: auto; font-size: 11px; color: #fff; display: flex; flex-direction: column; gap: 3px; }
    .chat-msg { background: rgba(255,255,255,0.08); padding: 3px 6px; border-radius: 6px; word-break: break-word; }
    .chat-msg b { color: #38bdf8; }
    .chat-input-row { display: flex; gap: 4px; }
    #chat-input { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; padding: 4px 8px; font-size: 11px; outline: none; }
    #chat-send { background: #0284c7; color: #fff; border: none; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

    /* Action Buttons */
    #action-btn { position: absolute; bottom: 125px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: 2px solid #fff; padding: 12px 26px; border-radius: 30px; font-size: 13px; font-weight: 900; display: none; box-shadow: 0 0 25px rgba(37,99,235,0.8); cursor: pointer; z-index: 25; }
    #dismount-btn { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border: 1px solid #fecaca; padding: 8px 20px; border-radius: 20px; font-size: 12px; font-weight: 800; display: none; cursor: pointer; z-index: 40; }
    #speedo { position: absolute; bottom: 125px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.5); padding: 6px 20px; border-radius: 20px; font-size: 14px; font-weight: 900; display: none; z-index: 25; }

    #jump-btn { position: absolute; bottom: 35px; right: 20px; width: 62px; height: 62px; border-radius: 50%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 2px solid rgba(255,255,255,0.3); color: #fff; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 25; }

    /* Pedals */
    .vehicle-pedals { position: absolute; bottom: 25px; right: 20px; display: none; flex-direction: column; gap: 10px; z-index: 25; }
    .pedal-btn { width: 68px; height: 52px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.4); font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
    #gas-pedal { background: linear-gradient(135deg, #22c55e, #16a34a); }
    #brake-pedal { background: linear-gradient(135deg, #ef4444, #b91c1c); }

    #joystick-base { position: absolute; left: 16px; bottom: 25px; width: 100px; height: 100px; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(6px); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); touch-action: none; z-index: 25; }
    #joystick-stick { position: absolute; left: 30px; top: 30px; width: 40px; height: 40px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 15px rgba(56, 189, 248, 0.8); pointer-events: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

        <button class="tool-btn" onclick="selectServer('India Central')">🇮🇳 India Central</button>
        <button class="tool-btn" onclick="selectServer('Iran')">🇮🇷 Iran</button>
        <button class="tool-btn" onclick="selectServer('Russia')">🇷🇺 Russia</button>
        <button class="tool-btn" onclick="selectServer('Italy')">🇮🇹 Italy</button>
        <button class="tool-btn" onclick="selectServer('Uzbekistan')">🇺🇿 Uzbekistan</button>
        <button class="tool-btn" onclick="selectServer('Tajikistan')">🇹🇯 Tajikistan</button>
        <button class="tool-btn" onclick="selectServer('Myanmar')">🇲🇲 Myanmar</button>
        <button class="tool-btn" onclick="selectServer('Indonesia')">🇮🇩 Indonesia</button>
        <button class="tool-btn" onclick="selectServer('Global USA')">🇺🇸 Global USA</button>
      </div>
    </div>
  </div>

  <!-- 3. Weather Modal -->
  <div id="weather-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>🌤 Atmosphere & Weather</h3>
        <span onclick="closeModal('weather-modal')" style="cursor:pointer; font-size:20px; padding:5px;">✕</span>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <button class="tool-btn" onclick="setSky('sunny')">☀️ Sunny Day</button>
        <button class="tool-btn" onclick="setSky('sunset')">🌅 Sunset</button>
        <button class="tool-btn" onclick="setSky('night')">🌙 Night</button>

        <button class="tool-btn" onclick="setSky('fog')">🌫 Foggy</button>
      </div>
    </div>
  </div>

  <!-- 4. Telegram Stars Modal -->
  <div id="stars-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>⭐ Telegram Stars VIP</h3>
        <span onclick="closeModal('stars-modal')" style="cursor:pointer; font-size:20px; padding:5px;">✕</span>
      </div>
      <p style="font-size:11px; color:#cbd5e1;">Get Nitro Speed Cars, Giant T-Rex Mounts & VIP Golden Glow!</p>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <button class="tool-btn" onclick="buyStars(50, 'VIP Pass')">⭐ 50 Stars — VIP Rank</button>
        <button class="tool-btn" onclick="buyStars(250, 'Monster Pack')">⭐ 250 Stars — Dino & Car Pack</button>
        <button class="tool-btn" onclick="buyStars(500, 'Metaverse God')">⭐ 500 Stars — All Mounts Unlocked</button>
      </div>
    </div>
  </div>

  <!-- 5. Profile & Social Modal -->
  <div id="profile-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">

        <span onclick="closeModal('profile-modal')" style="cursor:pointer; font-size:20px; padding:5px;">✕</span>
      </div>

      <div>

      <div class="pill-group">

      const b = jBase.getBoundingClientRect();
      let dx = cx - b.left - jCenter.x;
      let dy = cy - b.top - jCenter.y;
      const dist = Math.hypot(dx, dy);
      const maxR = 34;
      if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
      jStick.style.left = `${jCenter.x + dx - 20}px`;
      jStick.style.top = `${jCenter.y + dy - 20}px`;
      moveX = dx / maxR;
      moveZ = dy / maxR;
    }

    jBase.addEventListener('touchstart', (e) => { e.preventDefault(); handleJoy(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    jBase.addEventListener('touchmove', (e) => { e.preventDefault(); handleJoy(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

      const msg = document.createElement('div');
      msg.className = 'chat-msg';
      msg.innerHTML = `<b>${sender}:</b> ${text}`;
      box.appendChild(msg); box.scrollTop = box.scrollHeight;
    }

    // Animation Physics Loop
    function animate() {
      requestAnimationFrame(animate);
      checkInteractions();

      // Ferris Wheel Animated Rotation
      if (ferrisWheelMesh) ferrisWheelMesh.rotation.y += 0.005;

      // Aquatic Life Movement
      if (whaleMesh) whaleMesh.position.x += Math.sin(Date.now() * 0.001) * 0.15;
      if (sharkMesh) sharkMesh.position.z += Math.cos(Date.now() * 0.001) * 0.15;

      if (activeMount === 'walk') {
        if (isJumping) {
          myPlayer.position.y += jumpVel; jumpVel -= 0.016;
          if (myPlayer.position.y <= 0) { myPlayer.position.y = 0; isJumping = false; }
        }

        const spd = isSwimming ? 0.22 : 0.45;
        if (moveX !== 0 || moveZ !== 0) {
          const fx = moveX * Math.cos(camAngleX) + moveZ * Math.sin(camAngleX);
          const fz = -moveX * Math.sin(camAngleX) + moveZ * Math.cos(camAngleX);
          myPlayer.position.x += fx * spd;
          myPlayer.position.z += fz * spd;
          myPlayer.rotation.y = Math.atan2(fx, fz);

          socket.emit('playerMove', { x: myPlayer.position.x, y: myPlayer.position.y, z: myPlayer.position.z, rotY: myPlayer.rotation.y });
        }
      } else if (activeMount === 'car') {
        if (isGasPressed) vSpeed = Math.min(vSpeed + 0.05, 2.5);
        else if (isBrakePressed) vSpeed = Math.max(vSpeed - 0.07, -0.9);
        else vSpeed *= 0.96;

        carEntity.rotation.y -= moveX * 0.045 * (vSpeed >= 0 ? 1 : -1);
        carEntity.position.x += Math.sin(carEntity.rotation.y) * vSpeed;
        carEntity.position.z += Math.cos(carEntity.rotation.y) * vSpeed;

        myPlayer.position.copy(carEntity.position);
        speedo.innerText = `${Math.abs(Math.round(vSpeed * 75))} KM/H`;
      } else if (activeMount === 'boat' || activeMount === 'ship') {
        const ent = activeMount === 'boat' ? boatEntity : shipEntity;
        if (isGasPressed) vSpeed = Math.min(vSpeed + 0.03, activeMount === 'boat' ? 1.4 : 0.8);
        else if (isBrakePressed) vSpeed = Math.max(vSpeed - 0.04, -0.5);
        else vSpeed *= 0.94;

        ent.rotation.y -= moveX * 0.03;
        ent.position.x += Math.sin(ent.rotation.y) * vSpeed;
        ent.position.z += Math.cos(ent.rotation.y) * vSpeed;

        myPlayer.position.copy(ent.position);
        myPlayer.position.y = activeMount === 'boat' ? 0.3 : 3.8;
        myPlayer.rotation.y = ent.rotation.y;
        speedo.innerText = `${Math.abs(Math.round(vSpeed * 48))} KNOTS`;
      } else if (activeMount === 'dino') {
        if (isGasPressed) vSpeed = Math.min(vSpeed + 0.03, 1.2);
        else if (isBrakePressed) vSpeed = Math.max(vSpeed - 0.04, -0.4);
        else vSpeed *= 0.92;

        trexEntity.rotation.y -= moveX * 0.035;
        trexEntity.position.x += Math.sin(trexEntity.rotation.y) * vSpeed;
        trexEntity.position.z += Math.cos(trexEntity.rotation.y) * vSpeed;

        myPlayer.position.copy(trexEntity.position);
        myPlayer.position.y = trexEntity.position.y + 4.8;
        myPlayer.rotation.y = trexEntity.rotation.y;
        speedo.innerText = `${Math.abs(Math.round(vSpeed * 45))} KM/H`;
      } else if (activeMount === 'skate') {
        if (isGasPressed) vSpeed = Math.min(vSpeed + 0.04, 1.6);
        else if (isBrakePressed) vSpeed = Math.max(vSpeed - 0.06, -0.5);
        else vSpeed *= 0.95;

        skateEntity.rotation.y -= moveX * 0.05;
        skateEntity.position.x += Math.sin(skateEntity.rotation.y) * vSpeed;
        skateEntity.position.z += Math.cos(skateEntity.rotation.y) * vSpeed;

        myPlayer.position.copy(skateEntity.position);
        myPlayer.position.y = 0.4;
        myPlayer.rotation.y = skateEntity.rotation.y;
        speedo.innerText = `${Math.abs(Math.round(vSpeed * 50))} KM/H`;
      }

      const curTarget = activeMount === 'walk' ? myPlayer.position : (activeMount === 'car' ? carEntity.position : (activeMount === 'boat' ? boatEntity : (activeMount === 'ship' ? shipEntity : trexEntity.position)));
      const dist = activeMount === 'walk' ? 14 : 24;
      camera.position.x = curTarget.x + Math.sin(camAngleX) * dist * Math.cos(camAngleY);
      camera.position.y = curTarget.y + 4.5 + Math.sin(camAngleY) * dist;
      camera.position.z = curTarget.z + Math.cos(camAngleX) * dist * Math.cos(camAngleY);
      camera.lookAt(curTarget.x, curTarget.y + 1.8, curTarget.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
