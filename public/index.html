<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe 3D Metaverse</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; }
    .top-bar, .side-dock, .chat-box, .modal-card, #joystick-base, #proximity-prompt, #dismount-btn, #mic-float-btn, #kick-ball-btn, #sky-banner { pointer-events: auto; }

    /* ആകാശത്ത് തിളങ്ങുന്ന ബാനർ */
    #sky-banner { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg, #ff007f, #7928ca); color: #fff; font-weight: 900; font-size: 14px; padding: 10px 22px; border-radius: 25px; box-shadow: 0 0 25px #ff007f; display: none; text-shadow: 0 0 10px #fff; z-index: 35; text-align: center; }

    /* ഹെഡർ */
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .badges { display: flex; gap: 5px; align-items: center; }
    .badge { background: rgba(15, 23, 42, 0.9); color: #fff; padding: 5px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); }
    .owner-tag { background: linear-gradient(45deg, #ffd700, #ff8c00); color: #000; }
    
    .top-btns { display: flex; gap: 4px; }
    .btn-top { background: rgba(15, 23, 42, 0.85); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); padding: 5px 8px; border-radius: 12px; font-size: 11px; backdrop-filter: blur(8px); cursor: pointer; }
    .star-btn { background: linear-gradient(45deg, #eab308, #ca8a04); color: #000; font-weight: bold; border: none; }

    /* എപ്പോഴും കാണുന്ന ലൈവ് മൈക്ക് */
    #mic-float-btn { position: absolute; top: 52px; left: 10px; width: 44px; height: 44px; border-radius: 50%; background: #22c55e; color: #fff; border: 2px solid #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(34, 197, 94, 0.8); cursor: pointer; z-index: 20; }
    #mic-float-btn.muted { background: #ef4444; box-shadow: 0 0 12px rgba(239, 68, 68, 0.8); }

    /* അടുത്തെത്തുമ്പോൾ കയറാനുള്ള പ്രോംപ്റ്റ് */
    #proximity-prompt { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); background: linear-gradient(45deg, #2563eb, #38bdf8); color: #fff; padding: 10px 22px; border-radius: 25px; font-weight: bold; font-size: 13px; border: 2px solid #fff; box-shadow: 0 0 20px rgba(56, 189, 248, 0.9); display: none; cursor: pointer; z-index: 30; animation: bounce 1s infinite alternate; }
    @keyframes bounce { 0% { transform: translate(-50%, 0); } 100% { transform: translate(-50%, -8px); } }

    /* ഡിസ്മൗണ്ട് ബട്ടൺ */
    #dismount-btn { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 12px; border: 2px solid #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.9); display: none; cursor: pointer; z-index: 20; }

    /* ഫുട്ബോൾ കിക്ക് ബട്ടൺ (തൊട്ടടുത്ത് വരുമ്പോൾ മാത്രം) */
    #kick-ball-btn { position: absolute; bottom: 100px; right: 40px; width: 62px; height: 62px; border-radius: 50%; background: #eab308; color: #000; font-weight: 900; font-size: 14px; border: 2px solid #fff; display: none; align-items: center; justify-content: center; box-shadow: 0 0 18px #eab308; cursor: pointer; z-index: 30; }

    /* സൈഡ് പാനൽ */
    .side-dock { position: absolute; right: 8px; top: 100px; display: flex; flex-direction: column; gap: 5px; }
    .dock-btn { background: rgba(15, 23, 42, 0.85); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 7px 10px; border-radius: 12px; font-size: 10px; backdrop-filter: blur(8px); text-align: left; cursor: pointer; }

    /* 🕹️ 360° അനലോഗ് ജോയ്സ്റ്റിക്ക് */
    #joystick-base { position: absolute; left: 16px; bottom: 20px; width: 110px; height: 110px; background: rgba(0, 0, 0, 0.35); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); touch-action: none; }
    #joystick-stick { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 10px rgba(56, 189, 248, 0.8); pointer-events: none; }

    /* ചാറ്റ് ബോക്സ് */
    .chat-box { position: absolute; right: 8px; bottom: 12px; width: 210px; background: rgba(15, 23, 42, 0.9); border-radius: 12px; padding: 6px; border: 1px solid rgba(255, 255, 255, 0.2); }
    #chat-content { height: 45px; overflow-y: auto; font-size: 10px; color: #fff; margin-bottom: 4px; }
    .chat-controls { display: flex; gap: 3px; }
    .chat-controls input { flex: 1; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 4px 6px; border-radius: 6px; font-size: 10px; }
    .chat-controls button { background: #0284c7; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }

    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-card { background: #1e293b; color: #fff; padding: 14px; border-radius: 16px; width: 85%; max-width: 320px; display: flex; flex-direction: column; gap: 8px; text-align: center; max-height: 85vh; overflow-y: auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 4px 0; }
    .btn-act { background: #0284c7; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .btn-close { background: #64748b; color: #fff; border: none; padding: 6px; border-radius: 6px; font-size: 10px; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="sky-banner"></div>

  <!-- ഫ്ലോട്ടിംഗ് മൈക്ക് & പ്രോംപ്റ്റ് & കിക്ക് ബട്ടൺ -->
  <button id="mic-float-btn" onclick="toggleAlwaysVoiceMic()" title="Voice Mic">🎙️</button>
  <button id="proximity-prompt" onclick="interactWithNearbyTarget()"></button>
  <button id="dismount-btn" onclick="dismountActiveRide()">🚪 Dismount / Walk Normal</button>
  <button id="kick-ball-btn" onclick="triggerBallKick()">⚽ KICK</button>

  <div id="ui-layer">
    <div class="top-bar">
      <div class="badges">
        <div id="owner-tag" class="badge owner-tag hidden">👑 OWNER</div>
        <div class="badge">🪙 <span id="pts">100</span></div>
      </div>
      <div class="top-btns">
        <button class="btn-top" onclick="openBox('country-box')">🌍 Server</button>
        <button class="btn-top" onclick="openBox('lang-box')">⚙️ Lang</button>
        <button class="btn-top" onclick="openBox('weather-box')">⛅ Weather</button>
        <button class="btn-top star-btn" onclick="openBox('stars-box')">⭐ Stars</button>
      </div>
    </div>

    <div class="side-dock">
      <button class="dock-btn" onclick="teleportToConcertStage()">🎤 Concert & Audience Seats</button>
      <button class="dock-btn" onclick="teleportMountainPeak()">🏔️ Mountain Peak Flag</button>
      <button class="dock-btn" onclick="teleportVolcanoCrater()">🌋 Lava Volcano (Stars)</button>
      <button class="dock-btn" onclick="openBox('sky-wish-box')">🎆 Sky Wish Message</button>
      <button class="dock-btn" onclick="openBox('avatar-box')">🧑 Avatar Selection</button>
      <button class="dock-btn" onclick="openBox('room-box')">💬 Group Chats</button>
    </div>

    <!-- 🕹️ ജോയ്സ്റ്റിക്ക് -->
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>

    <!-- ചാറ്റ് ബോക്സ് -->
    <div class="chat-box">
      <div id="chat-content"></div>
      <div class="chat-controls">
        <input type="text" id="chat-txt" placeholder="Group chat..." maxlength="80">
        <button onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- 1. രാജ്യങ്ങൾ (Persian, Tajik, Uzbek, Chinese, Burmese, Italian ഉൾപ്പെടെ) -->
  <div id="country-box" class="modal hidden">
    <div class="modal-card">
      <h3>🌍 Select World Server</h3>
      <div class="grid-2">
        <button onclick="changeServer('kerala', '🌴 Kerala')" class="btn-act">🌴 Kerala</button>
        <button onclick="changeServer('india', '🇮🇳 India')" class="btn-act">🇮🇳 India</button>
        <button onclick="changeServer('uae', '🇦🇪 UAE/Dubai')" class="btn-act">🇦🇪 UAE</button>
        <button onclick="changeServer('iran', '🇮🇷 Iran / Persian')" class="btn-act">🇮🇷 Iran</button>
        <button onclick="changeServer('tajikistan', '🇹🇯 Tajikistan')" class="btn-act">🇹🇯 Tajikistan</button>
        <button onclick="changeServer('uzbekistan', '🇺🇿 Uzbekistan')" class="btn-act">🇺🇿 Uzbekistan</button>
        <button onclick="changeServer('china', '🇨🇳 China')" class="btn-act">🇨🇳 China</button>
        <button onclick="changeServer('myanmar', '🇲🇲 Myanmar')" class="btn-act">🇲🇲 Myanmar</button>
        <button onclick="changeServer('italy', '🇮🇹 Italy')" class="btn-act">🇮🇹 Italy</button>
        <button onclick="changeServer('russia', '🇷🇺 Russia')" class="btn-act">🇷🇺 Russia</button>
        <button onclick="changeServer('usa', '🇺🇸 USA')" class="btn-act">🇺🇸 USA</button>
        <button onclick="changeServer('germany', '🇩🇪 Germany')" class="btn-act">🇩🇪 Germany</button>
      </div>
      <button onclick="closeBox('country-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 2. ഭാഷ മാറ്റം (Persian, Tajik, Uzbek, Chinese, Burmese, Italian) -->
  <div id="lang-box" class="modal hidden">
    <div class="modal-card">
      <h3>⚙️ Select Language</h3>
      <div class="grid-2">
        <button onclick="setLang('ml')" class="btn-act">മലയാളം</button>
        <button onclick="setLang('en')" class="btn-act">English</button>
        <button onclick="setLang('fa')" class="btn-act">فارسی (Persian)</button>
        <button onclick="setLang('tg')" class="btn-act">Тоҷикӣ (Tajik)</button>
        <button onclick="setLang('uz')" class="btn-act">O‘zbek (Uzbek)</button>
        <button onclick="setLang('zh')" class="btn-act">中文 (Chinese)</button>
        <button onclick="setLang('my')" class="btn-act">မြန်မာ (Burmese)</button>
        <button onclick="setLang('it')" class="btn-act">Italiano (Italian)</button>
        <button onclick="setLang('ru')" class="btn-act">Русский</button>
        <button onclick="setLang('ar')" class="btn-act">العربية</button>
      </div>
      <button onclick="closeBox('lang-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 3. കാലാവസ്ഥ മാറ്റം (Day, Night, Rain, Snow) -->
  <div id="weather-box" class="modal hidden">
    <div class="modal-card">
      <h3>⛅ Climate & Weather System</h3>
      <div class="grid-2">
        <button onclick="setWeather('day')" class="btn-act" style="background:#0284c7;">☀️ Bright Day</button>
        <button onclick="setWeather('night')" class="btn-act" style="background:#0f172a;">🌙 Night Stars</button>
        <button onclick="setWeather('rain')" class="btn-act" style="background:#0369a1;">🌧️ Heavy Rain</button>
        <button onclick="setWeather('snow')" class="btn-act" style="background:#38bdf8; color:#000;">❄️ Falling Snow</button>
      </div>
      <button onclick="closeBox('weather-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 4. ക്യാരക്ടർ ബിൽഡർ -->
  <div id="avatar-box" class="modal hidden">
    <div class="modal-card">
      <h3>🧑 Avatar Model</h3>
      <div class="grid-2">
        <button onclick="setGender('boy')" class="btn-act">👦 Boy Model</button>
        <button onclick="setGender('girl')" class="btn-act" style="background:#ec4899;">👧 Girl Model</button>
      </div>
      <button onclick="closeBox('avatar-box')" class="btn-close">Done</button>
    </div>
  </div>

  <!-- 5. ആകാശത്ത് വിഷ് എഴുതൽ -->
  <div id="sky-wish-box" class="modal hidden">
    <div class="modal-card">
      <h3>🎆 Sky Wish Broadcast</h3>
      <p style="font-size:11px; color:#cbd5e1;">ആകാശത്ത് എല്ലാവർക്കും കാണാൻ പറ്റുന്ന വിഷ് അയക്കുക:</p>
      <input type="text" id="sky-msg-input" placeholder="Happy Birthday / Love You..." style="padding:8px; border-radius:8px; border:1px solid #64748b; background:#0f172a; color:#fff; font-size:11px;">
      <button onclick="broadcastSkyWish()" class="btn-act" style="background:linear-gradient(45deg, #eab308, #ca8a04); color:#000;">⭐ Send to Sky (15 Stars)</button>
      <button onclick="closeBox('sky-wish-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 6. ഗ്രൂപ്പ് റൂമുകൾ -->
  <div id="room-box" class="modal hidden">
    <div class="modal-card">
      <h3>💬 Custom Group Lounges</h3>
      <div id="room-buttons" class="grid-2"></div>
      <p style="font-size:11px; margin-top:8px;">Create New Group Room:</p>
      <div style="display:flex; gap:4px;">
        <input type="text" id="new-group-name" placeholder="Room title..." style="flex:1; padding:6px; border-radius:6px; border:none; font-size:10px;">
        <button onclick="createRoomAction()" class="btn-act">Create</button>
      </div>
      <button onclick="closeBox('room-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 7. Telegram Stars സ്റ്റോർ -->
  <div id="stars-box" class="modal hidden">
    <div class="modal-card">
      <h3>⭐ Telegram Stars Official Store</h3>
      <button onclick="purchaseStars('Godzilla & King Kong Giants Pass', 'beast_ride', 25)" class="btn-act" style="background:#15803d;">🦖 Unlock Giants (25 Stars)</button>
      <button onclick="purchaseStars('1-on-1 Video Calling Pass', 'video_pass', 35)" class="btn-act" style="background:#ca8a04;">📹 Video Call Pass (35 Stars)</button>
      <button onclick="openBox('sky-wish-box'); closeBox('stars-box');" class="btn-act" style="background:#a855f7;">🎆 Sky Fireworks Wish (15 Stars)</button>
      <button onclick="closeBox('stars-box')" class="btn-close">Close</button>
    </div>
  </div>

  <script>
    const socket = io();
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let isOwner = false;
    let unlockedBeast = false;
    let userGender = 'boy';
    let userColor = '#2563eb';
    let activeRide = 'walk';
    let userPts = 100;

    // --- 3D Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.002);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.3);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(80, 150, 80);
    scene.add(dirLight);

    // വിശാലമായ ദ്വീപ് & സമുദ്രം
    const island = new THREE.Mesh(new THREE.CylinderGeometry(260, 280, 5, 48), new THREE.MeshStandardMaterial({ color: 0x2e7d32 }));
    island.position.y = -2.5;
    scene.add(island);

    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1 }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = -4;
    scene.add(ocean);

    // റോഡ് ട്രാക്ക്
    const road = new THREE.Mesh(new THREE.RingGeometry(60, 76, 48), new THREE.MeshStandardMaterial({ color: 0x334155 }));
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.05;
    scene.add(road);

    // ----------------------------------------------------
    // 🏍️ 1. ചിത്രത്തിൽ കാണുന്ന റിയലിസ്റ്റിക് റെഡ് ക്രൂയിസർ ബൈക്ക്
    // ----------------------------------------------------
    function createCruiserMotorcycle(x, z) {
      const g = new THREE.Group();
      // ചുവന്ന ഫ്യുവൽ ടാങ്ക്
      const tank = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 12), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
      tank.scale.set(0.8, 0.7, 1.4); tank.position.set(0, 1.25, 0.2); g.add(tank);

      // തവിട്ട് ലെതർ സീറ്റ്
      const seat = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.25, 1.1), new THREE.MeshStandardMaterial({ color: 0xb45309 }));
      seat.position.set(0, 1.15, -0.7); g.add(seat);

      // വി-ട്വിൻ എഞ്ചിൻ ബ്ലോക്ക് (Chrome)
      const engine = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.7, 0.9), new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 }));
      engine.position.set(0, 0.7, -0.1); g.add(engine);

      // ക്രോം സൈലൻസർ എക്‌സ്‌ഹോസ്റ്റ് പൈപ്പ്
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 2.2), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9 }));
      pipe.rotation.x = Math.PI / 2; pipe.position.set(0.45, 0.55, -0.8); g.add(pipe);

      // വട്ടത്തിലുള്ള ഹെഡ്‌ലൈറ്റ്
      const hl = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xfef08a, emissive: 0xfef08a, emissiveIntensity: 0.8 }));
      hl.rotation.x = Math.PI / 2; hl.position.set(0, 1.5, 1.3); g.add(hl);

      // ഹാൻഡിൽബാർ
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.5), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
      handle.rotation.z = Math.PI / 2; handle.position.set(0, 1.7, 0.9); g.add(handle);

      // വീലുകൾ
      const wGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.35, 16);
      const wMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
      const wF = new THREE.Mesh(wGeo, wMat); wF.rotation.z = Math.PI / 2; wF.position.set(0, 0.6, 1.4); g.add(wF);
      const wB = new THREE.Mesh(wGeo, wMat); wB.rotation.z = Math.PI / 2; wB.position.set(0, 0.6, -1.4); g.add(wB);

      g.position.set(x, 0, z); scene.add(g);
      return { mesh: g, type: 'bike', prompt: '🏍️ Ride Red Cruiser Bike' };
    }

    // ----------------------------------------------------
    // 🦖 2. ചിത്രത്തിൽ കാണുന്ന റിയലിസ്റ്റിക് ചുവന്ന ടി-റെക്സ് ദിനോസർ
    // ----------------------------------------------------
    function createRedTRex(x, z) {
      const g = new THREE.Group();
      const redMat = new THREE.MeshStandardMaterial({ color: 0xc2410c, roughness: 0.8 });
      const bellyMat = new THREE.MeshStandardMaterial({ color: 0xfed7aa, roughness: 0.8 });

      // ഉടൽ & വയർ
      const body = new THREE.Mesh(new THREE.SphereGeometry(3.5, 16, 16), redMat);
      body.scale.set(0.9, 1.2, 1.6); body.position.y = 5.5; g.add(body);
      const belly = new THREE.Mesh(new THREE.SphereGeometry(2.8, 16, 16), bellyMat);
      belly.scale.set(0.8, 1.1, 1.4); belly.position.set(0, 5.2, 1); g.add(belly);

      // വലിയ തല & താടിയെല്ല്
      const head = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 3.8), redMat);
      head.position.set(0, 8.5, 3); g.add(head);

      // വാൽ

      isDragging = true; prevX = e.touches[0].clientX;
    });
    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      cameraAngle -= (e.touches[0].clientX - prevX) * 0.008;

    // 🕹️ ജോയ്സ്റ്റിക്ക്
    let moveX = 0, moveZ = 0;
    const jBase = document.getElementById('joystick-base');
    const jStick = document.getElementById('joystick-stick');
    const center = { x: 55, y: 55 };

    function touchHandler(cx, cy) {
      const b = jBase.getBoundingClientRect();
      let dx = cx - b.left - center.x;
      let dy = cy - b.top - center.y;
      const dist = Math.hypot(dx, dy);
      const maxR = 35;
      if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
      jStick.style.left = `${center.x + dx - 20}px`;
      jStick.style.top = `${center.y + dy - 20}px`;
      moveX = dx / maxR;
      moveZ = dy / maxR;
    }

    const clearTouch = () => { jStick.style.left = '35px'; jStick.style.top = '35px'; moveX = 0; moveZ = 0; };
    jBase.addEventListener('touchstart', (e) => { e.preventDefault(); touchHandler(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });
    jBase.addEventListener('touchmove', (e) => { e.preventDefault(); touchHandler(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });

      let found = null;
      for (let item of worldInteractables) {
        if (myPlayer.position.distanceTo(item.mesh.position) < 7) {

          break;

      }
      const promptBtn = document.getElementById('proximity-prompt');

        nearbyTarget = found;

    let isVoiceActive = false, voiceRecorder = null, voiceStream = null;
    window.toggleAlwaysVoiceMic = async () => {
      const btn = document.getElementById('mic-float-btn');
      if (!isVoiceActive) {
        try {
          voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          voiceRecorder = new MediaRecorder(voiceStream);
          voiceRecorder.ondataavailable = (e) => {
            if (e.data.size > 0 && isVoiceActive) {
              const r = new FileReader();
              r.onload = () => socket.emit('voiceTalkStream', r.result);
              r.readAsDataURL(e.data);
            }
          };
          voiceRecorder.start(250);
          isVoiceActive = true;
          btn.classList.remove('muted');
          btn.innerText = "🎙️";
          alert("🎙️ Voice LIVE! Everyone can hear you talk.");
        } catch (err) { alert("Mic Permission: " + err.message); }
      } else {
        isVoiceActive = false;
        if (voiceRecorder) voiceRecorder.stop();
        if (voiceStream) voiceStream.getTracks().forEach(t => t.stop());
        btn.classList.add('muted');
        btn.innerText = "🔇";

      requestAnimationFrame(animate);

      checkProximity();

      // മഴ/മഞ്ഞ് വീഴുന്ന ആനിമേഷൻ
      if (weatherParticles.visible) {
        const positions = weatherParticles.geometry.attributes.position.array;
        for (let i = 1; i < rainCount * 3; i += 3) {
          positions[i] -= weatherType === 'snow' ? 0.3 : 1.2;
          if (positions[i] < 0) positions[i] = 70;
        }
        weatherParticles.geometry.attributes.position.needsUpdate = true;
      }

      const spd = ['dino', 'kong'].includes(activeRide) ? 0.7 : (activeRide === 'bike' ? 0.9 : 0.4);

      if (moveX !== 0 || moveZ !== 0) {
        const forwardX = moveX * Math.cos(cameraAngle) + moveZ * Math.sin(cameraAngle);
        const forwardZ = -moveX * Math.sin(cameraAngle) + moveZ * Math.cos(cameraAngle);

        myPlayer.position.x += forwardX * spd;
        myPlayer.position.z += forwardZ * spd;
        myPlayer.rotation.y = Math.atan2(forwardX, forwardZ);

        wCycle += 0.2;
        if (myPlayer.userData.legL) {
          myPlayer.userData.legL.rotation.x = Math.sin(wCycle) * 0.6;
          myPlayer.userData.legR.rotation.x = -Math.sin(wCycle) * 0.6;
        }

        if (nearbyTarget && activeRide !== 'walk') {
          nearbyTarget.mesh.position.set(myPlayer.position.x, 0, myPlayer.position.z);
          nearbyTarget.mesh.rotation.y = myPlayer.rotation.y;
        }

        socket.emit('updatePosition', { x: myPlayer.position.x, y: myPlayer.position.y, z: myPlayer.position.z });
      }

      // ഫുട്ബോൾ കിക്ക് ഫിസിക്സ്
      if (ballSpeedZ > 0) {
        football.position.z -= ballSpeedZ;
        football.rotation.x -= 0.1;
        ballSpeedZ *= 0.97;
        if (football.position.z <= -14 && Math.abs(football.position.x) < 6) {
          ballSpeedZ = 0;
          football.position.set(0, 0.7, 10);
          userPts += 50;
          document.getElementById('pts').innerText = userPts;
          alert("⚽ GOAAAAL! +50 Points Added! 🎉");
        }
      }

      const camDist = 14;
      camera.position.x = myPlayer.position.x + Math.sin(cameraAngle) * camDist;
      camera.position.y = myPlayer.position.y + 8;
      camera.position.z = myPlayer.position.z + Math.cos(cameraAngle) * camDist;
      camera.lookAt(myPlayer.position.x, myPlayer.position.y + 2, myPlayer.position.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
