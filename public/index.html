<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe GTA Island</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; }

    .top-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; z-index: 40; pointer-events: none; }
    .top-bar * { pointer-events: auto; }
    .badges-group { display: flex; gap: 6px; }
    .badge { background: rgba(15, 23, 42, 0.9); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); }
    .badge.stars { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
    .btn-circle { width: 36px; height: 36px; border-radius: 50%; background: rgba(15, 23, 42, 0.9); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; font-size: 14px; cursor: pointer; }

    #score-hud { position: absolute; top: 88px; left: 8px; background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; border-radius: 12px; padding: 8px 12px; color: #fff; font-size: 11px; font-weight: 700; z-index: 30; }
    #action-btn { position: absolute; bottom: 135px; left: 50%; transform: translateX(-50%); background: #0284c7; color: #fff; border: 2px solid #fff; padding: 12px 28px; border-radius: 30px; font-size: 13px; font-weight: 900; display: none; z-index: 45; cursor: pointer; }
    #dismount-btn { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; border: 1.5px solid #fff; padding: 8px 22px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 45; cursor: pointer; }

    #joy-base { position: absolute; left: 16px; bottom: 25px; width: 100px; height: 100px; background: rgba(15, 23, 42, 0.65); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); z-index: 30; }
    #joy-stick { position: absolute; left: 32px; top: 32px; width: 36px; height: 36px; background: #38bdf8; border-radius: 50%; pointer-events: none; }

    .extra-controls { position: absolute; bottom: 25px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 35; align-items: flex-end; }
    .ctrl-row { display: flex; gap: 8px; }
    .btn-touch { width: 56px; height: 48px; border-radius: 12px; background: rgba(15, 23, 42, 0.88); border: 2px solid #38bdf8; color: #fff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-touch.jump { background: #0284c7; border-radius: 50%; width: 58px; height: 50px; }
    .btn-touch.sprint { background: #eab308; color: #000; border-color: #fde047; }
    .btn-touch.map { background: #8b5cf6; border-color: #a78bfa; }
    .btn-touch.gas { background: #22c55e; border-color: #4ade80; display: none; }
    .btn-touch.brake { background: #ef4444; border-color: #f87171; display: none; }

    #chat-box { position: absolute; bottom: 20px; left: 125px; width: 185px; background: rgba(15, 23, 42, 0.95); border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); padding: 6px; z-index: 50; }
    #chat-msgs { height: 42px; overflow-y: auto; font-size: 10px; color: #fff; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
    .chat-bubble { background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 4px; }
    .chat-controls { display: flex; gap: 4px; }
    #chat-in { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; color: #fff; font-size: 11px; padding: 3px 5px; outline: none; }
    #chat-send { background: #0284c7; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
    .modal-card { background: #0f172a; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 18px; width: 320px; color: #fff; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; overflow-y: auto; }
    .modal-card h3 { font-size: 14px; color: #38bdf8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-action { background: #1e293b; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-action.primary { background: #0284c7; border-color: #38bdf8; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="top-bar">
    <div class="badges-group">
      <div class="badge stars">⭐ 350 STARS</div>
      <div class="badge">🟢 <span id="hud-online">1</span> Online</div>
    </div>
    <div style="display:flex; gap:6px;">
      <button id="btn-mic" class="btn-circle" onclick="toggleMicrophone()">🎙</button>
      <button class="btn-circle" onclick="openModal('weather-modal')">⛅</button>
      <button class="btn-circle" onclick="openMasterSettings()">⚙️</button>
      <button class="btn-circle" onclick="toggleMapView()">🗺️</button>
    </div>
  </div>

  <div id="score-hud">⚽ Goals: <span id="score-goals">0</span></div>
  <button id="action-btn">ACTION</button>
  <button id="dismount-btn" onclick="exitVehicle()">🚪 EXIT</button>

  <div id="joy-base"><div id="joy-stick"></div></div>

  <div class="extra-controls">
    <div class="ctrl-row">
      <button id="btn-steer-left" class="btn-touch">◀️</button>
      <button id="btn-steer-right" class="btn-touch">▶️</button>
      <button id="btn-sprint" class="btn-touch sprint">⚡ RUN</button>
    </div>
    <div class="ctrl-row">
      <button id="btn-gas" class="btn-touch gas">⚡ GAS</button>
      <button id="btn-brake" class="btn-touch brake">🛑 STOP</button>
      <button class="btn-touch map" onclick="toggleMapView()">🗺️ MAP</button>
      <button id="btn-jump" class="btn-touch jump" onclick="triggerJump()">JUMP</button>
    </div>
  </div>

  <div id="chat-box">
    <div id="chat-msgs"><div class="chat-bubble"><b>System:</b> Connected to Island!</div></div>
    <div class="chat-controls">
      <input type="text" id="chat-in" placeholder="Chat here...">
      <button id="chat-send" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <div id="master-settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⚙️ Profile & Settings</h3>
      <input type="text" id="upd-player-name" class="btn-action" style="text-align:left; background:#000;" placeholder="Player Name">
      <div class="grid-btns">
        <button class="btn-action" onclick="applyGenderSelect('man')">👦 Boy</button>
        <button class="btn-action" onclick="applyGenderSelect('girl')">👧 Girl</button>
      </div>
      <input type="text" id="upd-tele-id" class="btn-action" style="text-align:left; background:#000;" placeholder="Telegram ID (@username)">
      <input type="text" id="upd-insta-id" class="btn-action" style="text-align:left; background:#000;" placeholder="Instagram ID (@username)">
      
      <h3>📤 Share Room</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="shareSocial('whatsapp')">💬 WhatsApp</button>
        <button class="btn-action" onclick="shareSocial('telegram')">✈️ Telegram</button>
        <button class="btn-action" onclick="shareSocial('insta')">📸 Instagram</button>
        <button class="btn-action" onclick="shareSocial('copy')">📋 Copy Link</button>
      </div>

      <h3>🌐 11 Languages</h3>
      <div class="grid-btns" style="grid-template-columns: 1fr 1fr 1fr; gap:4px;">
        <button class="btn-action" onclick="setLanguage('en')">English</button>
        <button class="btn-action" onclick="setLanguage('ml')">മലയാളം</button>
        <button class="btn-action" onclick="setLanguage('hi')">हिन्दी</button>
        <button class="btn-action" onclick="setLanguage('fa')">فارسی</button>
        <button class="btn-action" onclick="setLanguage('tg')">Тоҷикӣ</button>
        <button class="btn-action" onclick="setLanguage('uz')">O'zbek</button>
        <button class="btn-action" onclick="setLanguage('ru')">Русский</button>
        <button class="btn-action" onclick="setLanguage('it')">Italiano</button>
        <button class="btn-action" onclick="setLanguage('id')">Indo</button>
        <button class="btn-action" onclick="setLanguage('my')">မြန်မာ</button>
      </div>
      <button class="btn-action primary" onclick="closeMasterSettings()">Save & Close</button>
    </div>
  </div>

  <div id="weather-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⛅ Weather</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="applyWeather('day')">☀️ Day</button>
        <button class="btn-action" onclick="applyWeather('night')">🌙 Night</button>
        <button class="btn-action" onclick="applyWeather('rain')">🌧️ Rain</button>
        <button class="btn-action" onclick="applyWeather('snow')">❄️ Snow</button>
        <button class="btn-action" onclick="applyWeather('desert')">🏜️ Desert</button>
      </div>
      <button class="btn-action" onclick="closeModal('weather-modal')">Close</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const socket = io();
    let penaltyGoals = 0;
    let isMapView = false;
    let isMicActive = false;

    window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; };
    window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; };
    window.openMasterSettings = () => { document.getElementById('master-settings-modal').style.display = 'flex'; };
    window.closeMasterSettings = () => { document.getElementById('master-settings-modal').style.display = 'none'; };
    window.toggleMapView = () => { isMapView = !isMapView; };

    // Share & Languages
    window.shareSocial = (type) => {
      const url = window.location.href;
      if (type === 'whatsapp') window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('Join GlobeVibe GTA Island: ' + url)}`);
      else if (type === 'telegram') window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent('Play with me on Island!')}`);
      else if (type === 'insta') { navigator.clipboard.writeText(url); alert("Link copied for Instagram!"); }
      else { navigator.clipboard.writeText(url); alert("Link copied!"); }
    };

    const dict = {
      en: { jump: "JUMP", run: "⚡ RUN" },
      ml: { jump: "ചാടുക", run: "⚡ ഓടുക" },
      hi: { jump: "कूदें", run: "⚡ दौड़ें" },
      fa: { jump: "پرش", run: "⚡ دویدن" },
      tg: { jump: "Ҷаҳидан", run: "⚡ Давидан" },
      uz: { jump: "Sakrash", run: "⚡ Yugurish" },
      ru: { jump: "ПРЫЖОК", run: "⚡ БЕГ" },
      it: { jump: "SALTO", run: "⚡ CORRI" },
      id: { jump: "LOMPAT", run: "⚡ LARI" },
      my: { jump: "ခုန်ရန်", run: "⚡ ပြေးရန်" }
    };
    window.setLanguage = (lang) => {
      const t = dict[lang] || dict['en'];
      document.getElementById('btn-jump').innerText = t.jump;
      document.getElementById('btn-sprint').innerText = t.run;
      closeMasterSettings();
    };

    // Synthesizer Audio
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (actx.state === 'suspended') actx.resume();
      const now = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);
      if (type === 'kick') {
        osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        gain.gain.setValueAtTime(0.6, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'piano') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 1.0);
        osc.start(now); osc.stop(now + 1.0);
      }
    }

    // Three.js Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050811);
    scene.fog = new THREE.FogExp2(0x050811, 0.001);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.8);
    scene.add(hemiLight);
    const sun = new THREE.DirectionalLight(0xfff1dc, 0.9);
    sun.position.set(60, 120, 60);
    scene.add(sun);

    window.applyWeather = (mode) => {
      if (mode === 'day') { scene.background.setHex(0x38bdf8); scene.fog.color.setHex(0x38bdf8); sun.intensity = 1.0; }
      else if (mode === 'night') { scene.background.setHex(0x020617); scene.fog.color.setHex(0x020617); sun.intensity = 0.15; }
      else if (mode === 'rain') { scene.background.setHex(0x334155); scene.fog.color.setHex(0x334155); sun.intensity = 0.4; }
      else if (mode === 'snow') { scene.background.setHex(0x94a3b8); scene.fog.color.setHex(0x94a3b8); sun.intensity = 0.5; }
      else if (mode === 'desert') { scene.background.setHex(0x78350f); scene.fog.color.setHex(0x78350f); sun.intensity = 0.7; }
      closeModal('weather-modal');
    };

    // Deep Ocean Water
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, transparent: true, opacity: 0.85 }));
    ocean.rotation.x = -Math.PI / 2; ocean.position.y = 0.0; scene.add(ocean);

    // Ground Surfaces (Elevated at Y: 4.8)
    const island = new THREE.Mesh(new THREE.CylinderGeometry(76, 82, 9, 64), new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.85 }));
    island.position.set(0, 0.4, 0); scene.add(island);

    const snowBase = new THREE.Mesh(new THREE.CylinderGeometry(25, 26, 9.2, 32), new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.9 }));
    snowBase.position.set(30, 0.45, 25); scene.add(snowBase);

    const desertBase = new THREE.Mesh(new THREE.CylinderGeometry(25, 26, 9.2, 32), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.9 }));
    desertBase.position.set(-32, 0.45, -28); scene.add(desertBase);

    // GLB Asset Loader (Ensures zero sinking under surface)
    const mixers = [];
    const gltfLoader = new THREE.GLTFLoader();
    function loadGLB(file, size, targetY, onLoad, playAnim = true) {
      const handle = (gltf) => {
        const root = gltf.scene;
        const bbox = new THREE.Box3().setFromObject(root);
        const sz = new THREE.Vector3(); bbox.getSize(sz);
        const maxD = Math.max(sz.x, sz.y, sz.z);
        if (maxD > 0 && size) root.scale.setScalar(size / maxD);
        
        const updatedBox = new THREE.Box3().setFromObject(root);
        root.position.y = targetY - updatedBox.min.y;

        if (playAnim && gltf.animations && gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(root);
          mixer.clipAction(gltf.animations[0]).play();
          mixers.push(mixer);
        }
        onLoad(root);
      };
      gltfLoader.load(file, handle, undefined, () => gltfLoader.load('/' + file, handle, undefined, () => {}));
    }

    // 1. Sky Fireworks Loop
    const fwGeo = new THREE.BufferGeometry();
    const fwCount = 100;
    const fwPos = new Float32Array(fwCount * 3);
    const fwVels = [];
    for(let i=0; i<fwCount; i++) {
      fwPos[i*3] = (Math.random()-0.5)*50;
      fwPos[i*3+1] = 40 + Math.random()*25;
      fwPos[i*3+2] = (Math.random()-0.5)*50;
      fwVels.push({ vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, vz: (Math.random()-0.5)*0.3 });
    }
    fwGeo.setAttribute('position', new THREE.BufferAttribute(fwPos, 3));
    const fwParticles = new THREE.Points(fwGeo, new THREE.PointsMaterial({ color: 0xf59e0b, size: 1.5 }));
    scene.add(fwParticles);

    // 2. Godzilla & King Kong (Dark Charcoal skin & Live Animation)
    const godzillaSea = new THREE.Group(); godzillaSea.position.set(-110, 0, -85); scene.add(godzillaSea);
    loadGLB('godzilla.glb', 28, 0, m => godzillaSea.add(m));

    const kingKongSea = new THREE.Group(); kingKongSea.position.set(-90, 0, -85); kingKongSea.rotation.y = -Math.PI / 2; scene.add(kingKongSea);
    loadGLB('king kong.glb', 26, 0, m => {
      m.traverse(node => {
        if (node.isMesh) node.material = new THREE.MeshStandardMaterial({ color: 0x3a3632, roughness: 0.85 });
      });
      kingKongSea.add(m);
    });

    // 3. Soccer Field: Goalpost & Ball
    const goalpost = new THREE.Group(); goalpost.position.set(0, 4.9, -60); goalpost.rotation.y = 0; scene.add(goalpost);
    loadGLB('goalpost.glb', 5.5, 4.9, m => goalpost.add(m));

    const fBall = new THREE.Group(); fBall.position.set(0, 5.2, -48); scene.add(fBall);
    loadGLB('football.glb', 0.8, 5.2, m => fBall.add(m));

    // 4. Desert: Elevated Camel & Tram 2
    loadGLB('camel_walk.glb', 4.5, 4.9, m => { m.position.set(-32, 4.9, -28); scene.add(m); });
    const tram2Rig = new THREE.Group(); scene.add(tram2Rig);
    loadGLB('tram2.glb', 5.0, 4.9, m => tram2Rig.add(m));

    // 5. Snow: Tram 1 & Surface Vehicles
    const tram1Rig = new THREE.Group(); scene.add(tram1Rig);
    loadGLB('tram1.glb', 5.0, 4.9, m => tram1Rig.add(m));

    const vehicles = {};
    function regCar(name, obj) { vehicles[name] = obj; }

    const roverCar = new THREE.Group(); roverCar.position.set(12, 4.9, 16); scene.add(roverCar);
    loadGLB('rangerover.glb', 4.4, 4.9, m => roverCar.add(m));
    regCar('rover', roverCar);

    const groundPlane = new THREE.Group(); groundPlane.position.set(10, 4.9, -40); groundPlane.rotation.y = Math.PI; scene.add(groundPlane);
    loadGLB('plane1.glb', 10.0, 4.9, m => groundPlane.add(m));
    regCar('plane', groundPlane);

    // 6. Forest Valley, Mountain & Flying Birds/Dragon
    loadGLB('forest_terrain.glb', 40, 4.9, m => { m.position.set(-36, 4.9, 65); scene.add(m); });
    loadGLB('rope_bridge.glb', 10, 5.5, m => { m.position.set(-18, 5.5, 22); scene.add(m); });

    const flyingGroup = new THREE.Group(); flyingGroup.position.set(-36, 22, 35); scene.add(flyingGroup);
    loadGLB('dragon.glb', 6.5, 22, m => { m.position.set(15, 0, 0); flyingGroup.add(m); });
    loadGLB('Pterodactylus.glb', 4.2, 22, m => { m.position.set(-15, 1, 0); flyingGroup.add(m); });
    loadGLB('eagle.glb', 2.5, 22, m => { m.position.set(0, 2, 12); flyingGroup.add(m); });

    loadGLB('Trex.glb', 5.5, 4.9, m => { m.position.set(-38, 4.9, 20); scene.add(m); });
    loadGLB('velociraptor.glb', 3.2, 4.9, m => { m.position.set(-34, 4.9, 24); scene.add(m); });

    // 7. Concert Stage & Instruments
    const concertStage = new THREE.Group(); concertStage.position.set(30, 4.9, -20); scene.add(concertStage);
    loadGLB('concert_stage.glb', 14, 4.9, m => concertStage.add(m));
    loadGLB('piano.glb', 2.5, 6.2, m => { m.position.set(26, 6.2, -22); scene.add(m); });

    // 8. Ocean Water Life (All Fishes Strictly in Sea)
    loadGLB('Whale.glb', 14.0, -1.8, m => { m.position.set(-120, -1.8, 80); scene.add(m); });
    loadGLB('dolphin.glb', 4.5, -0.8, m => { m.position.set(-95, -0.8, 90); scene.add(m); });
    loadGLB('shark.glb', 5.5, -1.0, m => { m.position.set(100, -1.0, 95); scene.add(m); });
    loadGLB('stingray.glb', 4.0, -1.0, m => { m.position.set(-50, -1.0, 85); scene.add(m); });

    // ==========================================
    // MULTIPLAYER AVATAR RENDERING ENGINE (കാണാൻ സാധിക്കുന്നത്)
    // ==========================================
    const remotePlayers = {};
    function renderRemotePlayer(data) {
      if (data.id === socket.id || remotePlayers[data.id]) return;
      const group = new THREE.Group();
      group.position.set(data.x, data.y || 4.9, data.z);
      scene.add(group);

      loadGLB(data.gender === 'girl' ? 'girl.glb' : 'man.glb', 2.0, 4.9, (mesh) => {
        mesh.rotation.set(0, 0, 0);
        group.add(mesh);
      }, false);
      remotePlayers[data.id] = { group, data };
    }

    socket.on('initWorld', (data) => {
      for (let id in data.players) {
        if (id !== socket.id) renderRemotePlayer(data.players[id]);
      }
      document.getElementById('hud-online').innerText = data.count || 1;
    });

    socket.on('playerJoined', (data) => {
      renderRemotePlayer(data);
      document.getElementById('hud-online').innerText = data.count || Object.keys(remotePlayers).length + 1;
    });

    socket.on('playerMoved', (data) => {
      if (remotePlayers[data.id]) {
        const p = remotePlayers[data.id].group;
        p.position.set(data.x, data.y, data.z);
        p.rotation.y = data.rotY || 0;
      }
    });

    socket.on('playerLeft', (data) => {
      if (remotePlayers[data.id]) {
        scene.remove(remotePlayers[data.id].group);
        delete remotePlayers[data.id];
      }
      document.getElementById('hud-online').innerText = data.count || Object.keys(remotePlayers).length + 1;
    });

    // Local Player
    const localPlayer = new THREE.Group(); localPlayer.position.set(0, 4.9, 0); scene.add(localPlayer);
    const localAvatar = new THREE.Group(); localPlayer.add(localAvatar);

    function loadAvatar(gender) {
      while(localAvatar.children.length > 0) localAvatar.remove(localAvatar.children[0]);
      loadGLB(gender === 'girl' ? 'girl.glb' : 'man.glb', 2.0, 4.9, m => {
        m.rotation.set(0, 0, 0);
        localAvatar.add(m);
      }, false);
    }
    loadAvatar('man');
    window.applyGenderSelect = (g) => { loadAvatar(g); closeMasterSettings(); };

    // Joystick & Controls
    let joyX = 0, joyZ = 0, camRotX = 0, camRotY = 0.25;
    let isSprint = false, steerBtnX = 0;
    let isGas = false, isBrake = false;
    let currentVehicle = null;

    const jBase = document.getElementById('joy-base');
    const jStick = document.getElementById('joy-stick');
    jBase.addEventListener('touchmove', e => {
      e.preventDefault();
      const b = jBase.getBoundingClientRect();
      let dx = e.touches[0].clientX - b.left - 50;
      let dy = e.touches[0].clientY - b.top - 50;
      const d = Math.hypot(dx, dy);
      if (d > 38) { dx = (dx / d) * 38; dy = (dy / d) * 38; }
      jStick.style.left = `${50 + dx - 18}px`;
      jStick.style.top = `${50 + dy - 18}px`;
      joyX = dx / 38; joyZ = dy / 38;
    }, { passive: false });
    jBase.addEventListener('touchend', () => { jStick.style.left = '32px'; jStick.style.top = '32px'; joyX = 0; joyZ = 0; });

    document.getElementById('btn-sprint').addEventListener('touchstart', e => { e.preventDefault(); isSprint = true; });
    document.getElementById('btn-sprint').addEventListener('touchend', () => isSprint = false);
    document.getElementById('btn-steer-left').addEventListener('touchstart', e => { e.preventDefault(); steerBtnX = -1; });
    document.getElementById('btn-steer-left').addEventListener('touchend', () => steerBtnX = 0);
    document.getElementById('btn-steer-right').addEventListener('touchstart', e => { e.preventDefault(); steerBtnX = 1; });
    document.getElementById('btn-steer-right').addEventListener('touchend', () => steerBtnX = 0);

    const bGas = document.getElementById('btn-gas');
    const bBrake = document.getElementById('btn-brake');
    bGas.addEventListener('touchstart', e => { e.preventDefault(); isGas = true; });
    bGas.addEventListener('touchend', () => isGas = false);
    bBrake.addEventListener('touchstart', e => { e.preventDefault(); isBrake = true; });
    bBrake.addEventListener('touchend', () => isBrake = false);

    let isDrag = false, touchX = 0, touchY = 0;
    window.addEventListener('touchstart', e => {
      if (e.target.closest('#joy-base') || e.target.closest('button') || e.target.closest('#chat-box') || e.target.closest('.modal-card')) return;
      isDrag = true; touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', e => {
      if (!isDrag) return;
      camRotX -= (e.touches[0].clientX - touchX) * 0.005;
      camRotY += (e.touches[0].clientY - touchY) * 0.003;
      camRotY = Math.max(-0.4, Math.min(1.2, camRotY));
      touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
    });
    window.addEventListener('touchend', () => isDrag = false);

    window.triggerJump = () => { if (localPlayer.position.y <= 5.1) localPlayer.position.y = 6.8; };

    // Chat Box Working Engine
    window.sendChatMessage = () => {
      const inp = document.getElementById('chat-in');
      const text = inp.value.trim();
      if (!text) return;
      socket.emit('chatMessage', { text });
      inp.value = '';
    };
    document.getElementById('chat-in').addEventListener('keypress', e => { if (e.key === 'Enter') sendChatMessage(); });

    socket.on('chatMessage', data => {
      const msgs = document.getElementById('chat-msgs');
      const b = document.createElement('div');
      b.className = 'chat-bubble';
      b.innerHTML = `<b>${data.name}:</b> ${data.text}`;
      msgs.appendChild(b);
      msgs.scrollTop = msgs.scrollHeight;
    });

    // Proximity Interactions (Vehicles & Concert)
    const actBtn = document.getElementById('action-btn');
    function checkProximity() {
      if (currentVehicle) { actBtn.style.display = 'none'; return; }
      const p = localPlayer.position;

      for (let k in vehicles) {
        const v = vehicles[k];
        if (p.distanceTo(v.position) < 5.0) {
          actBtn.innerText = `🚗 BOARD ${k.toUpperCase()}`;
          actBtn.style.display = 'block';
          actBtn.onclick = () => {
            currentVehicle = v;
            v.add(localAvatar);
            localAvatar.visible = false;
            document.getElementById('dismount-btn').style.display = 'block';
            bGas.style.display = 'flex';
            bBrake.style.display = 'flex';
          };
          return;
        }
      }

      if (p.distanceTo(new THREE.Vector3(26, 6.2, -22)) < 3.0) {
        actBtn.innerText = "🎵 PLAY PIANO";
        actBtn.style.display = 'block';
        actBtn.onclick = () => playSound('piano');
        return;
      }
      actBtn.style.display = 'none';
    }

    window.exitVehicle = () => {
      if (!currentVehicle) return;
      localPlayer.add(localAvatar);
      localAvatar.visible = true;
      localAvatar.position.set(0, 0, 0);
      localPlayer.position.set(currentVehicle.position.x + 3.0, 4.9, currentVehicle.position.z);
      document.getElementById('dismount-btn').style.display = 'none';
      bGas.style.display = 'none';
      bBrake.style.display = 'none';
      currentVehicle = null;
    };

    // Main Loop
    const clock = new THREE.Clock();
    let tram1T = 0, tram2T = 0;

    function animate() {
      requestAnimationFrame(animate);
      checkProximity();
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();
      mixers.forEach(m => m.update(delta));

      // Fireworks Loop
      const fArr = fwParticles.geometry.attributes.position.array;
      for(let i=0; i<fwCount; i++) {
        fArr[i*3] += fwVels[i].vx;
        fArr[i*3+1] += fwVels[i].vy;
        fArr[i*3+2] += fwVels[i].vz;
        if (fArr[i*3+1] < 35) {
          fArr[i*3] = (Math.random()-0.5)*50;
          fArr[i*3+1] = 45 + Math.random()*20;
          fArr[i*3+2] = (Math.random()-0.5)*50;
        }
      }
      fwParticles.geometry.attributes.position.needsUpdate = true;

      // Tram Outer Loops
      tram1T += delta * 0.22;
      tram1Rig.position.set(30 + Math.sin(tram1T) * 16, 4.9, 25 + Math.cos(tram1T) * 16);
      tram1Rig.rotation.y = tram1T + Math.PI / 2;

      tram2T += delta * 0.22;
      tram2Rig.position.set(-32 + Math.sin(tram2T) * 14, 4.9, -28 + Math.cos(tram2T) * 14);
      tram2Rig.rotation.y = tram2T + Math.PI / 2;

      // Dragon Sky Orbit
      flyingGroup.rotation.y = time * 0.25;

      // Player / Vehicle Movement
      if (!currentVehicle) {
        localAvatar.rotation.set(0, 0, 0);
        if (localPlayer.position.y > 4.9) localPlayer.position.y = Math.max(4.9, localPlayer.position.y - 0.15);
        else localPlayer.position.y = 4.9;

        const effJoyX = joyX !== 0 ? joyX : steerBtnX;
        if (effJoyX !== 0 || joyZ !== 0) {
          const speed = isSprint ? 0.7 : 0.35;
          const fx = effJoyX * Math.cos(camRotX) + joyZ * Math.sin(camRotX);
          const fz = -effJoyX * Math.sin(camRotX) + joyZ * Math.cos(camRotX);
          localPlayer.position.x += fx * speed;
          localPlayer.position.z += fz * speed;
          localPlayer.rotation.y = Math.atan2(fx, fz);

          // Position Sync to Server
          socket.emit('playerMoved', { x: localPlayer.position.x, y: localPlayer.position.y, z: localPlayer.position.z, rotY: localPlayer.rotation.y });
        }
      } else {
        const effJoyX = joyX !== 0 ? joyX : steerBtnX;
        let driveSpeed = 0;
        if (isGas) driveSpeed = 0.7;
        else if (isBrake) driveSpeed = -0.3;
        else if (joyZ !== 0) driveSpeed = -joyZ * 0.5;

        currentVehicle.rotation.y -= effJoyX * 0.04;
        currentVehicle.position.x += Math.sin(currentVehicle.rotation.y) * driveSpeed;
        currentVehicle.position.z += Math.cos(currentVehicle.rotation.y) * driveSpeed;
        localPlayer.position.copy(currentVehicle.position);
      }

      // Camera
      if (isMapView) {
        camera.position.set(0, 140, 40);
        camera.lookAt(0, 0, 0);
      } else {
        const p = currentVehicle ? currentVehicle.position : localPlayer.position;
        const dist = 11;
        camera.position.x = p.x + Math.sin(camRotX) * Math.cos(camRotY) * dist;
        camera.position.y = p.y + Math.sin(camRotY) * dist + 2.5;
        camera.position.z = p.z + Math.cos(camRotX) * Math.cos(camRotY) * dist;
        camera.lookAt(p.x, p.y + 2.2, p.z);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
