<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe Metaverse GTA Island</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; }

    .top-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; z-index: 40; pointer-events: none; }
    .top-bar * { pointer-events: auto; }
    .badges-group { display: flex; gap: 6px; }
    .badge { background: rgba(15, 23, 42, 0.9); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); }
    .badge.stars { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
    .btn-circle { width: 36px; height: 36px; border-radius: 50%; background: rgba(15, 23, 42, 0.9); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; font-size: 14px; cursor: pointer; }

    #score-hud { position: absolute; top: 88px; left: 8px; background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; border-radius: 12px; padding: 8px 12px; color: #fff; font-size: 11px; font-weight: 700; z-index: 30; }
    #action-btn { position: absolute; bottom: 135px; left: 50%; transform: translateX(-50%); background: #0284c7; color: #fff; border: 2px solid #fff; padding: 12px 28px; border-radius: 30px; font-size: 13px; font-weight: 900; display: none; z-index: 45; cursor: pointer; }
    #dismount-btn { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; border: 1.5px solid #fff; padding: 8px 22px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 45; cursor: pointer; }

    #joy-base { position: absolute; left: 16px; bottom: 25px; width: 100px; height: 100px; background: rgba(15, 23, 42, 0.65); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); z-index: 30; }
    #joy-stick { position: absolute; left: 32px; top: 32px; width: 36px; height: 36px; background: #38bdf8; border-radius: 50%; pointer-events: none; }

    .extra-controls { position: absolute; bottom: 25px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 35; align-items: flex-end; }
    .ctrl-row { display: flex; gap: 8px; }
    .btn-touch { width: 56px; height: 48px; border-radius: 12px; background: rgba(15, 23, 42, 0.88); border: 2px solid #38bdf8; color: #fff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-touch.jump { background: #0284c7; border-radius: 50%; width: 58px; height: 50px; }
    .btn-touch.sprint { background: #eab308; color: #000; border-color: #fde047; }
    .btn-touch.map { background: #8b5cf6; border-color: #a78bfa; }
    .btn-touch.gas { background: #22c55e; border-color: #4ade80; display: none; }
    .btn-touch.brake { background: #ef4444; border-color: #f87171; display: none; }

    #chat-box { position: absolute; bottom: 20px; left: 125px; width: 185px; background: rgba(15, 23, 42, 0.95); border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); padding: 6px; z-index: 50; }
    #chat-msgs { height: 42px; overflow-y: auto; font-size: 10px; color: #fff; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
    .chat-bubble { background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 4px; }
    .chat-controls { display: flex; gap: 4px; }
    #chat-in { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; color: #fff; font-size: 11px; padding: 3px 5px; outline: none; }
    #chat-send { background: #0284c7; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
    .modal-card { background: #0f172a; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 18px; width: 320px; color: #fff; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; overflow-y: auto; }
    .modal-card h3 { font-size: 14px; color: #38bdf8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-action { background: #1e293b; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-action.primary { background: #0284c7; border-color: #38bdf8; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="top-bar">
    <div class="badges-group">
      <div class="badge stars">⭐ 350 STARS</div>
      <div class="badge">🟢 <span id="hud-online">1</span> Online</div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn-circle" onclick="openModal('weather-modal')">⛅</button>
      <button class="btn-circle" onclick="openMasterSettings()">⚙️</button>
      <button class="btn-circle" onclick="toggleMapView()">🗺️</button>
    </div>
  </div>

  <div id="score-hud">⚽ Goals: <span id="score-goals">0</span></div>
  <button id="action-btn">ACTION</button>
  <button id="dismount-btn" onclick="exitVehicle()">🚪 EXIT</button>

  <div id="joy-base"><div id="joy-stick"></div></div>

  <div class="extra-controls">
    <div class="ctrl-row">
      <button id="btn-steer-left" class="btn-touch">◀️</button>
      <button id="btn-steer-right" class="btn-touch">▶️</button>
      <button id="btn-sprint" class="btn-touch sprint">⚡ RUN</button>
    </div>
    <div class="ctrl-row">
      <button id="btn-gas" class="btn-touch gas">⚡ GAS</button>
      <button id="btn-brake" class="btn-touch brake">🛑 STOP</button>
      <button class="btn-touch map" onclick="toggleMapView()">🗺️ MAP</button>
      <button id="btn-jump" class="btn-touch jump" onclick="triggerJump()">JUMP</button>
    </div>
  </div>

  <div id="chat-box">
    <div id="chat-msgs"><div class="chat-bubble"><b>System:</b> Connected to Island!</div></div>
    <div class="chat-controls">
      <input type="text" id="chat-in" placeholder="Chat here...">
      <button id="chat-send" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <!-- Settings & Languages Modal -->
  <div id="master-settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⚙️ Profile & Settings</h3>
      <input type="text" id="upd-player-name" class="btn-action" style="text-align:left; background:#000;" placeholder="Player Name">
      <div class="grid-btns">
        <button class="btn-action" onclick="applyGenderSelect('man')">👦 Boy</button>
        <button class="btn-action" onclick="applyGenderSelect('girl')">👧 Girl</button>
      </div>
      <input type="text" id="upd-tele-id" class="btn-action" style="text-align:left; background:#000;" placeholder="Telegram ID (@username)">
      <input type="text" id="upd-insta-id" class="btn-action" style="text-align:left; background:#000;" placeholder="Instagram ID (@username)">
      
      <h3>📤 Share Room</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="shareSocial('whatsapp')">💬 WhatsApp</button>
        <button class="btn-action" onclick="shareSocial('telegram')">✈️ Telegram</button>
        <button class="btn-action" onclick="shareSocial('copy')">📋 Copy Link</button>
      </div>

      <h3>🌐 11 Languages</h3>
      <div class="grid-btns" style="grid-template-columns: 1fr 1fr 1fr; gap:4px;">
        <button class="btn-action" onclick="setLanguage('en')">English</button>
        <button class="btn-action" onclick="setLanguage('ml')">മലയാളം</button>
        <button class="btn-action" onclick="setLanguage('hi')">हिन्दी</button>
        <button class="btn-action" onclick="setLanguage('fa')">فارسی</button>
        <button class="btn-action" onclick="setLanguage('tg')">Тоҷикӣ</button>
        <button class="btn-action" onclick="setLanguage('uz')">O'zbek</button>
        <button class="btn-action" onclick="setLanguage('ru')">Русский</button>
        <button class="btn-action" onclick="setLanguage('it')">Italiano</button>
        <button class="btn-action" onclick="setLanguage('id')">Indo</button>
        <button class="btn-action" onclick="setLanguage('my')">မြန်မာ</button>
      </div>
      <button class="btn-action primary" onclick="closeMasterSettings()">Save & Close</button>
    </div>
  </div>

  <!-- Climate Modal -->
  <div id="weather-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⛅ Weather</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="applyWeather('day')">☀️ Day</button>
        <button class="btn-action" onclick="applyWeather('night')">🌙 Night</button>
        <button class="btn-action" onclick="applyWeather('rain')">🌧️ Rain</button>
        <button class="btn-action" onclick="applyWeather('snow')">❄️ Snow</button>
        <button class="btn-action" onclick="applyWeather('desert')">🏜️ Desert</button>
      </div>
      <button class="btn-action" onclick="closeModal('weather-modal')">Close</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const socket = io();
    let penaltyGoals = 0;
    let isMapView = false;

    window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; };
    window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; };
    window.openMasterSettings = () => { document.getElementById('master-settings-modal').style.display = 'flex'; };
    window.closeMasterSettings = () => { document.getElementById('master-settings-modal').style.display = 'none'; };
    window.toggleMapView = () => { isMapView = !isMapView; };

    // Share & Languages
    window.shareSocial = (type) => {
      const url = window.location.href;
      if (type === 'whatsapp') window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('Join GlobeVibe GTA Island: ' + url)}`);
      else if (type === 'telegram') window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent('Play with me on Island!')}`);
      else { navigator.clipboard.writeText(url); alert("Link copied!"); }
    };

    const dict = {
      en: { jump: "JUMP", run: "⚡ RUN" },
      ml: { jump: "ചാടുക", run: "⚡ ഓടുക" },
      hi: { jump: "कूदें", run: "⚡ दौड़ें" },
      fa: { jump: "پرش", run: "⚡ دویدن" },
      tg: { jump: "Ҷаҳидан", run: "⚡ Давидан" },
      uz: { jump: "Sakrash", run: "⚡ Yugurish" },
      ru: { jump: "ПРЫЖОК", run: "⚡ БЕГ" },
      it: { jump: "SALTO", run: "⚡ CORRI" },
      id: { jump: "LOMPAT", run: "⚡ LARI" },
      my: { jump: "ခုန်ရန်", run: "⚡ ပြေးရန်" }
    };
    window.setLanguage = (lang) => {
      const t = dict[lang] || dict['en'];
      document.getElementById('btn-jump').innerText = t.jump;
      document.getElementById('btn-sprint').innerText = t.run;
      closeMasterSettings();
    };

    // Synthesizer Audio SFX
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (actx.state === 'suspended') actx.resume();
      const now = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);
      if (type === 'kick') {
        osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        gain.gain.setValueAtTime(0.6, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'piano') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 1.0);
        osc.start(now); osc.stop(now + 1.0);
      } else if (type === 'guitar') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(330, now);
        gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'drums') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
        gain.gain.setValueAtTime(0.8, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'violin') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(659, now);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 1.0);
        osc.start(now); osc.stop(now + 1.0);
      } else if (type === 'dj') {
        osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(600, now + 0.3);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    // Three.js Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050811);
    scene.fog = new THREE.FogExp2(0x050811, 0.001);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.85);
    scene.add(hemiLight);
    const sun = new THREE.DirectionalLight(0xfff1dc, 0.95);
    sun.position.set(60, 120, 60);
    scene.add(sun);

    window.applyWeather = (mode) => {
      if (mode === 'day') { scene.background.setHex(0x38bdf8); scene.fog.color.setHex(0x38bdf8); sun.intensity = 1.0; }
      else if (mode === 'night') { scene.background.setHex(0x020617); scene.fog.color.setHex(0x020617); sun.intensity = 0.15; }
      else if (mode === 'rain') { scene.background.setHex(0x334155); scene.fog.color.setHex(0x334155); sun.intensity = 0.4; }
      else if (mode === 'snow') { scene.background.setHex(0x94a3b8); scene.fog.color.setHex(0x94a3b8); sun.intensity = 0.5; }
      else if (mode === 'desert') { scene.background.setHex(0x78350f); scene.fog.color.setHex(0x78350f); sun.intensity = 0.7; }
      closeModal('weather-modal');
    };

    // Deep Ocean Water
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, transparent: true, opacity: 0.85 }));
    ocean.rotation.x = -Math.PI / 2; ocean.position.y = 0.0; scene.add(ocean);

    // Island Flat Ground Surfaces (Y: 4.4 Standard Ground Level)
    const island = new THREE.Mesh(new THREE.CylinderGeometry(76, 82, 8, 64), new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.85 }));
    island.position.set(0, 0.4, 0); scene.add(island);

    const snowBase = new THREE.Mesh(new THREE.CylinderGeometry(25, 26, 8.1, 32), new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.9 }));
    snowBase.position.set(30, 0.45, 25); scene.add(snowBase);

    const desertBase = new THREE.Mesh(new THREE.CylinderGeometry(25, 26, 8.1, 32), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.9 }));
    desertBase.position.set(-32, 0.45, -28); scene.add(desertBase);

    const turf = new THREE.Mesh(new THREE.BoxGeometry(26, 8.2, 42), new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.6 }));
    turf.position.set(0, 0.45, -44); scene.add(turf);

    // 1. CONTINUOUS GROUND-REACHING SNOWFALL
    const snowGeo = new THREE.BufferGeometry();
    const snowCount = 250;
    const snowPositions = new Float32Array(snowCount * 3);
    for(let i=0; i<snowCount; i++) {
      snowPositions[i*3] = 30 + (Math.random() - 0.5) * 45;
      snowPositions[i*3+1] = 4.4 + Math.random() * 25;
      snowPositions[i*3+2] = 25 + (Math.random() - 0.5) * 45;
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPositions, 3));
    const snowParticles = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4 }));
    scene.add(snowParticles);

    // 2. VOLCANO & CONTINUOUS LAVA PARTICLES
    const volcanoGroup = new THREE.Group(); volcanoGroup.position.set(0, 0, -145); scene.add(volcanoGroup);
    const lavaLight = new THREE.PointLight(0xff4500, 3.5, 90);
    lavaLight.position.set(0, 22, -145); scene.add(lavaLight);

    const lavaGeo = new THREE.BufferGeometry();
    const pCount = 80;
    const lPos = new Float32Array(pCount * 3);
    const lVels = [];
    for (let i = 0; i < pCount; i++) {
      lPos[i * 3] = (Math.random() - 0.5) * 6;
      lPos[i * 3 + 1] = 18 + Math.random() * 4;
      lPos[i * 3 + 2] = -145 + (Math.random() - 0.5) * 6;
      lVels.push({ vx: (Math.random() - 0.5) * 0.4, vy: 0.2 + Math.random() * 0.3, vz: (Math.random() - 0.5) * 0.4 });
    }
    lavaGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3));
    const lavaParticles = new THREE.Points(lavaGeo, new THREE.PointsMaterial({ color: 0xff3b00, size: 1.4 }));
    scene.add(lavaParticles);

    // 3. SKY FIREWORKS LOOP
    const fwGeo = new THREE.BufferGeometry();
    const fwCount = 100;
    const fwPos = new Float32Array(fwCount * 3);
    const fwVels = [];
    for(let i=0; i<fwCount; i++) {
      fwPos[i*3] = (Math.random()-0.5)*50;
      fwPos[i*3+1] = 40 + Math.random()*25;
      fwPos[i*3+2] = (Math.random()-0.5)*50;
      fwVels.push({ vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, vz: (Math.random()-0.5)*0.3 });
    }
    fwGeo.setAttribute('position', new THREE.BufferAttribute(fwPos, 3));
    const fwParticles = new THREE.Points(fwGeo, new THREE.PointsMaterial({ color: 0xf59e0b, size: 1.5 }));
    scene.add(fwParticles);

    // GLB Asset Loader
    const mixers = [];
    const gltfLoader = new THREE.GLTFLoader();
    function loadGLB(file, size, onLoad, playAnim = true) {
      const handle = (gltf) => {
        const root = gltf.scene;
        const bbox = new THREE.Box3().setFromObject(root);
        const sz = new THREE.Vector3(); bbox.getSize(sz);
        const maxD = Math.max(sz.x, sz.y, sz.z);
        if (maxD > 0 && size) root.scale.setScalar(size / maxD);
        if (playAnim && gltf.animations && gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(root);
          mixer.clipAction(gltf.animations[0]).play();
          mixers.push(mixer);
        }
        onLoad(root);
      };
      gltfLoader.load(file, handle, undefined, () => gltfLoader.load('/' + file, handle, undefined, () => {}));
    }

    loadGLB('volcano.glb', 50, m => volcanoGroup.add(m));

    // GODZILLA & KING KONG (Matching Dark Color & Kong Live Animation)
    const godzillaSea = new THREE.Group(); godzillaSea.position.set(-110, 0, -85); scene.add(godzillaSea);
    loadGLB('godzilla.glb', 28, m => godzillaSea.add(m));

    const kingKongSea = new THREE.Group(); kingKongSea.position.set(-90, 0, -85); kingKongSea.rotation.y = -Math.PI / 2; scene.add(kingKongSea);
    loadGLB('king kong.glb', 26, m => {
      m.traverse(node => {
        if (node.isMesh) node.material = new THREE.MeshStandardMaterial({ color: 0x3a3632, roughness: 0.85 });
      });
      kingKongSea.add(m);
    });

    // SOCCER FIELD: GOALPOST & BALL
    const goalpost = new THREE.Group(); goalpost.position.set(0, 4.4, -62); goalpost.rotation.y = 0; scene.add(goalpost);
    loadGLB('goalpost.glb', 5.5, m => goalpost.add(m));

    const ballRig = { pos: new THREE.Vector3(0, 4.75, -48), vel: new THREE.Vector3(0, 0, 0) };
    const fBall = new THREE.Group(); fBall.position.copy(ballRig.pos); scene.add(fBall);
    loadGLB('football.glb', 0.8, m => fBall.add(m));

    // DESERT ZONE: CAMEL & TRAM 2 ON SURFACE
    loadGLB('camel_walk.glb', 4.5, m => { m.position.set(-32, 4.4, -28); scene.add(m); });
    loadGLB('fennecfox.glb', 1.6, m => { m.position.set(-28, 4.4, -24); scene.add(m); });
    loadGLB('scorpion.glb', 1.2, m => { m.position.set(-36, 4.4, -20); scene.add(m); });
    loadGLB('boulder.glb', 3.5, m => { m.position.set(-38, 4.4, -32); scene.add(m); });

    const tram2Rig = new THREE.Group(); scene.add(tram2Rig);
    loadGLB('tram2.glb', 5.0, m => tram2Rig.add(m));

    // SNOW ZONE: TRAM 1 (CLEARED TRACK) & CABLE CAR & HOUSES
    const tram1Rig = new THREE.Group(); scene.add(tram1Rig);
    loadGLB('tram1.glb', 5.0, m => tram1Rig.add(m));

    const cableCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(20, 8.5, 20), new THREE.Vector3(0, 16, 30), new THREE.Vector3(-20, 22, 40)]);
    const cableLine = new THREE.Mesh(new THREE.TubeGeometry(cableCurve, 32, 0.05, 8, false), new THREE.MeshBasicMaterial({ color: 0x334155 }));
    scene.add(cableLine);
    const cableCarRig = new THREE.Group(); scene.add(cableCarRig);
    loadGLB('cablecar.glb', 3.2, m => cableCarRig.add(m));

    loadGLB('ski_station.glb', 10, m => { m.position.set(28, 4.4, 18); scene.add(m); });
    loadGLB('winter_market.glb', 8, m => { m.position.set(34, 4.4, 24); scene.add(m); });
    loadGLB('polar_bear.glb', 3.8, m => { m.position.set(26, 4.4, 30); scene.add(m); });
    loadGLB('reindeer.glb', 3.4, m => { m.position.set(22, 4.4, 26); scene.add(m); });
    loadGLB('penguin_single.glb', 1.4, m => { m.position.set(34, 4.4, 32); scene.add(m); });

    // FOREST VALLEY, DINOSAURS, TREES & SOLID ROPE BRIDGE
    loadGLB('forest_terrain.glb', 40, m => { m.position.set(-36, 4.4, 65); scene.add(m); });
    loadGLB('rope_bridge.glb', 10, m => { m.position.set(-18, 4.4, 22); scene.add(m); });

    loadGLB('Trex.glb', 5.5, m => { m.position.set(-38, 4.4, 20); scene.add(m); });
    loadGLB('Triceratops.glb', 4.5, m => { m.position.set(-28, 4.4, 28); scene.add(m); });
    loadGLB('Stegosaurus.glb', 4.5, m => { m.position.set(-42, 4.4, 26); scene.add(m); });
    loadGLB('velociraptor.glb', 3.2, m => { m.position.set(-34, 4.4, 24); scene.add(m); });
    loadGLB('Oviraptor.glb', 2.8, m => { m.position.set(-30, 4.4, 16); scene.add(m); });

    const treeList = ['twisted_tree_1.glb', 'twisted_tree_2', 'forest_trees.glb', 'tree_large.glb', 'tree.glb', 'palm_tree.glb'];
    treeList.forEach((t, i) => loadGLB(t, 6.0, m => { m.position.set(-20 - i * 4, 4.4, 14 + i * 3); scene.add(m); }));
    const flowerList = ['flower_bush.glb', 'flower_group.glb', 'flower_single.glb', 'flower_yellow.glb', 'flowers_small.glb'];
    flowerList.forEach((f, i) => loadGLB(f, 2.0, m => { m.position.set(-16 - i * 3, 4.4, 14 + i * 4); scene.add(m); }));

    // FLYING DRAGON & BIRDS ONLY IN MOUNTAIN SKY
    const flyingGroup = new THREE.Group(); flyingGroup.position.set(-36, 20, 35); scene.add(flyingGroup);
    loadGLB('dragon.glb', 6.5, m => { m.position.set(15, 0, 0); flyingGroup.add(m); });
    loadGLB('Pterodactylus.glb', 4.2, m => { m.position.set(-15, 1, 0); flyingGroup.add(m); });
    loadGLB('eagle.glb', 2.5, m => { m.position.set(0, 2, 12); flyingGroup.add(m); });

    const insectGroup = new THREE.Group(); insectGroup.position.set(-20, 5.2, 20); scene.add(insectGroup);
    loadGLB('armabee.glb', 1.0, m => { m.position.set(2, 0, 0); insectGroup.add(m); });
    loadGLB('butterfly_blue.glb', 1.2, m => { m.position.set(-2, 0.3, 1); insectGroup.add(m); });
    loadGLB('butterfly_orange.glb', 1.2, m => { m.position.set(0, -0.3, -2); insectGroup.add(m); });

    // CITY BUILDINGS
    loadGLB('city.glb', 26, m => { m.position.set(0, 4.4, 0); scene.add(m); });
    loadGLB('city_tower.glb', 16, m => { m.position.set(-14, 4.4, -10); scene.add(m); });
    loadGLB('city_shop.glb', 7.5, m => { m.position.set(12, 4.4, -8); scene.add(m); });

    // CONCERT STAGE & PLAYABLE INSTRUMENTS
    const concertStage = new THREE.Group(); concertStage.position.set(30, 4.4, -20); scene.add(concertStage);
    loadGLB('concert_stage.glb', 14, m => concertStage.add(m));

    const playableInstruments = {};
    function regInst(name, file, pos, sfx) {
      loadGLB(file, 2.5, m => { m.position.copy(pos); scene.add(m); playableInstruments[name] = { obj: m, sfx }; });
    }
    regInst('piano', 'piano.glb', new THREE.Vector3(26, 5.7, -22), 'piano');
    regInst('drums', 'drum_set.glb', new THREE.Vector3(34, 5.7, -22), 'drums');
    regInst('dj', 'dj_gear.glb', new THREE.Vector3(30, 5.7, -18), 'dj');
    regInst('guitar', 'electric_guitar.glb', new THREE.Vector3(28, 5.7, -20), 'guitar');
    regInst('violin', 'violin.glb', new THREE.Vector3(32, 5.7, -20), 'violin');

    // VEHICLES (ALL GROUNDED ON ROAD)
    const multiVehicles = {};
    function registerRig(name, obj, isFlyer=false) { multiVehicles[name] = { object: obj, isFlyer }; }

    const groundPlane = new THREE.Group(); groundPlane.position.set(10, 4.4, -40); groundPlane.rotation.y = Math.PI; scene.add(groundPlane);
    loadGLB('plane1.glb', 10.0, m => groundPlane.add(m));
    registerRig('plane1', groundPlane, true);

    const carRover = new THREE.Group(); carRover.position.set(12, 4.4, 16); scene.add(carRover);
    loadGLB('rangerover.glb', 4.4, m => carRover.add(m));
    registerRig('rangerover', carRover);

    const carChallenger = new THREE.Group(); carChallenger.position.set(12, 4.4, 10); scene.add(carChallenger);
    loadGLB('challenger.glb', 4.2, m => carChallenger.add(m));
    registerRig('challenger', carChallenger);

    const vanVehicle = new THREE.Group(); vanVehicle.position.set(12, 4.4, 22); scene.add(vanVehicle);
    loadGLB('van.glb', 4.8, m => vanVehicle.add(m));
    registerRig('van', vanVehicle);

    const spaceJet = new THREE.Group(); spaceJet.position.set(-25, 4.4, 0); scene.add(spaceJet);
    loadGLB('spaceship.glb', 6.0, m => spaceJet.add(m));
    registerRig('jet', spaceJet, true);

    const heliEntity = new THREE.Group(); heliEntity.position.set(-15, 4.4, 10); scene.add(heliEntity);
    loadGLB('helicopter.glb', 5.5, m => heliEntity.add(m));
    registerRig('heli', heliEntity, true);

    const mechEntity = new THREE.Group(); mechEntity.position.set(0, 4.4, -22); scene.add(mechEntity);
    loadGLB('mech.glb', 8.0, m => mechEntity.add(m));
    registerRig('mech', mechEntity);

    const bikeMoto = new THREE.Group(); bikeMoto.position.set(6, 4.4, 12); scene.add(bikeMoto);
    loadGLB('motorcycle.glb', 2.6, m => bikeMoto.add(m));
    registerRig('motorcycle', bikeMoto);

    const bikeOld = new THREE.Group(); bikeOld.position.set(6, 4.4, 16); scene.add(bikeOld);
    loadGLB('oldbike.glb', 2.2, m => bikeOld.add(m));
    registerRig('oldbike', bikeOld);

    // SHIPS & STILL BOAT
    loadGLB('dock.glb', 12, m => { m.position.set(0, 1.2, 62); scene.add(m); });
    const calmBoat = new THREE.Group(); calmBoat.position.set(14, 0.2, 70); scene.add(calmBoat);
    loadGLB('low_poly_boat.glb', 5.0, m => calmBoat.add(m));
    registerRig('boat', calmBoat);

    const cargoShip = new THREE.Group(); cargoShip.position.set(0, 0.5, 95); scene.add(cargoShip);
    loadGLB('low_poly_cargo_ship.glb', 18, m => cargoShip.add(m));
    registerRig('ship', cargoShip);

    // OCEAN LIFE (ALL 19 FISHES STRICTLY IN WATER)
    loadGLB('Whale.glb', 14.0, m => { m.position.set(-120, -1.8, 80); scene.add(m); });
    loadGLB('dolphin.glb', 4.5, m => { m.position.set(-95, -0.8, 90); scene.add(m); });
    loadGLB('shark.glb', 5.5, m => { m.position.set(100, -1.0, 95); scene.add(m); });
    loadGLB('stingray.glb', 4.0, m => { m.position.set(-50, -1.0, 85); scene.add(m); });

    const fishRoster = [
      'fish_bubbles.glb', 'fish_white.glb', 'fish_blue.glb', 'fish_front.glb', 'swordfish.glb',
      'fish_betta.glb', 'fish_parrot.glb', 'fish_catfish.glb', 'goldfish.glb', 'fish_milkfish.glb',
      'fish_clownfish_zebra.glb', 'fish_blue_goldfish.glb', 'fish_lionfish.glb', 'fish_piranha.glb',
      'fish_trout.glb', 'fish_kingfish.glb', 'clownfish.glb', 'blowfish.glb', 'fish_small_1.glb'
    ];
    fishRoster.forEach((f, i) => {
      loadGLB(f, 1.2, m => { m.position.set(-60 + (i % 6) * 22, -0.9, 65 + Math.floor(i / 6) * 14); scene.add(m); });
    });

    // MULTIPLAYER AVATARS ENGINE (സെർവറിൽ എല്ലാവർക്കും പരസ്പരം കാണാൻ)
    const remotePlayers = {};
    function renderRemotePlayer(data) {
      if (data.id === socket.id || remotePlayers[data.id]) return;
      const group = new THREE.Group();
      group.position.set(data.x, data.y || 4.4, data.z);
      scene.add(group);

      loadGLB(data.gender === 'girl' ? 'girl.glb' : 'man.glb', 2.0, (mesh) => {
        mesh.rotation.set(0, 0, 0);
        group.add(mesh);
      }, false);
      remotePlayers[data.id] = { group, data };
    }

    socket.on('initWorld', (data) => {
      for (let id in data.players) {
        if (id !== socket.id) renderRemotePlayer(data.players[id]);
      }
      document.getElementById('hud-online').innerText = data.count || 1;
    });

    socket.on('playerJoined', (data) => {
      renderRemotePlayer(data);
      document.getElementById('hud-online').innerText = data.count || Object.keys(remotePlayers).length + 1;
    });

    socket.on('playerMoved', (data) => {
      if (remotePlayers[data.id]) {
        const p = remotePlayers[data.id].group;
        p.position.set(data.x, data.y, data.z);
        p.rotation.y = data.rotY || 0;
      }
    });

    socket.on('playerLeft', (data) => {
      if (remotePlayers[data.id]) {
        scene.remove(remotePlayers[data.id].group);
        delete remotePlayers[data.id];
      }
      document.getElementById('hud-online').innerText = data.count || Object.keys(remotePlayers).length + 1;
    });

    // LOCAL PLAYER (STRICTLY ON GROUND)
    const localPlayer = new THREE.Group(); localPlayer.position.set(0, 4.4, 0); scene.add(localPlayer);
    const localAvatar = new THREE.Group(); localPlayer.add(localAvatar);

    function loadAvatar(gender) {
      while(localAvatar.children.length > 0) localAvatar.remove(localAvatar.children[0]);
      loadGLB(gender === 'girl' ? 'girl.glb' : 'man.glb', 2.0, m => {
        m.rotation.set(0, 0, 0);
        m.position.set(0, 0, 0);
        localAvatar.add(m);
      }, false);
    }
    loadAvatar('man');
    window.applyGenderSelect = (g) => { loadAvatar(g); closeMasterSettings(); };

    // JOYSTICK & RUN (100% WORKING SPEED)
    let joyX = 0, joyZ = 0, camRotX = 0, camRotY = 0.25;
    let isSprint = false, steerBtnX = 0;
    let isGas = false, isBrake = false;
    let currentVehicle = null;

    const jBase = document.getElementById('joy-base');
    const jStick = document.getElementById('joy-stick');
    jBase.addEventListener('touchmove', e => {
      e.preventDefault();
      const b = jBase.getBoundingClientRect();
      let dx = e.touches[0].clientX - b.left - 50;
      let dy = e.touches[0].clientY - b.top - 50;
      const d = Math.hypot(dx, dy);
      if (d > 38) { dx = (dx / d) * 38; dy = (dy / d) * 38; }
      jStick.style.left = `${50 + dx - 18}px`;
      jStick.style.top = `${50 + dy - 18}px`;
      joyX = dx / 38; joyZ = dy / 38;
    }, { passive: false });
    jBase.addEventListener('touchend', () => { jStick.style.left = '32px'; jStick.style.top = '32px'; joyX = 0; joyZ = 0; });

    const btnSprint = document.getElementById('btn-sprint');
    btnSprint.addEventListener('touchstart', e => { e.preventDefault(); isSprint = true; btnSprint.style.transform = 'scale(0.9)'; });
    btnSprint.addEventListener('touchend', () => { isSprint = false; btnSprint.style.transform = 'none'; });

    document.getElementById('btn-steer-left').addEventListener('touchstart', e => { e.preventDefault(); steerBtnX = -1; });
    document.getElementById('btn-steer-left').addEventListener('touchend', () => steerBtnX = 0);
    document.getElementById('btn-steer-right').addEventListener('touchstart', e => { e.preventDefault(); steerBtnX = 1; });
    document.getElementById('btn-steer-right').addEventListener('touchend', () => steerBtnX = 0);

    const bGas = document.getElementById('btn-gas');
    const bBrake = document.getElementById('btn-brake');
    bGas.addEventListener('touchstart', e => { e.preventDefault(); isGas = true; });
    bGas.addEventListener('touchend', () => isGas = false);
    bBrake.addEventListener('touchstart', e => { e.preventDefault(); isBrake = true; });
    bBrake.addEventListener('touchend', () => isBrake = false);

    let isDrag = false, touchX = 0, touchY = 0;
    window.addEventListener('touchstart', e => {
      if (e.target.closest('#joy-base') || e.target.closest('button') || e.target.closest('#chat-box') || e.target.closest('.modal-card')) return;
      isDrag = true; touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', e => {
      if (!isDrag) return;
      camRotX -= (e.touches[0].clientX - touchX) * 0.005;
      camRotY += (e.touches[0].clientY - touchY) * 0.003;
      camRotY = Math.max(-0.4, Math.min(1.2, camRotY));
      touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
    });
    window.addEventListener('touchend', () => isDrag = false);

    window.triggerJump = () => { if (localPlayer.position.y <= 4.5) localPlayer.position.y = 6.2; };

    // CHAT ENGINE
    window.sendChatMessage = () => {
      const inp = document.getElementById('chat-in');
      const text = inp.value.trim();
      if (!text) return;
      socket.emit('chatMessage', { text });
      inp.value = '';
    };
    document.getElementById('chat-in').addEventListener('keypress', e => { if (e.key === 'Enter') sendChatMessage(); });

    socket.on('chatMessage', data => {
      const msgs = document.getElementById('chat-msgs');
      const b = document.createElement('div');
      b.className = 'chat-bubble';
      b.innerHTML = `<b>${data.name}:</b> ${data.text}`;
      msgs.appendChild(b);
      msgs.scrollTop = msgs.scrollHeight;
    });

    // PROXIMITY INTERACTIONS
    const actBtn = document.getElementById('action-btn');
    function checkProximity() {
      if (currentVehicle) { actBtn.style.display = 'none'; return; }
      const p = localPlayer.position;

      for (let k in multiVehicles) {
        const v = multiVehicles[k].object;
        if (p.distanceTo(v.position) < 5.0) {
          actBtn.innerText = `🚗 BOARD ${k.toUpperCase()}`;
          actBtn.style.display = 'block';
          actBtn.onclick = () => {
            currentVehicle = multiVehicles[k];
            v.add(localAvatar);
            localAvatar.visible = false;
            document.getElementById('dismount-btn').style.display = 'block';
            bGas.style.display = 'flex';
            bBrake.style.display = 'flex';
          };
          return;
        }
      }

      for (let k in playableInstruments) {
        const inst = playableInstruments[k];
        if (p.distanceTo(inst.obj.position) < 3.2) {
          actBtn.innerText = `🎵 PLAY ${k.toUpperCase()}`;
          actBtn.style.display = 'block';
          actBtn.onclick = () => playSound(inst.sfx);
          return;
        }
      }
      actBtn.style.display = 'none';
    }

    window.exitVehicle = () => {
      if (!currentVehicle) return;
      const v = currentVehicle.object;
      localPlayer.add(localAvatar);
      localAvatar.visible = true;
      localAvatar.position.set(0, 0, 0);
      localPlayer.position.set(v.position.x + 3.0, 4.4, v.position.z);
      document.getElementById('dismount-btn').style.display = 'none';
      bGas.style.display = 'none';
      bBrake.style.display = 'none';
      currentVehicle = null;
    };

    // MAIN GAME LOOP
    const clock = new THREE.Clock();
    let tram1T = 0, tram2T = 0, cableCarT = 0, cableDir = 1;

    function animate() {
      requestAnimationFrame(animate);
      checkProximity();
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();
      mixers.forEach(m => m.update(delta));

      // 1. Continuous Snowfall Loop
      const sPos = snowParticles.geometry.attributes.position.array;
      for (let i = 0; i < snowCount; i++) {
        sPos[i * 3 + 1] -= delta * 5.0;
        if (sPos[i * 3 + 1] <= 4.4) sPos[i * 3 + 1] = 28.0;
      }
      snowParticles.geometry.attributes.position.needsUpdate = true;

      // 2. Volcano Lava Loop
      const posArr = lavaParticles.geometry.attributes.position.array;
      for (let i = 0; i < pCount; i++) {
        posArr[i * 3 + 1] += lVels[i].vy;
        posArr[i * 3] += lVels[i].vx;
        posArr[i * 3 + 2] += lVels[i].vz;
        if (posArr[i * 3 + 1] > 26) {
          posArr[i * 3] = (Math.random() - 0.5) * 6;
          posArr[i * 3 + 1] = 18;
          posArr[i * 3 + 2] = -145 + (Math.random() - 0.5) * 6;
        }
      }
      lavaParticles.geometry.attributes.position.needsUpdate = true;
      lavaLight.intensity = 2.5 + Math.sin(time * 4) * 1.0;

      // 3. Fireworks Loop
      const fArr = fwParticles.geometry.attributes.position.array;
      for(let i=0; i<fwCount; i++) {
        fArr[i*3] += fwVels[i].vx;
        fArr[i*3+1] += fwVels[i].vy;
        fArr[i*3+2] += fwVels[i].vz;
        if (fArr[i*3+1] < 35) {
          fArr[i*3] = (Math.random()-0.5)*50;
          fArr[i*3+1] = 45 + Math.random()*20;
          fArr[i*3+2] = (Math.random()-0.5)*50;
        }
      }
      fwParticles.geometry.attributes.position.needsUpdate = true;

      // 4. Tram 1 Snow Clear Track Loop (Radius: 18 - ഒന്നും ഇടിക്കില്ല)
      tram1T += delta * 0.22;
      tram1Rig.position.set(30 + Math.sin(tram1T) * 18, 4.4, 25 + Math.cos(tram1T) * 18);
      tram1Rig.rotation.y = tram1T + Math.PI / 2;

      // 5. Tram 2 Desert Clear Track Loop
      tram2T += delta * 0.22;
      tram2Rig.position.set(-32 + Math.sin(tram2T) * 14, 4.4, -28 + Math.cos(tram2T) * 14);
      tram2Rig.rotation.y = tram2T + Math.PI / 2;

      // 6. Cable Car Loop
      cableCarT += delta * 0.08 * cableDir;
      if (cableCarT >= 1.0) { cableCarT = 1.0; cableDir = -1; }
      else if (cableCarT <= 0.0) { cableCarT = 0.0; cableDir = 1; }
      cableCarRig.position.copy(cableCurve.getPoint(cableCarT));

      // 7. Dragon Sky Orbit & Insects
      flyingGroup.rotation.y = time * 0.25;
      insectGroup.position.y = 5.2 + Math.sin(time * 3.0) * 0.3;
      insectGroup.rotation.y = Math.sin(time * 1.5) * 0.4;

      // 8. Soccer Ball Physics
      const pToBall = localPlayer.position.distanceTo(fBall.position);
      if (pToBall < 1.4) {
        const pushDir = new THREE.Vector3().subVectors(fBall.position, localPlayer.position).normalize();
        ballRig.vel.x = pushDir.x * 0.55;
        ballRig.vel.z = pushDir.z * 0.55;
        playSound('kick');
      }
      fBall.position.add(ballRig.vel);
      ballRig.vel.multiplyScalar(0.92);
      fBall.position.y = 4.75;

      if (fBall.position.z < -60 && Math.abs(fBall.position.x) < 4.0) {
        playSound('kick');
        penaltyGoals++;
        document.getElementById('score-goals').innerText = penaltyGoals;
        fBall.position.set(0, 4.75, -48);
        ballRig.vel.set(0, 0, 0);
      }

      // 9. Local Player Movement & Strict Ground Clamp
      if (!currentVehicle) {
        localAvatar.rotation.set(0, 0, 0);
        if (localPlayer.position.y > 4.4) localPlayer.position.y = Math.max(4.4, localPlayer.position.y - 0.15);
        else localPlayer.position.y = 4.4;

        const effJoyX = joyX !== 0 ? joyX : steerBtnX;
        if (effJoyX !== 0 || joyZ !== 0) {
          const speed = isSprint ? 0.8 : 0.35;
          const fx = effJoyX * Math.cos(camRotX) + joyZ * Math.sin(camRotX);
          const fz = -effJoyX * Math.sin(camRotX) + joyZ * Math.cos(camRotX);
          localPlayer.position.x += fx * speed;
          localPlayer.position.z += fz * speed;
          localPlayer.rotation.y = Math.atan2(fx, fz);

          socket.emit('playerMoved', { x: localPlayer.position.x, y: localPlayer.position.y, z: localPlayer.position.z, rotY: localPlayer.rotation.y });
        }
      } else {
        const obj = currentVehicle.object;
        const effJoyX = joyX !== 0 ? joyX : steerBtnX;
        let driveSpeed = 0;
        if (isGas) driveSpeed = 0.7;
        else if (isBrake) driveSpeed = -0.3;
        else if (joyZ !== 0) driveSpeed = -joyZ * 0.5;

        obj.rotation.y -= effJoyX * 0.04;
        obj.position.x += Math.sin(obj.rotation.y) * driveSpeed;
        obj.position.z += Math.cos(obj.rotation.y) * driveSpeed;

        if (currentVehicle.isFlyer) {
          if (isGas && obj.position.y < 70) obj.position.y += 0.3;
          if (isBrake && obj.position.y > 4.4) obj.position.y -= 0.3;
        }
        localPlayer.position.copy(obj.position);
      }

      // Camera
      if (isMapView) {
        camera.position.set(0, 140, 40);
        camera.lookAt(0, 0, 0);
      } else {
        const p = currentVehicle ? currentVehicle.object.position : localPlayer.position;
        const dist = 10;
        camera.position.x = p.x + Math.sin(camRotX) * Math.cos(camRotY) * dist;
        camera.position.y = p.y + Math.sin(camRotY) * dist + 2.5;
        camera.position.z = p.z + Math.cos(camRotX) * Math.cos(camRotY) * dist;
        camera.lookAt(p.x, p.y + 2.0, p.z);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
