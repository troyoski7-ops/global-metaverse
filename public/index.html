<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe Metaverse GTA Island</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top HUD */
    .top-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 40; pointer-events: none; }
    .top-bar * { pointer-events: auto; }
    .hud-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .badges-group { display: flex; gap: 5px; flex-wrap: wrap; }
    .badge { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px); color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .badge.stars { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }

    .comm-btns { display: flex; gap: 6px; }
    .btn-circle { width: 38px; height: 38px; border-radius: 50%; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }
    .btn-circle.active { background: #22c55e; border-color: #4ade80; }

    #score-hud { position: absolute; top: 90px; left: 8px; background: rgba(15, 23, 42, 0.88); border: 1px solid #38bdf8; border-radius: 12px; padding: 8px 12px; color: #fff; font-size: 11px; font-weight: 700; z-index: 30; }
    .score-val { color: #38bdf8; font-family: monospace; font-size: 12px; margin-left: 6px; }

    /* Interaction & Speed */
    #action-btn { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); background: #0284c7; color: #fff; border: 2px solid #fff; padding: 12px 28px; border-radius: 30px; font-size: 13px; font-weight: 900; display: none; z-index: 35; box-shadow: 0 4px 15px rgba(2,132,199,0.7); cursor: pointer; }
    #dismount-btn { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; border: 1.5px solid #fff; padding: 8px 22px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 40; cursor: pointer; }
    #speedo { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); color: #38bdf8; border: 1px solid #38bdf8; padding: 5px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 35; }

    /* Mobile Controls: Joystick + Pedals + Steering */
    #joy-base { position: absolute; left: 16px; bottom: 25px; width: 100px; height: 100px; background: rgba(15, 23, 42, 0.65); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); z-index: 30; }
    #joy-stick { position: absolute; left: 32px; top: 32px; width: 36px; height: 36px; background: #38bdf8; border-radius: 50%; pointer-events: none; }

    .extra-controls { position: absolute; bottom: 25px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 35; align-items: flex-end; }
    .ctrl-row { display: flex; gap: 8px; }
    .btn-touch { width: 58px; height: 50px; border-radius: 12px; background: rgba(15, 23, 42, 0.88); border: 2px solid #38bdf8; color: #fff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-touch.jump { background: #0284c7; width: 62px; height: 55px; border-radius: 50%; font-size: 12px; }
    .btn-touch.gas { background: #22c55e; border-color: #4ade80; display: none; }
    .btn-touch.brake { background: #ef4444; border-color: #f87171; display: none; }
    .btn-touch.sprint { background: #eab308; border-color: #fde047; color: #000; }

    #drone-view-btn { position: absolute; bottom: 160px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(15, 23, 42, 0.88); border: 2px solid #a855f7; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; z-index: 35; cursor: pointer; }

    /* Live Chat */
    #chat-box { position: absolute; bottom: 20px; left: 130px; width: 190px; background: rgba(15, 23, 42, 0.88); border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); padding: 6px; z-index: 30; }
    .chat-tabs { display: flex; gap: 4px; margin-bottom: 4px; }
    .chat-tab { flex: 1; text-align: center; font-size: 10px; font-weight: bold; color: #94a3b8; background: rgba(0,0,0,0.4); padding: 3px; border-radius: 4px; cursor: pointer; }
    .chat-tab.active { color: #38bdf8; background: rgba(2, 132, 199, 0.4); }
    #chat-msgs { height: 44px; overflow-y: auto; font-size: 10px; color: #fff; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
    .chat-bubble { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; }
    .chat-controls { display: flex; gap: 4px; }
    #chat-in { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #fff; font-size: 10px; padding: 3px 5px; outline: none; }
    #chat-send { background: #0284c7; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }

    /* Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
    .modal-card { background: #0f172a; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 18px; width: 320px; color: #fff; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; overflow-y: auto; }
    .modal-card h3 { font-size: 15px; color: #38bdf8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-action { background: #1e293b; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 9px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-action.primary { background: #0284c7; border-color: #38bdf8; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD -->
  <div class="top-bar">
    <div class="hud-row">
      <div class="badges-group">
        <div class="badge stars" onclick="openModal('stars-modal')">⭐ <span id="hud-stars">350</span> <span id="lbl-stars">STARS</span></div>
        <div class="badge" onclick="openMasterSettings()">🚪 <span id="hud-room">Global</span></div>
        <div class="badge">🟢 <span id="hud-online">1</span> <span id="lbl-online">Online</span></div>
      </div>
      <div class="comm-btns">
        <button id="btn-prox-mic" class="btn-circle" onclick="toggleProximityMic()">🎙</button>
        <button id="btn-glob-mic" class="btn-circle" onclick="toggleGlobalMic()">📢</button>
        <button class="btn-circle" onclick="openMasterSettings()">⚙️</button>
      </div>
    </div>
    <div class="hud-row">
      <div class="badges-group">
        <div class="badge" onclick="openMasterSettings()">🌐 <span id="hud-lang">English</span></div>
        <div class="badge" onclick="openModal('weather-modal')">⛅ <span id="hud-weather">Sunny</span></div>
        <div class="badge" onclick="openMasterSettings()">👤 <span id="hud-player">Player</span></div>
        <div class="badge" onclick="openModal('friends-modal')">🤝 <span id="lbl-friends">Friends</span></div>
      </div>
    </div>
  </div>

  <div id="score-hud">
    <div>⚽ <span id="lbl-goals">Goals</span>:<span id="score-goals" class="score-val">0</span></div>
  </div>

  <div id="speedo">0 KM/H</div>
  <button id="action-btn">ACTION</button>
  <button id="dismount-btn" onclick="exitSeatOrVehicle()">🚪 EXIT</button>
  <button id="drone-view-btn" onclick="toggleDroneView()">⬆️</button>

  <!-- Mobile On-Screen Controls -->
  <div id="joy-base"><div id="joy-stick"></div></div>

  <div class="extra-controls">
    <div class="ctrl-row">
      <button id="btn-steer-left" class="btn-touch">◀️</button>
      <button id="btn-steer-right" class="btn-touch">▶️</button>
      <button id="btn-sprint" class="btn-touch sprint">⚡ RUN</button>
    </div>
    <div class="ctrl-row">
      <button id="btn-pedal-gas" class="btn-touch gas">⚡ GAS</button>
      <button id="btn-pedal-brake" class="btn-touch brake">🛑 STOP</button>
      <button id="btn-jump" class="btn-touch jump" onclick="triggerJump()">JUMP</button>
    </div>
  </div>

  <!-- Live Chat -->
  <div id="chat-box">
    <div class="chat-tabs">
      <div id="tab-global" class="chat-tab active" onclick="switchChatTab('global')">Server</div>
      <div id="tab-private" class="chat-tab" onclick="switchChatTab('private')">Private</div>
    </div>
    <div id="chat-msgs"><div class="chat-bubble"><b>System:</b> Connected to GTA Island!</div></div>
    <div class="chat-controls">
      <input type="text" id="chat-in" placeholder="Say something..." maxlength="45">
      <button id="chat-send" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <!-- Master Settings (11 Languages) -->
  <div id="master-settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⚙️ Settings & 11 Languages</h3>
      <input type="text" id="upd-player-name" class="btn-action" style="text-align:left; background:#000;" placeholder="Player Name">
      <div class="grid-btns">
        <button class="btn-action" onclick="applyGenderSelect('man')">👦 Boy</button>
        <button class="btn-action" onclick="applyGenderSelect('girl')">👧 Girl</button>
      </div>
      <input type="text" id="upd-room-name" class="btn-action" style="text-align:left; background:#000;" placeholder="Enter Room Code">
      <div class="grid-btns">
        <button class="btn-action primary" onclick="execJoinCustomRoom()">Join Room</button>
        <button class="btn-action" onclick="execJoinGlobalServer()">Global</button>
      </div>
      <div class="grid-btns" style="grid-template-columns: 1fr 1fr 1fr; gap:4px; margin-top:6px;">
        <button class="btn-action" onclick="setLanguage('en')">English</button>
        <button class="btn-action" onclick="setLanguage('ml')">മലയാളം</button>
        <button class="btn-action" onclick="setLanguage('hi')">हिन्दी</button>
        <button class="btn-action" onclick="setLanguage('fa')">فارسی</button>
        <button class="btn-action" onclick="setLanguage('id')">Indo</button>
        <button class="btn-action" onclick="setLanguage('ru')">Русский</button>
        <button class="btn-action" onclick="setLanguage('it')">Italiano</button>
        <button class="btn-action" onclick="setLanguage('uz')">O'zbek</button>
        <button class="btn-action" onclick="setLanguage('tg')">Тоҷикӣ</button>
        <button class="btn-action" onclick="setLanguage('my')">မြန်မာ</button>
        <button class="btn-action" onclick="setLanguage('zh')">中文</button>
      </div>
      <button class="btn-action primary" onclick="closeMasterSettings()">Save & Close</button>
    </div>
  </div>

  <!-- Stars Modal -->
  <div id="stars-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⭐ Telegram Stars Vault</h3>
      <div class="grid-btns">
        <button class="btn-action primary" onclick="buyStarsOfficial(50)">Buy 50 ⭐</button>
        <button class="btn-action primary" onclick="buyStarsOfficial(150)">Buy 150 ⭐</button>
        <button class="btn-action primary" onclick="buyStarsOfficial(500)">Buy 500 ⭐</button>
        <button class="btn-action" onclick="claimDailyReward()">Daily Gift (+25 ⭐)</button>
      </div>
      <button class="btn-action" onclick="closeModal('stars-modal')">Close</button>
    </div>
  </div>

  <!-- Friends Modal -->
  <div id="friends-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>🤝 Friends</h3>
      <div id="friends-list" style="font-size:11px; color:#94a3b8;">Walk near players to add friends!</div>
      <button class="btn-action primary" onclick="shareIslandInvite()">Share Room Link</button>
      <button class="btn-action" onclick="closeModal('friends-modal')">Close</button>
    </div>
  </div>

  <!-- Climate Modal -->
  <div id="weather-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⛅ Climate</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="applyWeather('sunny')">☀ Sunny</button>
        <button class="btn-action" onclick="applyWeather('sunset')">🌅 Sunset</button>
        <button class="btn-action" onclick="applyWeather('storm')">⛈️ Storm</button>
        <button class="btn-action" onclick="applyWeather('snow')">❄️ Snow</button>
        <button class="btn-action" onclick="applyWeather('night')">🌙 Night</button>
      </div>
      <button class="btn-action" onclick="closeModal('weather-modal')">Close</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; };
    window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; };

    const socket = io();
    let currentRoom = "Global";
    let myPlayerId = null;
    let playerName = "Player_" + Math.floor(Math.random() * 899 + 100);
    let penaltyGoals = 0;
    let starsCount = 350;
    let activeChatTab = 'global';
    let isDroneView = false;

    const dict = {
      en: { jump: "JUMP", kick: "⚽ PENALTY KICK", board: "DRIVE", exit: "🚪 EXIT", goals: "Goals", stars: "STARS", online: "Online", friends: "Friends" },
      ml: { jump: "ചാടുക", kick: "⚽ പെനാൽറ്റി കിക്ക്", board: "ഓടിക്കുക", exit: "🚪 പുറത്തിറങ്ങുക", goals: "ഗോളുകൾ", stars: "സ്റ്റാറുകൾ", online: "ഓൺലൈൻ", friends: "കൂട്ടുകാർ" },
      hi: { jump: "कूदें", kick: "⚽ पेनाल्टी", board: "चलाएं", exit: "🚪 बाहर निकलें", goals: "गोल", stars: "सितारे", online: "ऑनलाइन", friends: "मित्र" }
    };
    let currentLang = 'en';

    window.setLanguage = (lang) => {
      currentLang = lang;
      const t = dict[lang] || dict['en'];
      document.getElementById('hud-lang').innerText = lang.toUpperCase();
      document.getElementById('btn-jump').innerText = t.jump;
      closeMasterSettings();
    };

    window.openMasterSettings = () => {
      document.getElementById('upd-player-name').value = playerName;
      document.getElementById('master-settings-modal').style.display = 'flex';
    };
    window.closeMasterSettings = () => {
      const n = document.getElementById('upd-player-name').value.trim();
      if (n) { playerName = n; document.getElementById('hud-player').innerText = n; }
      document.getElementById('master-settings-modal').style.display = 'none';
    };

    window.execJoinCustomRoom = () => {
      const r = document.getElementById('upd-room-name').value.trim();
      if (r) {
        currentRoom = r;
        document.getElementById('hud-room').innerText = r;
        socket.emit('playerMoved', { room: currentRoom, x: localPlayer.position.x, y: localPlayer.position.y, z: localPlayer.position.z, rotY: localPlayer.rotation.y });
      }
      closeMasterSettings();
    };
    window.execJoinGlobalServer = () => {
      currentRoom = "Global";
      document.getElementById('hud-room').innerText = "Global";
      socket.emit('playerMoved', { room: "Global", x: localPlayer.position.x, y: localPlayer.position.y, z: localPlayer.position.z, rotY: localPlayer.rotation.y });
      closeMasterSettings();
    };

    window.shareIslandInvite = () => {
      const url = window.location.href;
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
        window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent('Join my GTA Island room: ' + currentRoom)}`);
      } else { navigator.clipboard.writeText(url); alert("Link copied!"); }
    };

    window.buyStarsOfficial = (amt) => {
      starsCount += amt;
      document.getElementById('hud-stars').innerText = starsCount;
      alert(`⭐ Added ${amt} Stars!`);
      closeModal('stars-modal');
    };
    window.claimDailyReward = () => {
      starsCount += 25;
      document.getElementById('hud-stars').innerText = starsCount;
      alert("🎁 +25 Stars Claimed!");
      closeModal('stars-modal');
    };

    // Synthesizer Audio Engine
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
      if (actx.state === 'suspended') actx.resume();
      const now = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);

      if (type === 'kick') {
        osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'goal') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.15);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'engine') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(70, now); osc.frequency.linearRampToValueAtTime(110, now + 0.12);
        gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'roar') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(60, now); osc.frequency.linearRampToValueAtTime(35, now + 0.6);
        gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      }
    }

    // Three.js Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x38bdf8);
    scene.fog = new THREE.FogExp2(0x38bdf8, 0.002);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.65);
    scene.add(hemiLight);
    const sun = new THREE.DirectionalLight(0xfff5ea, 0.85);
    sun.position.set(60, 120, 50);
    scene.add(sun);

    // Deep Ocean Water
    const ocean = new THREE.Mesh(
      new THREE.PlaneGeometry(1400, 1400, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.88 })
    );
    ocean.rotation.x = -Math.PI / 2; ocean.position.y = -0.1; scene.add(ocean);

    // SOLID ELEVATED TERRAIN SYSTEM (Y = 4.2: NEVER SINKS)
    const islandBase = new THREE.Mesh(
      new THREE.CylinderGeometry(74, 78, 5, 48),
      new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 })
    );
    islandBase.position.set(0, 2.0, 0); scene.add(islandBase);

    const forestTerrain = new THREE.Mesh(new THREE.CircleGeometry(36, 32), new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9 }));
    forestTerrain.rotation.x = -Math.PI / 2; forestTerrain.position.set(-36, 4.22, 28); scene.add(forestTerrain);

    const snowTerrain = new THREE.Mesh(new THREE.CircleGeometry(32, 32), new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.95 }));
    snowTerrain.rotation.x = -Math.PI / 2; snowTerrain.position.set(34, 4.22, 30); scene.add(snowTerrain);

    const desertTerrain = new THREE.Mesh(new THREE.CircleGeometry(32, 32), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.9 }));
    desertTerrain.rotation.x = -Math.PI / 2; desertTerrain.position.set(-38, 4.22, -34); scene.add(desertTerrain);

    const turfFloor = new THREE.Mesh(new THREE.PlaneGeometry(28, 44), new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.5 }));
    turfFloor.rotation.x = -Math.PI / 2; turfFloor.position.set(0, 4.22, -46); scene.add(turfFloor);

    // Individual GLB Loader (Auto Surface Ground Clamp)
    const mixers = [];
    const gltfLoader = new THREE.GLTFLoader();
    function loadGLB(file, size, onLoad) {
      const handle = (gltf) => {
        const root = gltf.scene;
        const bbox = new THREE.Box3().setFromObject(root);
        const sz = new THREE.Vector3(); bbox.getSize(sz);
        const maxD = Math.max(sz.x, sz.y, sz.z);
        if (maxD > 0 && size) root.scale.setScalar(size / maxD);
        if (gltf.animations && gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(root);
          mixer.clipAction(gltf.animations[0]).play();
          mixers.push(mixer);
        }
        onLoad(root);
      };
      gltfLoader.load(file, handle, undefined, () => gltfLoader.load('/' + file, handle, undefined, () => {}));
    }

    const multiVehicles = {};
    function registerRig(name, obj, maxSeats, seatOffsets, isFlyer=false, isSeaOnly=false) {
      multiVehicles[name] = { name, object: obj, maxSeats, offsets: seatOffsets, passengers: [], isFlyer, isSeaOnly };

    window.applyGenderSelect = (gender) => {
      loadAvatar(gender);
      socket.emit('playerMoved', { room: currentRoom, x: localPlayer.position.x, y: localPlayer.position.y, z: localPlayer.position.z, rotY: localPlayer.rotation.y, gender });
    };

    // Mobile Driving & Touch Controls Engine
    let joyX = 0, joyZ = 0, camRotX = 0;
    let isGas = false, isBrake = false, isSprint = false;
    let steerBtnX = 0;

    const jBase = document.getElementById('joy-base');
    const jStick = document.getElementById('joy-stick');
    jBase.addEventListener('touchmove', e => {
      e.preventDefault();
      const b = jBase.getBoundingClientRect();
      let dx = e.touches[0].clientX - b.left - 50;
      let dy = e.touches[0].clientY - b.top - 50;
      const d = Math.hypot(dx, dy);
      const maxR = 38;
      if (d > maxR) { dx = (dx / d) * maxR; dy = (dy / d) * maxR; }
      jStick.style.left = `${50 + dx - 18}px`;
      jStick.style.top = `${50 + dy - 18}px`;
      joyX = dx / maxR; joyZ = dy / maxR;
    }, { passive: false });
    jBase.addEventListener('touchend', () => { jStick.style.left = '32px'; jStick.style.top = '32px'; joyX = 0; joyZ = 0; });

    // Mobile Pedals and Steering Touch Handlers
    const btnGas = document.getElementById('btn-pedal-gas');
    const btnBrake = document.getElementById('btn-pedal-brake');
    const btnSprint = document.getElementById('btn-sprint');
    const btnSteerLeft = document.getElementById('btn-steer-left');
    const btnSteerRight = document.getElementById('btn-steer-right');

    btnGas.addEventListener('touchstart', e => { e.preventDefault(); isGas = true; });
    btnGas.addEventListener('touchend', () => isGas = false);
    btnBrake.addEventListener('touchstart', e => { e.preventDefault(); isBrake = true; });
    btnBrake.addEventListener('touchend', () => isBrake = false);
    btnSprint.addEventListener('touchstart', e => { e.preventDefault(); isSprint = true; });
    btnSprint.addEventListener('touchend', () => isSprint = false);

    btnSteerLeft.addEventListener('touchstart', e => { e.preventDefault(); steerBtnX = -1; });
    btnSteerLeft.addEventListener('touchend', () => steerBtnX = 0);
    btnSteerRight.addEventListener('touchstart', e => { e.preventDefault(); steerBtnX = 1; });
    btnSteerRight.addEventListener('touchend', () => steerBtnX = 0);

    let isDrag = false, touchX = 0;
    window.addEventListener('touchstart', e => {
      if (e.target.closest('#joy-base') || e.target.closest('button') || e.target.closest('#chat-box') || e.target.closest('.modal-card')) return;
      isDrag = true; touchX = e.touches[0].clientX;
    });
    window.addEventListener('touchmove', e => {
      if (!isDrag) return;
      camRotX -= (e.touches[0].clientX - touchX) * 0.005;
      touchX = e.touches[0].clientX;
    });
    window.addEventListener('touchend', () => isDrag = false);

    window.triggerJump = () => { if (localPlayer.position.y <= 4.5) localPlayer.position.y = 5.9; };
    window.toggleDroneView = () => {
      isDroneView = !isDroneView;
      document.getElementById('drone-view-btn').innerText = isDroneView ? "⬇️" : "⬆️";
    };

    // Interaction Checks & Boarding
    const actBtn = document.getElementById('action-btn');
    let currentActiveSeat = null;

    function checkInteractions() {
      if (currentActiveSeat) { actBtn.style.display = 'none'; return; }
      const p = localPlayer.position;

      if (p.distanceTo(fBall.position) < 2.5) {
        actBtn.innerText = "⚽ PENALTY KICK"; actBtn.style.display = 'block';
        actBtn.onclick = () => {
          playSfx('kick');
          fBall.position.set(0, 5.8, -60);
          setTimeout(() => {
            playSfx('goal');
            penaltyGoals++; starsCount += 10;
            document.getElementById('score-goals').innerText = penaltyGoals;
            document.getElementById('hud-stars').innerText = starsCount;
            fBall.position.set(0, 4.5, -48);
          }, 450);
        };
        return;
      }

      for (let key in multiVehicles) {
        const v = multiVehicles[key];
        const worldPos = new THREE.Vector3(); v.object.getWorldPosition(worldPos);
        if (p.distanceTo(worldPos) < (key === 'cruise' ? 25.0 : 6.0)) {
          actBtn.innerText = `🚗 DRIVE ${key.toUpperCase()}`;
          actBtn.style.display = 'block';
          actBtn.onclick = () => {
            currentActiveSeat = { rigKey: key };
            v.object.add(localAvatar);
            localAvatar.position.copy(v.offsets[0]);
            localAvatar.rotation.set(0, 0, 0);
            document.getElementById('speedo').style.display = 'block';
            document.getElementById('dismount-btn').style.display = 'block';
            btnGas.style.display = 'flex';
            btnBrake.style.display = 'flex';
          };
          return;
        }
      }
      actBtn.style.display = 'none';
    }

    window.exitSeatOrVehicle = () => {
      if (!currentActiveSeat) return;
      const v = multiVehicles[currentActiveSeat.rigKey];
      localPlayer.add(localAvatar);
      localAvatar.position.set(0, 0, 0);
      localAvatar.rotation.set(0, 0, 0);
      const worldPos = new THREE.Vector3(); v.object.getWorldPosition(worldPos);
      localPlayer.position.set(worldPos.x + 3.0, 4.3, worldPos.z);
      document.getElementById('speedo').style.display = 'none';
      document.getElementById('dismount-btn').style.display = 'none';
      btnGas.style.display = 'none';
      btnBrake.style.display = 'none';
      currentActiveSeat = null;
    };

    // Game Loop
    const clock = new THREE.Clock();
    let tram1T = 0, tram2T = 0, bulletT = 0, cableCarT = 0, cableCarDir = 1;

    function animate() {
      requestAnimationFrame(animate);
      checkInteractions();
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();
      mixers.forEach(m => m.update(delta));

      // Tram 1: Snow Loop
      tram1T += delta * 0.18;
      tram1Rig.position.x = 32 + Math.sin(tram1T) * 14;
      tram1Rig.position.z = 32 + Math.cos(tram1T) * 14;
      tram1Rig.rotation.y = tram1T + Math.PI / 2;

      // Tram 2: Desert Loop
      tram2T += delta * 0.18;
      tram2Rig.position.x = -38 + Math.sin(tram2T) * 14;
      tram2Rig.position.z = -34 + Math.cos(tram2T) * 14;
      tram2Rig.rotation.y = tram2T + Math.PI / 2;

      // Bullet Train: City Cross
      bulletT += delta * 0.35;
      bulletTrainRig.position.x = Math.sin(bulletT) * 35;
      bulletTrainRig.position.z = 0;
      bulletTrainRig.rotation.y = Math.cos(bulletT) > 0 ? Math.PI / 2 : -Math.PI / 2;

      // Plane Smooth Orbit
      planeEntity.rotation.y = time * 0.2;
      planeEntity.position.x = Math.sin(time * 0.2) * 55;
      planeEntity.position.z = Math.cos(time * 0.2) * 55;

      // Cable Car Loop
      cableCarT += delta * 0.08 * cableCarDir;
      if (cableCarT >= 1.0) { cableCarT = 1.0; cableCarDir = -1; }
      else if (cableCarT <= 0.0) { cableCarT = 0.0; cableCarDir = 1; }
      cableCarRig.position.copy(cableCurve.getPoint(cableCarT));

      // Character & Vehicles Control (Instant Stop & Steering)
      if (!currentActiveSeat) {
        localAvatar.rotation.x = 0;
        localAvatar.rotation.z = 0;

        const effectiveJoyX = joyX !== 0 ? joyX : steerBtnX;
        if (effectiveJoyX !== 0 || joyZ !== 0) {
          const moveSpeed = isSprint ? 0.65 : 0.35;
          const fx = effectiveJoyX * Math.cos(camRotX) + joyZ * Math.sin(camRotX);
          const fz = -effectiveJoyX * Math.sin(camRotX) + joyZ * Math.cos(camRotX);
          localPlayer.position.x += fx * moveSpeed;
          localPlayer.position.z += fz * moveSpeed;
          localPlayer.rotation.y = Math.atan2(fx, fz);

          const d = Math.hypot(localPlayer.position.x, localPlayer.position.z);
          if (d > 70) {
            localPlayer.position.x = (localPlayer.position.x / d) * 70;
            localPlayer.position.z = (localPlayer.position.z / d) * 70;
          }
          socket.emit('playerMoved', { room: currentRoom, x: localPlayer.position.x, y: localPlayer.position.y, z: localPlayer.position.z, rotY: localPlayer.rotation.y });
        }

        if (localPlayer.position.y > 4.3) localPlayer.position.y = Math.max(4.3, localPlayer.position.y - 0.15);
        else localPlayer.position.y = 4.3;

      } else {
        const v = multiVehicles[currentActiveSeat.rigKey];
        const obj = v.object;

        const effectiveJoyX = joyX !== 0 ? joyX : steerBtnX;
        let driveSpeed = 0;
        if (isGas) driveSpeed = 0.65;
        else if (isBrake) driveSpeed = -0.3;
        else if (joyZ !== 0) driveSpeed = -joyZ * 0.45;

        if (effectiveJoyX !== 0 || driveSpeed !== 0) {
          obj.rotation.y -= effectiveJoyX * 0.04;
          const nx = obj.position.x + Math.sin(obj.rotation.y) * driveSpeed;
          const nz = obj.position.z + Math.cos(obj.rotation.y) * driveSpeed;

          if (v.isSeaOnly) {
            if (Math.hypot(nx, nz) > 72) { obj.position.x = nx; obj.position.z = nz; }
          } else if (v.isFlyer) {
            obj.position.x = nx; obj.position.z = nz;
          } else {
            if (Math.hypot(nx, nz) < 68) { obj.position.x = nx; obj.position.z = nz; }
          }
          document.getElementById('speedo').innerText = `${Math.abs(Math.round(driveSpeed * 90))} KM/H`;
          playSfx('engine');
        } else {
          // Instant Braking
          document.getElementById('speedo').innerText = `0 KM/H`;
        }

        const worldPos = new THREE.Vector3(); obj.getWorldPosition(worldPos);
        localPlayer.position.copy(worldPos);
      }

      // Sky-View Camera Angle (Full view of sky & vehicles)
      if (isDroneView) {
        camera.position.set(0, 120, 90);
        camera.lookAt(0, 0, 0);
      } else {
        const target = (currentActiveSeat && currentActiveSeat.rigKey) ? multiVehicles[currentActiveSeat.rigKey].object : localPlayer;
        const targetPos = new THREE.Vector3(); target.getWorldPosition(targetPos);
        camera.position.x = targetPos.x + Math.sin(camRotX) * 11;
        camera.position.y = targetPos.y + 2.8;
        camera.position.z = targetPos.z + Math.cos(camRotX) * 11;
        camera.lookAt(targetPos.x, targetPos.y + 3.2, targetPos.z);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
