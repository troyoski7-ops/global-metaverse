<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe Realistic Metaverse</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: system-ui, -apple-system, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    .top-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 30; }
    .top-row-1 { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .pill-group { display: flex; gap: 6px; align-items: center; }
    .badge { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); display: flex; gap: 5px; align-items: center; }
    .badge.owner { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: 900; }
    .badge.stars { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; font-weight: 900; cursor: pointer; border: 1px solid #fef08a; }

    .tools-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .tool-btn { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.25); padding: 7px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .tool-btn:active { background: #0284c7; color: #fff; }

    #menu-toggle-btn { width: 38px; height: 38px; border-radius: 10px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.25); color: #38bdf8; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #drawer-menu { position: absolute; top: 85px; right: 8px; width: 230px; background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(15px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); padding: 10px; display: none; flex-direction: column; gap: 7px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); max-height: 65vh; overflow-y: auto; z-index: 50; }
    .menu-item { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); color: #e2e8f0; padding: 10px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; text-align: left; display: flex; align-items: center; gap: 8px; cursor: pointer; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 99999; align-items: center; justify-content: center; }
    .modal-box { background: #0f172a; border: 1.5px solid rgba(255,255,255,0.25); border-radius: 20px; width: 330px; max-width: 92%; padding: 18px; color: #fff; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.9); }

    #chat-container { position: absolute; bottom: 20px; left: 145px; width: 250px; max-width: calc(100vw - 230px); background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 14px; padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 20; }
    #chat-messages { height: 55px; overflow-y: auto; font-size: 11px; color: #fff; display: flex; flex-direction: column; gap: 3px; }
    .chat-msg { background: rgba(255,255,255,0.08); padding: 3px 6px; border-radius: 6px; word-break: break-word; }
    .chat-msg b { color: #38bdf8; }
    .chat-input-row { display: flex; gap: 4px; }
    #chat-input { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; padding: 4px 8px; font-size: 11px; outline: none; }
    #chat-send { background: #0284c7; color: #fff; border: none; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

    #action-btn { position: absolute; bottom: 125px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: 2px solid #fff; padding: 12px 26px; border-radius: 30px; font-size: 13px; font-weight: 900; display: none; box-shadow: 0 0 25px rgba(37,99,235,0.8); cursor: pointer; z-index: 25; }
    #dismount-btn { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border: 1px solid #fecaca; padding: 8px 20px; border-radius: 20px; font-size: 12px; font-weight: 800; display: none; cursor: pointer; z-index: 40; }
    #speedo { position: absolute; bottom: 125px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.5); padding: 6px 20px; border-radius: 20px; font-size: 15px; font-weight: 900; display: none; z-index: 25; }

    #jump-btn { position: absolute; bottom: 35px; right: 20px; width: 65px; height: 65px; border-radius: 50%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 2px solid rgba(255,255,255,0.3); color: #fff; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 25; }

    .vehicle-pedals { position: absolute; bottom: 25px; right: 20px; display: none; flex-direction: column; gap: 12px; z-index: 25; }
    .pedal-btn { width: 68px; height: 55px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.4); font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
    #gas-pedal { background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 4px 15px rgba(34,197,94,0.4); }
    #brake-pedal { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(239,68,68,0.4); }

    #joystick-base { position: absolute; left: 20px; bottom: 25px; width: 105px; height: 105px; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(6px); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); touch-action: none; z-index: 25; }
    #joystick-stick { position: absolute; left: 32px; top: 32px; width: 40px; height: 40px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 15px rgba(56, 189, 248, 0.8); pointer-events: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 10 Languages Modal -->
  <div id="lang-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>🌐 Select Language</h3>
        <span onclick="closeModal('lang-modal')" style="cursor:pointer; font-size:20px; padding:5px;">✕</span>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <button class="tool-btn" onclick="setLanguage('en')">English 🇺🇸</button>
        <button class="tool-btn" onclick="setLanguage('ml')">മലയാളം 🇮🇳</button>
        <button class="tool-btn" onclick="setLanguage('hi')">हिन्दी 🇮🇳</button>
        <button class="tool-btn" onclick="setLanguage('uz')">O‘zbek 🇺🇿</button>
        <button class="tool-btn" onclick="setLanguage('tg')">Тоҷикӣ 🇹🇯</button>
        <button class="tool-btn" onclick="setLanguage('fa')">فارسی 🇮🇷</button>
        <button class="tool-btn" onclick="setLanguage('ru')">Русский 🇷🇺</button>
        <button class="tool-btn" onclick="setLanguage('id')">Indonesia 🇮🇩</button>
        <button class="tool-btn" onclick="setLanguage('it')">Italiano 🇮🇹</button>
        <button class="tool-btn" onclick="setLanguage('my')">မြန်မာ 🇲🇲</button>
      </div>
    </div>
  </div>

  <!-- 10 Servers Modal -->
  <div id="server-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>⚡ Select Server Region</h3>
        <span onclick="closeModal('server-modal')" style="cursor:pointer; font-size:20px; padding:5px;">✕</span>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; max-height:240px; overflow-y:auto;">
        <button class="tool-btn" onclick="selectServer('Kerala, India')">🌴 Kerala, India</button>
        <button class="tool-btn" onclick="selectServer('India Central')">🇮🇳 India Central</button>
        <button class="tool-btn" onclick="selectServer('Uzbekistan')">🇺🇿 Uzbekistan</button>
        <button class="tool-btn" onclick="selectServer('Tajikistan')">🇹🇯 Tajikistan</button>
        <button class="tool-btn" onclick="selectServer('Iran')">🇮🇷 Iran</button>
        <button class="tool-btn" onclick="selectServer('Russia')">🇷🇺 Russia</button>
        <button class="tool-btn" onclick="selectServer('Indonesia')">🇮🇩 Indonesia</button>
        <button class="tool-btn" onclick="selectServer('Italy')">🇮🇹 Italy</button>
        <button class="tool-btn" onclick="selectServer('China')">🇨🇳 China</button>
        <button class="tool-btn" onclick="selectServer('Myanmar')">🇲🇲 Myanmar</button>
      </div>
    </div>
  </div>

  <!-- Weather Modal -->
  <div id="weather-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>🌤 Weather & Atmosphere</h3>
        <span onclick="closeModal('weather-modal')" style="cursor:pointer; font-size:20px; padding:5px;">✕</span>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <button class="tool-btn" onclick="setSky('sunny')">☀️ Sunny Day</button>
        <button class="tool-btn" onclick="setSky('sunset')">🌅 Sunset</button>
        <button class="tool-btn" onclick="setSky('night')">🌙 Night</button>
        <button class="tool-btn" onclick="setSky('rain')">🌧 Thunder Rain</button>
        <button class="tool-btn" onclick="setSky('fog')">🌫 Foggy</button>
      </div>
    </div>
  </div>

  <!-- Stars Modal -->
  <div id="stars-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>⭐ Telegram Stars VIP</h3>
        <span onclick="closeModal('stars-modal')" style="cursor:pointer; font-size:20px; padding:5px;">✕</span>
      </div>
      <p style="font-size:11px; color:#cbd5e1;">Get Nitro Speed Cars, Giant T-Rex Mounts & VIP Golden Glow!</p>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <button class="tool-btn" onclick="buyStars(50, 'VIP Pass')">⭐ 50 Stars — VIP Rank</button>
        <button class="tool-btn" onclick="buyStars(250, 'Monster Pack')">⭐ 250 Stars — Dino & Car Pack</button>
        <button class="tool-btn" onclick="buyStars(500, 'Metaverse God')">⭐ 500 Stars — All Mounts Unlocked</button>
      </div>
    </div>
  </div>

  <!-- Profile & Social Modal -->
  <div id="profile-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>👤 Profile & Avatar</h3>
        <span onclick="closeModal('profile-modal')" style="cursor:pointer; font-size:20px; padding:5px;">✕</span>
      </div>
      
      <div style="display:flex; gap:8px;">
        <button onclick="selectGender('boy')" id="gender-boy" style="flex:1; padding:9px; border-radius:10px; background:#0284c7; color:#fff; border:none; font-weight:bold; cursor:pointer;">Boy 👦</button>
        <button onclick="selectGender('girl')" id="gender-girl" style="flex:1; padding:9px; border-radius:10px; background:rgba(255,255,255,0.1); color:#fff; border:none; font-weight:bold; cursor:pointer;">Girl 👧</button>
      </div>

      <input type="text" id="tg-id-input" placeholder="Telegram @username" style="background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.2); padding:9px 12px; border-radius:8px; color:#fff; font-size:12px; outline:none;">
      <input type="text" id="insta-id-input" placeholder="Instagram @username" style="background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.2); padding:9px 12px; border-radius:8px; color:#fff; font-size:12px; outline:none;">

      <div style="font-size:11px; color:#94a3b8; font-weight:bold;">Share Metaverse Link:</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <button onclick="shareToTelegram()" style="background:#229ED9; color:#fff; border:none; padding:8px; border-radius:8px; font-size:11px; font-weight:bold; cursor:pointer;">✈️ Telegram</button>
        <button onclick="shareToWhatsApp()" style="background:#25D366; color:#fff; border:none; padding:8px; border-radius:8px; font-size:11px; font-weight:bold; cursor:pointer;">💬 WhatsApp</button>
        <button onclick="shareToInstagram()" style="background:linear-gradient(45deg, #f09433, #dc2743); color:#fff; border:none; padding:8px; border-radius:8px; font-size:11px; font-weight:bold; cursor:pointer;">📸 Instagram</button>
        <button onclick="copyInviteLink()" style="background:#334155; color:#fff; border:none; padding:8px; border-radius:8px; font-size:11px; font-weight:bold; cursor:pointer;">🔗 Copy Link</button>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div class="top-bar">
    <div class="top-row-1">
      <div class="pill-group">
        <div class="badge owner">👑 OWNER</div>
        <div class="badge stars" onclick="openModal('stars-modal')">⭐ <span id="pts">100</span> STARS</div>
      </div>
      <div class="comm-btns">
        <button id="menu-toggle-btn" onclick="toggleMenu()">☰</button>
      </div>
    </div>

    <div class="tools-bar">
      <button id="btn-lang" class="tool-btn" onclick="openModal('lang-modal')">🌐 10 Lang</button>
      <button id="btn-weather" class="tool-btn" onclick="openModal('weather-modal')">🌤 Weather</button>
      <button id="btn-server" class="tool-btn" onclick="openModal('server-modal')">⚡ Server: Kerala</button>
      <button id="btn-profile" class="tool-btn" onclick="openModal('profile-modal')">👤 Profile</button>
    </div>
  </div>

  <div id="drawer-menu">
    <button class="menu-item" onclick="teleportTo(0, 2, 0)">🏝️️ Beach Island Spawn</button>
    <button class="menu-item" onclick="teleportTo(0, 2, 230)">🏎 Grand Car Track</button>
    <button class="menu-item" onclick="teleportTo(0, -0.5, 460)">🚤 Speed Boat Pier</button>
    <button class="menu-item" onclick="teleportTo(80, 2, 80)">🦕 Dino Valley (T-Rex)</button>
    <button class="menu-item" onclick="teleportTo(240, 2, -220)">🦖 Godzilla Arena</button>
  </div>

  <div id="chat-container">
    <div id="chat-messages">
      <div class="chat-msg"><b>System:</b> Connected to Kerala Cloud Node!</div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Type message..." maxlength="80">
      <button id="chat-send" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <div id="speedo">0 KM/H</div>
  <button id="dismount-btn" onclick="dismountAll()">🚪 Dismount</button>
  <button id="action-btn" onclick="executeContextAction()">ACTION</button>
  
  <button id="jump-btn" onclick="playerJump()">JUMP</button>

  <div id="vehicle-pedals" class="vehicle-pedals">
    <button id="gas-pedal" class="pedal-btn">🏎 GAS</button>
    <button id="brake-pedal" class="pedal-btn">🛑 BRAKE</button>
  </div>

  <div id="joystick-base">
    <div id="joystick-stick"></div>
  </div>

  <script>
    const socket = io();
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const playerName = tg?.initDataUnsafe?.user?.first_name || "GOKUL";
    const GAME_URL = window.location.href;

    const dict = {
      en: { jump: "JUMP", drive: "🏎️ DRIVE CAR", weather: "🌤 Weather", server: "⚡ Server", profile: "👤 Profile", lang: "🌐 Lang", dismount: "🚪 Dismount" },
      ml: { jump: "ചാടുക", drive: "🏎️ കാർ ഓടിക്കുക", weather: "🌤 കാലാവസ്ഥ", server: "⚡ സെർവർ", profile: "👤 പ്രൊഫൈൽ", lang: "🌐 ഭാഷ", dismount: "🚪 ഇറങ്ങുക" },
      hi: { jump: "कूदो", drive: "🏎️ कार चलाओ", weather: "🌤 मौसम", server: "⚡ सर्वर", profile: "👤 प्रोफ़ाइल", lang: "🌐 भाषा", dismount: "🚪 उतरें" },
      uz: { jump: "SAKRASH", drive: "🏎️ HAYDASH", weather: "🌤 Ob-havo", server: "⚡ Server", profile: "👤 Profil", lang: "🌐 Til", dismount: "🚪 Tushish" },
      tg: { jump: "ХЕЗЕД", drive: "🏎️ РОНЕД", weather: "🌤 Обу ҳаво", server: "⚡ Сервер", profile: "👤 Профил", lang: "🌐 Забон", dismount: "🚪 Фаромадан" },
      fa: { jump: "پرش", drive: "🏎️ رانندگی", weather: "🌤 آب و هوا", server: "⚡ سرور", profile: "👤 پروفایل", lang: "🌐 زبان", dismount: "🚪 پیاده شدن" },
      ru: { jump: "ПРЫЖОК", drive: "🏎️ ВОДИТЬ", weather: "🌤 Погода", server: "⚡ Сервер", profile: "👤 Профиль", lang: "🌐 Язык", dismount: "🚪 Выйти" },
      id: { jump: "LOMPAT", drive: "🏎️ MENGEMUDI", weather: "🌤 Cuaca", server: "⚡ Server", profile: "👤 Profil", lang: "🌐 Bahasa", dismount: "🚪 Turun" },
      it: { jump: "SALTO", drive: "🏎️ GUIDA", weather: "🌤 Meteo", server: "⚡ Server", profile: "👤 Profilo", lang: "🌐 Lingua", dismount: "🚪 Smonta" },
      my: { jump: "ခုန်ပါ", drive: "🏎️ မောင်းပါ", weather: "🌤 ရာသီဥတု", server: "⚡ ဆာဗာ", profile: "👤 ပရိုဖိုင်", lang: "🌐 ဘာသာစကား", dismount: "🚪 ဆင်းပါ" }
    };

    let curLang = 'en';
    window.setLanguage = (code) => {
      curLang = code;
      const t = dict[code] || dict.en;
      document.getElementById('jump-btn').innerText = t.jump;
      document.getElementById('btn-weather').innerText = t.weather;
      document.getElementById('btn-profile').innerText = t.profile;
      document.getElementById('btn-lang').innerText = t.lang;
      document.getElementById('dismount-btn').innerText = t.dismount;
      closeModal('lang-modal');
    };

    window.openModal = (id) => {
      document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
      const el = document.getElementById(id);
      if (el) el.style.display = 'flex';
    };
    window.closeModal = (id) => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    };

    window.selectServer = (name) => {
      document.getElementById('btn-server').innerText = `⚡ ${name.split(',')[0]}`;
      closeModal('server-modal');
    };

    window.buyStars = (amount, desc) => {
      alert(`⭐ Telegram Stars: ${amount} Stars requested for ${desc}`);
      closeModal('stars-modal');
    };

    window.shareToTelegram = () => window.open(`https://t.me/share/url?url=${encodeURIComponent(GAME_URL)}&text=${encodeURIComponent("Join my GlobeVibe 3D World! 🚀")}`, '_blank');
    window.shareToWhatsApp = () => window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent("GlobeVibe 3D Metaverse: " + GAME_URL)}`, '_blank');
    window.shareToInstagram = () => { navigator.clipboard.writeText(GAME_URL); alert("Link copied for Instagram Story / DM 📸"); };
    window.copyInviteLink = () => { navigator.clipboard.writeText(GAME_URL); alert("Invite Link copied! 🔗"); };

    // --- 3D Scene Initialization ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7ec8e3);
    scene.fog = new THREE.FogExp2(0x7ec8e3, 0.0006);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 10000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334455, 1.3);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfffaed, 2.2);
    sun.position.set(300, 500, 200);
    sun.castShadow = true;
    scene.add(sun);

    window.setSky = (mode) => {
      if (mode === 'sunny') { scene.background.setHex(0x7ec8e3); scene.fog.color.setHex(0x7ec8e3); sun.intensity = 2.2; }
      else if (mode === 'sunset') { scene.background.setHex(0xf97316); scene.fog.color.setHex(0xf97316); sun.intensity = 1.3; }
      else if (mode === 'night') { scene.background.setHex(0x020617); scene.fog.color.setHex(0x020617); sun.intensity = 0.2; }
      else if (mode === 'rain') { scene.background.setHex(0x475569); scene.fog.color.setHex(0x475569); sun.intensity = 0.6; }
      else if (mode === 'fog') { scene.background.setHex(0x94a3b8); scene.fog.density = 0.003; }
      closeModal('weather-modal');
    };

    // Realistic Ocean
    const ocean = new THREE.Mesh(
      new THREE.PlaneGeometry(16000, 16000),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.8 })
    );
    ocean.rotation.x = -Math.PI / 2; ocean.position.y = -0.8; scene.add(ocean);

    // Natural Dual-layer Island (Sand Beach + Lush Grass)
    const sandBeach = new THREE.Mesh(
      new THREE.CylinderGeometry(520, 560, 6, 64),
      new THREE.MeshStandardMaterial({ color: 0xe0c088, roughness: 0.9 })
    );
    sandBeach.position.y = -2; scene.add(sandBeach);

    const lushGrass = new THREE.Mesh(
      new THREE.CylinderGeometry(460, 490, 8, 64),
      new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.85 })
    );
    lushGrass.position.y = 0; scene.add(lushGrass);

    // Dynamic Multi-path GLB/ZIP Loader
    const gltfLoader = new THREE.GLTFLoader();

    function smartLoadModel(paths, onLoad, onFail) {
      const tryPath = (i) => {
        if (i >= paths.length) { if (onFail) onFail(); return; }
        const p = paths[i];
        if (p.endsWith('.zip')) {
          fetch(p).then(r => r.blob()).then(JSZip.loadAsync).then(zip => {
            let found = null;
            zip.forEach(rel => { if (rel.endsWith('.glb') || rel.endsWith('.gltf')) found = rel; });
            if (found) {
              return zip.file(found).async('arraybuffer').then(buf => {
                gltfLoader.parse(buf, '', g => onLoad(g.scene));
              });
            } else tryPath(i + 1);
          }).catch(() => tryPath(i + 1));
        } else {
          gltfLoader.load(p, g => onLoad(g.scene), undefined, () => tryPath(i + 1));
        }
      };
      tryPath(0);
    }

    // Load Island Models
    smartLoadModel(['water-island.glb', '/water-island.glb', 'water.glb', '/water.glb'], (m) => {
      m.scale.set(6, 6, 6); m.position.y = -1; scene.add(m);
    });

    // Player Mesh & Avatars
    let myPlayer = new THREE.Group(); scene.add(myPlayer);
    let playerAvatar = new THREE.Group(); myPlayer.add(playerAvatar);

    function createProceduralAvatar(isGirl = false) {
      while (playerAvatar.children.length > 0) playerAvatar.remove(playerAvatar.children[0]);
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd1b3 });
      const clothMat = new THREE.MeshStandardMaterial({ color: isGirl ? 0xdb2777 : 0x1e293b });
      const hairMat = new THREE.MeshStandardMaterial({ color: isGirl ? 0xd97706 : 0x1f2937 });

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), skinMat);
      head.position.y = 2.8; playerAvatar.add(head);

      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.48, 16, 16), hairMat);
      hair.position.set(0, 2.9, -0.05); hair.scale.set(1, isGirl ? 1.3 : 0.8, 1);
      playerAvatar.add(hair);

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.2, 16), clothMat);
      torso.position.y = 1.9; playerAvatar.add(torso);

      const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.3, 1.3, 16), new THREE.MeshStandardMaterial({ color: isGirl ? 0x0284c7 : 0x0f172a }));
      legs.position.y = 0.65; playerAvatar.add(legs);
    }

    function setAvatarModel(isGirl) {
      const paths = isGirl 
        ? ['suit.glb', '/suit.glb', 'model.glb', '/model.glb'] 
        : ['man.glb', '/man.glb'];

      smartLoadModel(paths, (m) => {
        while (playerAvatar.children.length > 0) playerAvatar.remove(playerAvatar.children[0]);
        m.scale.set(1.9, 1.9, 1.9); playerAvatar.add(m);
      }, () => {
        createProceduralAvatar(isGirl);
      });
    }
    setAvatarModel(false);

    window.selectGender = (gender) => {
      document.getElementById('gender-boy').style.background = gender === 'boy' ? '#0284c7' : 'rgba(255,255,255,0.1)';
      document.getElementById('gender-girl').style.background = gender === 'girl' ? '#ec4899' : 'rgba(255,255,255,0.1)';
      setAvatarModel(gender === 'girl');
      closeModal('profile-modal');
    };

    // Sports Car Entity
    const carEntity = new THREE.Group(); carEntity.position.set(0, 0, 230); scene.add(carEntity);
    smartLoadModel(['race.glb', '/race.glb', 'car.zip', '/car.zip'], (m) => {
      m.scale.set(1.5, 1.5, 1.5); carEntity.add(m);
    }, () => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.0, 5.0), new THREE.MeshStandardMaterial({ color: 0xd90429, metalness: 0.8 }));
      b.position.y = 0.8; carEntity.add(b);
    });

    // Giant T-Rex Mount Entity
    const dinoEntity = new THREE.Group(); dinoEntity.position.set(80, 0, 80); scene.add(dinoEntity);
    smartLoadModel(['Trex.glb', '/Trex.glb', 'Stegosaurus.glb', '/Stegosaurus.glb'], (m) => {
      m.scale.set(4.5, 4.5, 4.5); dinoEntity.add(m);
    }, () => {
      const d = new THREE.Mesh(new THREE.DodecahedronGeometry(3.5), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
      d.position.y = 4.5; dinoEntity.add(d);
    });

    // Controls Logic
    let activeMount = 'walk';
    let vSpeed = 0;
    let isGasPressed = false, isBrakePressed = false;
    let moveX = 0, moveZ = 0;
    let camAngleX = 0, camAngleY = 0.25;

    const gasPedal = document.getElementById('gas-pedal');
    const brakePedal = document.getElementById('brake-pedal');

    gasPedal.addEventListener('touchstart', (e) => { e.preventDefault(); isGasPressed = true; });
    gasPedal.addEventListener('touchend', () => { isGasPressed = false; });
    brakePedal.addEventListener('touchstart', (e) => { e.preventDefault(); isBrakePressed = true; });
    brakePedal.addEventListener('touchend', () => { isBrakePressed = false; });

    const jBase = document.getElementById('joystick-base');
    const jStick = document.getElementById('joystick-stick');
    const jCenter = { x: 52, y: 52 };

    function handleJoy(cx, cy) {
      const b = jBase.getBoundingClientRect();
      let dx = cx - b.left - jCenter.x;
      let dy = cy - b.top - jCenter.y;
      const dist = Math.hypot(dx, dy);
      const maxR = 34;
      if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
      jStick.style.left = `${jCenter.x + dx - 20}px`;
      jStick.style.top = `${jCenter.y + dy - 20}px`;
      moveX = dx / maxR;
      moveZ = dy / maxR;
    }

    jBase.addEventListener('touchstart', (e) => { e.preventDefault(); handleJoy(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    jBase.addEventListener('touchmove', (e) => { e.preventDefault(); handleJoy(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    const resetJoy = () => { jStick.style.left = '32px'; jStick.style.top = '32px'; moveX = 0; moveZ = 0; };
    jBase.addEventListener('touchend', resetJoy);
    jBase.addEventListener('touchcancel', resetJoy);

    let isDrag = false, px = 0, py = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#joystick-base') || e.target.closest('.tool-btn') || e.target.closest('.badge') || e.target.closest('#chat-container')) return;
      isDrag = true; px = e.touches[0].clientX; py = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', (e) => {
      if (!isDrag) return;
      camAngleX -= (e.touches[0].clientX - px) * 0.006;
      camAngleY += (e.touches[0].clientY - py) * 0.005;
      camAngleY = Math.max(-0.35, Math.min(1.1, camAngleY));
      px = e.touches[0].clientX; py = e.touches[0].clientY;
    });
    window.addEventListener('touchend', () => { isDrag = false; });

    const actBtn = document.getElementById('action-btn');
    const dismountBtn = document.getElementById('dismount-btn');
    const jumpBtn = document.getElementById('jump-btn');
    const vehiclePedals = document.getElementById('vehicle-pedals');
    const speedo = document.getElementById('speedo');
    let nearbyAction = null;

    function checkInteractions() {
      const p = myPlayer.position;
      if (activeMount === 'walk') {
        if (p.distanceTo(carEntity.position) < 6) {
          nearbyAction = 'mount_car'; actBtn.innerText = dict[curLang].drive; actBtn.style.display = 'block'; return;
        }
        if (p.distanceTo(dinoEntity.position) < 8) {
          nearbyAction = 'mount_dino'; actBtn.innerText = "🦕 SADDLE RIDE T-REX"; actBtn.style.display = 'block'; return;
        }
      }
      nearbyAction = null; actBtn.style.display = 'none';
    }

    window.executeContextAction = () => {
      if (!nearbyAction) return;
      if (nearbyAction === 'mount_car') {
        activeMount = 'car';
        playerAvatar.visible = false;
        jumpBtn.style.display = 'none';
        vehiclePedals.style.display = 'flex';
      } else if (nearbyAction === 'mount_dino') {
        activeMount = 'dino';
        jumpBtn.style.display = 'none';
        vehiclePedals.style.display = 'flex';
      }
      dismountBtn.style.display = 'block';
      speedo.style.display = 'block';
    };

    window.dismountAll = () => {
      playerAvatar.visible = true;
      if (activeMount === 'car') myPlayer.position.set(carEntity.position.x + 3, 0, carEntity.position.z);
      if (activeMount === 'dino') myPlayer.position.set(dinoEntity.position.x + 4, 0, dinoEntity.position.z);
      activeMount = 'walk';
      vSpeed = 0;
      dismountBtn.style.display = 'none';
      speedo.style.display = 'none';
      vehiclePedals.style.display = 'none';
      jumpBtn.style.display = 'flex';
    };

    window.teleportTo = (x, y, z) => {
      dismountAll(); myPlayer.position.set(x, y, z);
      document.getElementById('drawer-menu').style.display = 'none';
    };

    let isJumping = false, jumpVel = 0;
    window.playerJump = () => {
      if (activeMount === 'walk' && !isJumping) { isJumping = true; jumpVel = 0.42; }
    };

    window.toggleMenu = () => {
      const m = document.getElementById('drawer-menu');
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    };

    function sendChatMessage() {
      const inp = document.getElementById('chat-input');
      const text = inp.value.trim();
      if (!text) return;
      socket.emit('chatMessage', { user: playerName, text: text });
      inp.value = '';
    }

    socket.on('chatMessage', (data) => {
      const box = document.getElementById('chat-messages');
      const msg = document.createElement('div');
      msg.className = 'chat-msg';
      msg.innerHTML = `<b>${data.user}:</b> ${data.text}`;
      box.appendChild(msg); box.scrollTop = box.scrollHeight;
    });

    function animate() {
      requestAnimationFrame(animate);
      checkInteractions();

      if (activeMount === 'walk') {
        if (isJumping) {
          myPlayer.position.y += jumpVel; jumpVel -= 0.016;
          if (myPlayer.position.y <= 0) { myPlayer.position.y = 0; isJumping = false; }
        }

        const spd = 0.45;
        if (moveX !== 0 || moveZ !== 0) {
          const fx = moveX * Math.cos(camAngleX) + moveZ * Math.sin(camAngleX);
          const fz = -moveX * Math.sin(camAngleX) + moveZ * Math.cos(camAngleX);
          myPlayer.position.x += fx * spd;
          myPlayer.position.z += fz * spd;
          myPlayer.rotation.y = Math.atan2(fx, fz);
        }
      } else if (activeMount === 'car') {
        if (isGasPressed) vSpeed = Math.min(vSpeed + 0.05, 2.5);
        else if (isBrakePressed) vSpeed = Math.max(vSpeed - 0.07, -0.9);
        else vSpeed *= 0.96;

        carEntity.rotation.y -= moveX * 0.045 * (vSpeed >= 0 ? 1 : -1);
        carEntity.position.x += Math.sin(carEntity.rotation.y) * vSpeed;
        carEntity.position.z += Math.cos(carEntity.rotation.y) * vSpeed;

        myPlayer.position.copy(carEntity.position);
        speedo.innerText = `${Math.abs(Math.round(vSpeed * 75))} KM/H`;
      } else if (activeMount === 'dino') {
        if (isGasPressed) vSpeed = Math.min(vSpeed + 0.03, 1.2);
        else if (isBrakePressed) vSpeed = Math.max(vSpeed - 0.04, -0.4);
        else vSpeed *= 0.92;

        dinoEntity.rotation.y -= moveX * 0.035;
        dinoEntity.position.x += Math.sin(dinoEntity.rotation.y) * vSpeed;
        dinoEntity.position.z += Math.cos(dinoEntity.rotation.y) * vSpeed;

        myPlayer.position.copy(dinoEntity.position);
        myPlayer.position.y = dinoEntity.position.y + 6.2;
        myPlayer.rotation.y = dinoEntity.rotation.y;
        speedo.innerText = `${Math.abs(Math.round(vSpeed * 45))} KM/H`;
      }

      const curTarget = activeMount === 'walk' ? myPlayer.position : (activeMount === 'car' ? carEntity.position : dinoEntity.position);
      const dist = activeMount === 'walk' ? 14 : 26;
      camera.position.x = curTarget.x + Math.sin(camAngleX) * dist * Math.cos(camAngleY);
      camera.position.y = curTarget.y + 5.0 + Math.sin(camAngleY) * dist;
      camera.position.z = curTarget.z + Math.cos(camAngleX) * dist * Math.cos(camAngleY);
      camera.lookAt(curTarget.x, curTarget.y + 2.0, curTarget.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
