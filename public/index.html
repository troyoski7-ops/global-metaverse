<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe Ultra 3D Metaverse - Master Production Engine</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 40;
      pointer-events: none;
    }
    .top-row-1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }
    .pill-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .badge {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .badge.owner {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 900;
      border-color: #fef08a;
    }
    .badge.stars {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #000;
      font-weight: 900;
      cursor: pointer;
      border-color: #fef08a;
    }
    .badge.online {
      background: rgba(34, 197, 94, 0.25);
      border-color: #22c55e;
      color: #4ade80;
    }
    .comm-btns {
      display: flex;
      gap: 6px;
      align-items: center;
      pointer-events: auto;
    }
    .circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .circle-btn.active {
      background: #22c55e;
      border-color: #4ade80;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.7);
    }
    .tools-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      pointer-events: auto;
    }
    .tool-btn {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .tool-btn:active {
      background: #0284c7;
    }
    #menu-toggle-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #38bdf8;
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #drawer-menu {
      position: absolute;
      top: 95px;
      right: 10px;
      width: 240px;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      border: 1.5px solid #38bdf8;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 7px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.95);
      max-height: 65vh;
      overflow-y: auto;
      z-index: 1000;
    }
    .menu-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .menu-item:active {
      background: #0284c7;
    }
    #scoreboard-hud {
      position: absolute;
      top: 95px;
      left: 10px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(56, 189, 248, 0.5);
      border-radius: 14px;
      padding: 10px 14px;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      min-width: 150px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .score-val {
      color: #38bdf8;
      font-family: monospace;
      font-size: 12px;
    }
    #stamina-box {
      position: absolute;
      top: 240px;
      left: 10px;
      background: rgba(15, 23, 42, 0.92);
      border: 1.5px solid #eab308;
      border-radius: 12px;
      padding: 8px 12px;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: none;
      z-index: 30;
      width: 150px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    #stamina-bar {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      margin-top: 5px;
      overflow: hidden;
    }
    #stamina-fill {
      width: 100%;
      height: 100%;
      background: #22c55e;
      transition: width 0.1s linear;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #0f172a;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      width: 340px;
      max-width: 92%;
      padding: 20px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 45px rgba(0, 0, 0, 0.9);
    }
    .share-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }
    .share-btn {
      padding: 10px;
      border-radius: 12px;
      border: none;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-wa { background: #25d366; }
    .btn-tg { background: #0088cc; }
    .btn-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .btn-copy { background: #475569; }
    #chat-container {
      position: absolute;
      bottom: 25px;
      left: 115px;
      width: 175px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 20;
    }
    .chat-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }
    .chat-tab {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
    }
    .chat-tab.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
    }
    #chat-messages {
      height: 48px;
      overflow-y: auto;
      font-size: 10px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .chat-msg {
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 6px;
      border-radius: 6px;
      word-break: break-word;
    }
    .chat-msg b { color: #38bdf8; }
    .chat-input-row { display: flex; gap: 4px; }
    #chat-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      padding: 4px 6px;
      font-size: 10px;
    }
    #chat-send {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    #action-btn {
      position: absolute;
      bottom: 140px;
      left: 50%;
      transform: translateX(-50%);
      background: #0284c7;
      color: #fff;
      border: 2px solid #ffffff;
      padding: 12px 26px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 900;
      display: none;
      z-index: 25;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.6);
      cursor: pointer;
    }
    #dismount-btn {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      background: #ef4444;
      color: #fff;
      border: 1.5px solid #fecaca;
      padding: 8px 22px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      display: none;
      z-index: 40;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.6);
      cursor: pointer;
    }
    #speedo {
      position: absolute;
      bottom: 140px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 900;
      display: none;
      z-index: 25;
      font-family: monospace;
    }
    #jump-btn {
      position: absolute;
      bottom: 45px;
      right: 20px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 2.5px solid #38bdf8;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 35;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .vehicle-pedals {
      position: absolute;
      bottom: 35px;
      right: 18px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 35;
    }
    .pedal-btn {
      width: 70px;
      height: 48px;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    #gas-pedal { background: #22c55e; }
    #brake-pedal { background: #ef4444; }
    #fly-up-pedal { background: #0284c7; }
    #joystick-base {
      position: absolute;
      left: 14px;
      bottom: 25px;
      width: 95px;
      height: 95px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      z-index: 25;
    }
    #joystick-stick {
      position: absolute;
      left: 28px;
      top: 28px;
      width: 38px;
      height: 38px;
      background: #38bdf8;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Scoreboard -->
  <div id="scoreboard-hud">
    <div class="score-row"><span>⭐ Stars:</span><span id="hud-stars" class="score-val">0</span></div>
    <div class="score-row"><span>🐟 Fish:</span><span id="hud-fish" class="score-val">0</span></div>
    <div class="score-row"><span>🏀 Baskets:</span><span id="hud-baskets" class="score-val">0</span></div>
    <div class="score-row"><span>⚽ Goals:</span><span id="hud-goals" class="score-val">0</span></div>
    <div class="score-row"><span>🏎 Circuit:</span><span id="hud-lap" class="score-val">LAP 1/3 (0:00)</span></div>
  </div>

  <div id="stamina-box">
    <div>🧗 CLIMB STAMINA</div>
    <div id="stamina-bar"><div id="stamina-fill"></div></div>
  </div>

  <!-- Language Modal -->
  <div id="lang-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>🌐 Select Language</h3>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <button class="tool-btn" onclick="applyLanguage('en')">English 🇺🇸</button>
        <button class="tool-btn" onclick="applyLanguage('ml')">മലയാളം 🇮🇳</button>
        <button class="tool-btn" onclick="applyLanguage('hi')">हिन्दी 🇮🇳</button>
        <button class="tool-btn" onclick="applyLanguage('fa')">فارسی 🇮🇷</button>
        <button class="tool-btn" onclick="applyLanguage('ru')">Русский 🇷🇺</button>
        <button class="tool-btn" onclick="applyLanguage('it')">Italiano 🇮🇹</button>
        <button class="tool-btn" onclick="applyLanguage('uz')">O‘zbek 🇺🇿</button>
        <button class="tool-btn" onclick="applyLanguage('tg')">Тоҷикӣ 🇹🇯</button>
        <button class="tool-btn" onclick="applyLanguage('my')">မြန်မာ 🇲🇲</button>
        <button class="tool-btn" onclick="applyLanguage('id')">Indonesia 🇮🇩</button>
      </div>
      <button class="tool-btn" onclick="closeModal('lang-modal')">Close</button>
    </div>
  </div>

  <!-- Server Modal -->
  <div id="server-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>⚡ Select Server Region</h3>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; max-height:220px; overflow-y:auto;">
        <button class="tool-btn" onclick="applyServer('Kerala, India')">🌴 Kerala, India</button>
        <button class="tool-btn" onclick="applyServer('India Central')">🇮🇳 India Central</button>
        <button class="tool-btn" onclick="applyServer('Iran')">🇮🇷 Iran</button>
        <button class="tool-btn" onclick="applyServer('Russia')">🇷🇺 Russia</button>
        <button class="tool-btn" onclick="applyServer('Italy')">🇮🇹 Italy</button>
        <button class="tool-btn" onclick="applyServer('Uzbekistan')">🇺🇿 Uzbekistan</button>
        <button class="tool-btn" onclick="applyServer('Tajikistan')">🇹🇯 Tajikistan</button>
        <button class="tool-btn" onclick="applyServer('Myanmar')">🇲🇲 Myanmar</button>
        <button class="tool-btn" onclick="applyServer('Indonesia')">🇮🇩 Indonesia</button>
        <button class="tool-btn" onclick="applyServer('Global USA')">🇺🇸 Global USA</button>
      </div>
      <button class="tool-btn" onclick="closeModal('server-modal')">Close</button>
    </div>
  </div>

  <!-- Weather Modal -->
  <div id="weather-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>🌤 Climate & Atmosphere</h3>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <button class="tool-btn" onclick="applyClimate('sunny')">☀️ Sunny Day</button>
        <button class="tool-btn" onclick="applyClimate('sunset')">🌅 Sunset</button>
        <button class="tool-btn" onclick="applyClimate('storm')">⛈️ Rain & Storm</button>
        <button class="tool-btn" onclick="applyClimate('night')">🌙 Night Mode</button>
      </div>
      <button class="tool-btn" onclick="closeModal('weather-modal')">Close</button>
    </div>
  </div>

  <!-- Stars Modal -->
  <div id="stars-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>⭐ Telegram Stars VIP</h3>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <button class="tool-btn" onclick="buyStars(50)">⭐ 50 Stars — VIP Rank</button>
        <button class="tool-btn" onclick="buyStars(250)">⭐ 250 Stars — Dragon Rider</button>
        <button class="tool-btn" onclick="buyStars(500)">⭐ 500 Stars — God Mode</button>
      </div>
      <button class="tool-btn" onclick="closeModal('stars-modal')">Close</button>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>👤 Profile & Social Share</h3>
      <input type="text" id="username-input" style="background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.2); padding:10px; border-radius:10px; color:#fff;" placeholder="Enter Name">
      <div style="display:flex; gap:8px;">
        <button onclick="selectGender('boy')" id="gender-boy" style="flex:1; padding:10px; background:#0284c7; color:#fff; border:none; border-radius:10px; font-weight:bold;">Boy 👦</button>
        <button onclick="selectGender('girl')" id="gender-girl" style="flex:1; padding:10px; background:rgba(255,255,255,0.1); color:#fff; border:none; border-radius:10px; font-weight:bold;">Girl 👧</button>
      </div>
      <button onclick="saveProfile()" style="background:#22c55e; color:#fff; padding:10px; border:none; border-radius:10px; font-weight:bold;">Save Profile</button>
      
      <div style="margin-top:6px; border-top:1px solid rgba(255,255,255,0.15); padding-top:10px;">
        <div style="font-size:11px; font-weight:bold; color:#38bdf8; margin-bottom:6px;">🚀 Invite Friends & Share World:</div>
        <div class="share-grid">
          <button class="share-btn btn-wa" onclick="shareSocial('whatsapp')">WhatsApp</button>
          <button class="share-btn btn-tg" onclick="shareSocial('telegram')">Telegram</button>
          <button class="share-btn btn-ig" onclick="shareSocial('instagram')">Instagram</button>
          <button class="share-btn btn-copy" onclick="shareSocial('copy')">📋 Copy Link</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Top Navigation Controls -->
  <div class="top-bar">
    <div class="top-row-1">
      <div class="pill-group">
        <div id="badge-owner" class="badge owner">👑 OWNER</div>
        <div id="badge-stars" class="badge stars" onclick="openModal('stars-modal')">⭐ 100 STARS</div>
        <div class="badge online">🟢 <span id="online-count">1</span> Online</div>
      </div>
      <div class="comm-btns">
        <button id="mic-btn" class="circle-btn" onclick="toggleMic()" title="Talk & Sing">🎙</button>
        <button id="menu-toggle-btn" onclick="toggleMenu()">☰</button>
      </div>
    </div>
    <div class="tools-bar">
      <button id="btn-lang-top" class="tool-btn" onclick="openModal('lang-modal')">🌐 10 Lang</button>
      <button id="btn-server-top" class="tool-btn" onclick="openModal('server-modal')">⚡ Server: Kerala</button>
      <button id="btn-weather-top" class="tool-btn" onclick="openModal('weather-modal')">🌤 Weather: Sunny</button>
      <button id="btn-profile-top" class="tool-btn" onclick="openModal('profile-modal')">👤 Profile & Share</button>
    </div>
  </div>

  <!-- Fast Travel Drawer -->
  <div id="drawer-menu">
    <button class="menu-item" onclick="teleportTo(0, 1.25, 0)">🏝 Island Central Plaza</button>
    <button class="menu-item" onclick="teleportTo(0, 1.25, -40)">🏙 City Center</button>
    <button class="menu-item" onclick="teleportTo(30, 1.8, -20)">🎤 Live Concert Arena</button>
    <button class="menu-item" onclick="teleportTo(-55, 1.25, -45)">⚽ Football Stadium</button>
    <button class="menu-item" onclick="teleportTo(-40, 1.25, -65)">🏀 Basketball Court</button>
    <button class="menu-item" onclick="teleportTo(15, 1.25, 35)">🏎 Racing Circuit</button>
    <button class="menu-item" onclick="teleportTo(-14, 1.25, -5)">🛹 Skatepark Zone</button>
    <button class="menu-item" onclick="teleportTo(0, 0.2, 95)">🎣 Fishing Harbor</button>
    <button class="menu-item" onclick="teleportTo(0, 1.25, -180)">🧗 Mountain Climbing Base</button>
    <button class="menu-item" onclick="teleportTo(-25, 1.25, 30)">🦖 Dino Safari</button>
    <button class="menu-item" onclick="teleportTo(-45, 1.25, 40)">🤖 Robot Mech Base</button>
    <button class="menu-item" onclick="teleportTo(-75, 1.5, 60)">🐉 Flying Dragon Peak</button>
    <button class="menu-item" onclick="teleportTo(-80, 1.25, 0)">💥 Godzilla Arena</button>
    <button class="menu-item" onclick="teleportTo(50, 1.25, 15)">🚀 Spaceship Port</button>
  </div>

  <div id="chat-container">
    <div class="chat-tabs">
      <button id="tab-group" class="chat-tab active" onclick="switchChat('group')">Group</button>
      <button id="tab-private" class="chat-tab" onclick="switchChat('private')">Private</button>
    </div>
    <div id="chat-messages"><div class="chat-msg"><b>System:</b> Connected to Server!</div></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Chat..." maxlength="60">
      <button id="chat-send" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <div id="speedo">0 KM/H</div>
  <button id="dismount-btn" onclick="dismountAll()">🚪 Dismount</button>
  <button id="action-btn" onclick="executeContextAction()">ACTION</button>

  <script>
    // =========================================================================
    // SECTION 1: CORE CLIENT INITIALIZATION & TELEGRAM WEBAPP WRAPPER
    // =========================================================================
    const socket = io();
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let playerName = tg?.initDataUnsafe?.user?.first_name || "GOKUL";
    document.getElementById('username-input').value = playerName;

    function shareSocial(type) {
      const shareUrl = window.location.href;
      const shareText = `🔥 Join me inside the GlobeVibe Ultra Metaverse: ${shareUrl}`;
      if (type === 'whatsapp') {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
      } else if (type === 'telegram') {
        window.open(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`, '_blank');
      } else {
        navigator.clipboard.writeText(shareUrl);
        alert("✅ Link copied to clipboard!");
      }
    }

    // =========================================================================
    // SECTION 2: MODULAR SOUND SYNTHESIZER & MULTI-BUS AUDIO PIPELINE
    // =========================================================================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioContext();

    function playSound(type) {
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);
      const now = actx.currentTime;

      if (type === 'jump') {
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'engine') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(65, now);
        osc.frequency.linearRampToValueAtTime(140, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'godzilla') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(90, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.8);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'elephant') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(550, now + 0.3);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.6);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
      } else if (type === 'dino') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
      } else if (type === 'kick') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'goal') {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(659.25, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'swish') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'checkpoint') {
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      }
    }

    let isMicOn = false, micMediaStream = null;
    window.toggleMic = async () => {
      const btn = document.getElementById('mic-btn');
      if (!isMicOn) {
        try {
          micMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          isMicOn = true; btn.classList.add('active'); btn.innerText = "🎤 ON";
          const source = actx.createMediaStreamSource(micMediaStream);
          const monitorGain = actx.createGain();
          monitorGain.gain.value = 0.8;
          source.connect(monitorGain);
          monitorGain.connect(actx.destination);
        } catch(e) { alert("Mic Permission Denied!"); }
      } else {
        isMicOn = false; btn.classList.remove('active'); btn.innerText = "🎙️";
        if (micMediaStream) micMediaStream.getTracks().forEach(t => t.stop());
      }
    };

      if (Math.hypot(x, z) > 190) return 'sea';
      if (Math.abs(x) < 14 && z < -40 && z > -240) return 'river';
      return 'land';

    // =========================================================================
    // SECTION 5: NORMALIZING GLTF/GLB RESOURCE MANAGEMENT PIPELINE
    // =========================================================================
    const gltfLoader = new THREE.GLTFLoader();
    function loadGLBDirect(file, targetHeight, onLoad) {
      const process = (gltf) => {
        const root = gltf.scene;
        root.traverse(c => {
          if (c.isMesh) {
            c.castShadow = true;
            c.receiveShadow = true;
            if (c.material) {
              c.material.metalness = c.material.metalness ?? 0.15;
              c.material.roughness = c.material.roughness ?? 0.6;
            }
          }
        });
        const bbox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        bbox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0 && targetHeight) {
          const factor = targetHeight / maxDim;
          root.scale.set(factor, factor, factor);
        }
        onLoad(root);
      };
      gltfLoader.load(file, process, undefined, () => {
        gltfLoader.load('/' + file, process, undefined, () => console.warn("Resource Failed: " + file));
      });
    }

    registerMount(godzillaGroup, 'godzilla', '💥 RIDE GODZILLA', new THREE.Vector3(0, 8.5, 0.5), 1.4, false, false);

    let whaleMesh = null, sharkMesh = null;
    loadGLBDirect('Whale.glb', 9, m => { m.position.set(-80, -1.2, 140); scene.add(m); whaleMesh = m; });
    loadGLBDirect('shark.glb', 4, m => { m.position.set(40, -1.2, 130); scene.add(m); sharkMesh = m; });
    loadGLBDirect('sea_monster.glb', 8, m => { m.position.set(-110, -1.2, 150); scene.add(m); });

    loadGLBDirect('model_1.glb', 2, m => { m.position.set(8, 1.25, 5); scene.add(m); });
    loadGLBDirect('model_2.glb', 2, m => { m.position.set(11, 1.25, 7); scene.add(m); });
    loadGLBDirect('model_3.glb', 2, m => { m.position.set(14, 1.25, 5); scene.add(m); });
    loadGLBDirect('model_4.glb', 2, m => { m.position.set(17, 1.25, 7); scene.add(m); });

    // =========================================================================
    // SECTION 8: AVATAR RIGGING, JOYSTICK CONTROL & STATE MANAGEMENT
    // =========================================================================
    const myPlayer = new THREE.Group();
    myPlayer.position.set(0, 1.25, 0);
    scene.add(myPlayer);
    const playerAvatar = new THREE.Group();
    myPlayer.add(playerAvatar);

    function loadChar(fileName) {
      while (playerAvatar.children.length > 0) playerAvatar.remove(playerAvatar.children[0]);
      loadGLBDirect(fileName, 2.0, m => playerAvatar.add(m));
    }
    loadChar('man.glb');

    window.selectGender = (g) => {
      document.getElementById('gender-boy').style.background = g === 'boy' ? '#0284c7' : 'rgba(255,255,255,0.1)';
      document.getElementById('gender-girl').style.background = g === 'girl' ? '#ec4899' : 'rgba(255,255,255,0.1)';
      loadChar((g === 'girl' ? 'girl.glb' : 'man.glb') + '?v=' + Date.now());
      closeModal('profile-modal');
    };

    let activeMount = 'walk', activeMountData = null;
    let isSittingAudience = false;
    let vSpeed = 0, vAltitude = 0;
    let isGasPressed = false, isBrakePressed = false, isAscendPressed = false;
    let moveX = 0, moveZ = 0, camAngleX = 0, camAngleY = 0.25;

    document.getElementById('gas-pedal').addEventListener('touchstart', e => { e.preventDefault(); isGasPressed = true; });
    document.getElementById('gas-pedal').addEventListener('touchend', () => isGasPressed = false);
    document.getElementById('brake-pedal').addEventListener('touchstart', e => { e.preventDefault(); isBrakePressed = true; });
    document.getElementById('brake-pedal').addEventListener('touchend', () => isBrakePressed = false);

    const flyUpBtn = document.getElementById('fly-up-pedal');
    flyUpBtn.addEventListener('touchstart', e => { e.preventDefault(); isAscendPressed = true; });
    flyUpBtn.addEventListener('touchend', () => isAscendPressed = false);

    const jBase = document.getElementById('joystick-base');
    const jStick = document.getElementById('joystick-stick');
    jBase.addEventListener('touchmove', e => {
      e.preventDefault();
      const b = jBase.getBoundingClientRect();
      let dx = e.touches[0].clientX - b.left - 47;
      let dy = e.touches[0].clientY - b.top - 47;
      const dist = Math.hypot(dx, dy);
      if (dist > 30) { dx = (dx / dist) * 30; dy = (dy / dist) * 30; }
      jStick.style.left = `${47 + dx - 19}px`;
      jStick.style.top = `${47 + dy - 19}px`;
      moveX = dx / 30; moveZ = dy / 30;
    }, { passive: false });
    jBase.addEventListener('touchend', () => { jStick.style.left = '28px'; jStick.style.top = '28px'; moveX = 0; moveZ = 0; });

    let isDrag = false, px = 0, py = 0;
    window.addEventListener('touchstart', e => {
      if (e.target.closest('#joystick-base') || e.target.closest('button') || e.target.closest('#chat-container')) return;
      isDrag = true; px = e.touches[0].clientX; py = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', e => {
      if (!isDrag) return;
      camAngleX -= (e.touches[0].clientX - px) * 0.005;
      camAngleY += (e.touches[0].clientY - py) * 0.004;
      camAngleY = Math.max(-0.2, Math.min(0.8, camAngleY));
      px = e.touches[0].clientX; py = e.touches[0].clientY;
    });
    window.addEventListener('touchend', () => isDrag = false);

    const actBtn = document.getElementById('action-btn');
    let nearbyAction = null, targetObj = null;

    function checkInteractions() {
      const p = myPlayer.position;

      if (activeMount === 'walk') {
        if (p.distanceTo(mountainBasePos) < 14) {
          nearbyAction = 'climb_mountain'; actBtn.innerText = "🧗 CLIMB MOUNTAIN"; actBtn.style.display = 'block'; return;
        }

        if (p.distanceTo(bballMesh.position) < 3.5) {
          nearbyAction = 'shoot_bball'; actBtn.innerText = "🏀 SHOOT BASKET"; actBtn.style.display = 'block'; return;
        }

        for (let s of audienceSeats) {
          if (p.distanceTo(s.pos) < 2.5 && !isSittingAudience) {
            nearbyAction = 'sit_audience'; targetObj = s.pos; actBtn.innerText = "🪑 SIT DOWN"; actBtn.style.display = 'block'; return;
          }
        }

        for (let m of mountRegistry) {
          if (p.distanceTo(m.mesh.position) < (m.type === 'ship' ? 12 : 6)) {
            nearbyAction = 'mount_entity'; targetObj = m; actBtn.innerText = m.name; actBtn.style.display = 'block'; return;
          }
        }
      }

      nearbyAction = null; targetObj = null; actBtn.style.display = 'none';
    }

    window.executeContextAction = () => {
      if (nearbyAction === 'climb_mountain') {
        isClimbing = true;
        document.getElementById('stamina-box').style.display = 'block';
        document.getElementById('dismount-btn').style.display = 'block';
        document.getElementById('dismount-btn').innerText = "🧗 DROP DOWN";
        return;
      }

      if (nearbyAction === 'shoot_bball') {
        playSound('swish');
        bballMesh.position.set(-40, 4.5, -78);
        currentScore.baskets += 2; currentScore.stars += 5; updateScores();
        setTimeout(() => bballMesh.position.set(-40, 1.5, -65), 800);
        return;
      }

      if (nearbyAction === 'sit_audience') {
        isSittingAudience = true;
        myPlayer.position.copy(targetObj);
        myPlayer.position.y = 1.35;
        myPlayer.rotation.y = Math.PI;
        document.getElementById('dismount-btn').style.display = 'block';
        document.getElementById('dismount-btn').innerText = "🧍 STAND UP";
        return;
      }

      if (nearbyAction === 'mount_entity' && targetObj) {
        activeMount = targetObj.type;
        activeMountData = targetObj;

        if (targetObj.type === 'godzilla') playSound('godzilla');
        else if (targetObj.type === 'elephant') playSound('elephant');
        else if (targetObj.type === 'dino') playSound('dino');

        targetObj.mesh.add(playerAvatar);
        playerAvatar.position.copy(targetObj.seatOffset);
        playerAvatar.rotation.set(0, 0, 0);

        flyUpBtn.style.display = targetObj.isFlying ? 'flex' : 'none';
        document.getElementById('vehicle-pedals').style.display = 'flex';
        document.getElementById('dismount-btn').style.display = 'block';
        document.getElementById('dismount-btn').innerText = "🚪 Dismount";
        document.getElementById('speedo').style.display = 'block';
        document.getElementById('jump-btn').style.display = (activeMount === 'skate') ? 'flex' : 'none';
      }
    };

    window.dismountAll = () => {
      if (isClimbing) {
        isClimbing = false;
        document.getElementById('stamina-box').style.display = 'none';
        document.getElementById('dismount-btn').style.display = 'none';
        myPlayer.position.copy(mountainBasePos);
        return;
      }
      if (isSittingAudience) {
        isSittingAudience = false;
        myPlayer.position.z += 1.2;
        document.getElementById('dismount-btn').style.display = 'none';
        return;
      }

      if (activeMountData) {
        myPlayer.add(playerAvatar);
        playerAvatar.position.set(0, 0, 0);
        myPlayer.position.set(activeMountData.mesh.position.x + 3, 1.25, activeMountData.mesh.position.z);
      }

      activeMount = 'walk';
      activeMountData = null;
      vSpeed = 0; vAltitude = 0;
      flyUpBtn.style.display = 'none';
      document.getElementById('vehicle-pedals').style.display = 'none';
      document.getElementById('dismount-btn').style.display = 'none';
      document.getElementById('speedo').style.display = 'none';
      document.getElementById('jump-btn').style.display = 'flex';
    };

    window.playerJump = () => {
      if (activeMount === 'skate') {
        playSound('jump');
        skateEntity.position.y = 2.4;
        setTimeout(() => skateEntity.position.y = 1.25, 300);
      } else if (myPlayer.position.y <= 1.35 && activeMount === 'walk') {
        myPlayer.position.y = 3.2;
        playSound('jump');
      }
    };

    window.teleportTo = (x, y, z) => {
      if (activeMount !== 'walk' || isSittingAudience || isClimbing) window.dismountAll();
      myPlayer.position.set(x, y, z);
      document.getElementById('drawer-menu').style.display = 'none';
    };

    let chatTab = 'group';
    window.switchChat = t => {
      chatTab = t;
      document.getElementById('tab-group').classList.toggle('active', t === 'group');
      document.getElementById('tab-private').classList.toggle('active', t === 'private');
    };
    function sendChatMessage() {
      const inp = document.getElementById('chat-input');
      if (!inp.value.trim()) return;
      socket.emit('chatMessage', { sender: playerName, text: inp.value.trim(), isPrivate: chatTab === 'private' });
      inp.value = '';
    }
    socket.emit('joinGame', { name: playerName });
    socket.on('initWorld', d => document.getElementById('online-count').innerText = d.count);
    socket.on('playerJoined', d => document.getElementById('online-count').innerText = d.count);
    socket.on('playerLeft', d => document.getElementById('online-count').innerText = d.count);
    socket.on('groupMessage', d => appendChat(d.sender, d.text));
    socket.on('privateMessage', d => appendChat(`[Private] ${d.sender}`, d.text));
    function appendChat(s, t) {
      const box = document.getElementById('chat-messages');
      const m = document.createElement('div');
      m.className = 'chat-msg'; m.innerHTML = `<b>${s}:</b> ${t}`;
      box.appendChild(m); box.scrollTop = box.scrollHeight;
    }

    // =========================================================================
    // SECTION 9: MASTER ENGINE ANIMATION, RAYCAST INTERSECTION & VEHICLE TICK
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const downVec = new THREE.Vector3(0, -1, 0);
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      checkInteractions();

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Dynamic Sea Wave Displacements
      const count = seaPosAttr.count;
      for (let i = 0; i < count; i++) {
        const u = seaPosAttr.getX(i);
        const v = seaPosAttr.getZ(i);
        seaPosAttr.setY(i, Math.sin(u * 0.05 + time * 1.5) * Math.cos(v * 0.05 + time * 1.5) * 0.3);
      }
      seaPosAttr.needsUpdate = true;

      if (ferrisWheel) ferrisWheel.rotation.y += 0.005;

      // Marine Animals (Only in Outer Sea Zone)
      if (whaleMesh) whaleMesh.position.x = -80 + Math.sin(time * 0.8) * 12;
      if (sharkMesh) sharkMesh.position.z = 130 + Math.cos(time * 0.8) * 10;

      // Creature Life Cycles Clamped to Ground (No sinking)
      dinoEntity.position.y = 1.25 + Math.sin(time * 3.0) * 0.04;
      elephantEntity.position.y = 1.25;
      dragonEntity.position.y = 1.5 + Math.sin(time * 2.5) * 0.12;

      // Football Friction & Goal Logic
      fballMesh.position.add(fballVelocity);
      fballVelocity.multiplyScalar(0.96);
      if (myPlayer.position.distanceTo(fballMesh.position) < 1.2 && activeMount === 'walk') {
        playSound('kick');
        const kickDir = new THREE.Vector3().subVectors(fballMesh.position, myPlayer.position).normalize();
        fballVelocity.copy(kickDir.multiplyScalar(0.6));
      }
      if (fballMesh.position.z < -52 && Math.abs(fballMesh.position.x + 55) < 6) {
        playSound('goal');
        currentScore.goals += 1; currentScore.stars += 10; updateScores();
        fballMesh.position.set(-55, 1.5, -20);
        fballVelocity.set(0, 0, 0);
      }

      // Mountain Climbing Loop
      if (isClimbing) {
        climbStamina = Math.max(0, climbStamina - 0.15);
        document.getElementById('stamina-fill').style.width = `${climbStamina}%`;
        if (climbStamina <= 0) { window.dismountAll(); }
        else {
          myPlayer.position.lerp(mountainPeakPos, 0.004);
          if (myPlayer.position.distanceTo(mountainPeakPos) < 2.0) {
            alert("🚩 YOU CONQUERED THE PEAK! +50 STARS ⭐");
            currentScore.stars += 50; updateScores(); window.dismountAll();
          }
        }
      }

      // Walking Movement & Precise Ground Alignment
      if (activeMount === 'walk' && !isSittingAudience && !isClimbing) {
        if (moveX !== 0 || moveZ !== 0) {
          const fx = moveX * Math.cos(camAngleX) + moveZ * Math.sin(camAngleX);
          const fz = -moveX * Math.sin(camAngleX) + moveZ * Math.cos(camAngleX);
          myPlayer.position.x += fx * 0.45;
          myPlayer.position.z += fz * 0.45;
          myPlayer.rotation.y = Math.atan2(fx, fz);
        }

        raycaster.set(new THREE.Vector3(myPlayer.position.x, myPlayer.position.y + 2.0, myPlayer.position.z), downVec);
        const hits = raycaster.intersectObjects(colliderMeshes, true);
        if (hits.length > 0) {
          const targetY = hits[0].point.y + 1.25;
          myPlayer.position.y = Math.max(targetY, myPlayer.position.y - 0.15);
        } else {
          myPlayer.position.y = Math.max(-0.6, myPlayer.position.y - 0.15);
        }
      }

      // Vehicle Drive Dynamics
      if (activeMountData) {
        const ent = activeMountData.mesh;
        const maxSpd = activeMountData.speed;

        if (isGasPressed) { vSpeed = Math.min(vSpeed + 0.06, maxSpd); playSound('engine'); }
        else if (isBrakePressed) { vSpeed = Math.max(vSpeed - 0.06, -0.6); }
        else { vSpeed *= 0.95; }

        if (activeMountData.isFlying) {
          if (isAscendPressed) vAltitude = Math.min(vAltitude + 0.35, 180);
          else vAltitude = Math.max(vAltitude - 0.06, 0);
          ent.position.y = 1.25 + vAltitude;
        }

        ent.rotation.y -= moveX * 0.04;
        const nextX = ent.position.x + Math.sin(ent.rotation.y) * vSpeed;
        const nextZ = ent.position.z + Math.cos(ent.rotation.y) * vSpeed;

        const targetZone = isWaterZone(nextX, nextZ);
        if (activeMountData.waterOnly && targetZone === 'land') {
          vSpeed = 0;
        } else {
          ent.position.x = nextX;
          ent.position.z = nextZ;
        }

        // Circuit Lap Checkpoints
        if (activeMount === 'car') {
          currentScore.lapTime += delta;
          const cpPos = raceCheckpoints[currentScore.checkpoint];
          if (ent.position.distanceTo(cpPos) < 12) {
            playSound('checkpoint');
            currentScore.checkpoint++;
            if (currentScore.checkpoint >= raceCheckpoints.length) {
              currentScore.checkpoint = 0;
              currentScore.lap++;
              if (currentScore.lap > 3) currentScore.lap = 1;
            }
          }
          const mins = Math.floor(currentScore.lapTime / 60);
          const secs = Math.floor(currentScore.lapTime % 60);
          document.getElementById('hud-lap').innerText = `LAP ${currentScore.lap}/3 (${mins}:${secs < 10 ? '0' : ''}${secs})`;
        }

        myPlayer.position.copy(ent.position);
        document.getElementById('speedo').innerText = `${Math.abs(Math.round(vSpeed * 50))} KM/H`;
      }

      // Third-Person Dynamic Camera Follow
      const target = activeMount === 'walk' ? myPlayer.position : (activeMountData ? activeMountData.mesh.position : myPlayer.position);
      const camDist = 18;
      camera.position.x = target.x + Math.sin(camAngleX) * camDist * Math.cos(camAngleY);
      camera.position.y = target.y + 6 + Math.sin(camAngleY) * camDist;
      camera.position.z = target.z + Math.cos(camAngleX) * camDist * Math.cos(camAngleY);
      camera.lookAt(target.x, target.y + 1.5, target.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
