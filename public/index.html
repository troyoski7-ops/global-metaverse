<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe Metaverse GTA Island</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #1e3a8a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    .top-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 40; pointer-events: none; }
    .top-bar * { pointer-events: auto; }
    .hud-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .badges-group { display: flex; gap: 5px; flex-wrap: wrap; }
    .badge { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .badge.stars { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }

    .comm-btns { display: flex; gap: 6px; }
    .btn-circle { width: 38px; height: 38px; border-radius: 50%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }

    #score-hud { position: absolute; top: 90px; left: 8px; background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; border-radius: 12px; padding: 8px 12px; color: #fff; font-size: 11px; font-weight: 700; z-index: 30; }
    .score-val { color: #38bdf8; font-family: monospace; font-size: 12px; margin-left: 6px; }

    #action-btn { position: absolute; bottom: 135px; left: 50%; transform: translateX(-50%); background: #0284c7; color: #fff; border: 2px solid #fff; padding: 12px 28px; border-radius: 30px; font-size: 13px; font-weight: 900; display: none; z-index: 45; box-shadow: 0 4px 15px rgba(2,132,199,0.7); cursor: pointer; }
    #dismount-btn { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; border: 1.5px solid #fff; padding: 8px 22px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 45; cursor: pointer; }
    #speedo { position: absolute; bottom: 135px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); color: #38bdf8; border: 1px solid #38bdf8; padding: 5px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 35; }
    #swim-indicator { position: absolute; top: 90px; right: 8px; background: rgba(2, 132, 199, 0.9); border: 1px solid #fff; border-radius: 12px; padding: 6px 12px; color: #fff; font-size: 11px; font-weight: 800; display: none; z-index: 30; }

    #joy-base { position: absolute; left: 16px; bottom: 25px; width: 100px; height: 100px; background: rgba(15, 23, 42, 0.65); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); z-index: 30; }
    #joy-stick { position: absolute; left: 32px; top: 32px; width: 36px; height: 36px; background: #38bdf8; border-radius: 50%; pointer-events: none; }

    .extra-controls { position: absolute; bottom: 25px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 35; align-items: flex-end; }
    .ctrl-row { display: flex; gap: 8px; }
    .btn-touch { width: 56px; height: 48px; border-radius: 12px; background: rgba(15, 23, 42, 0.88); border: 2px solid #38bdf8; color: #fff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-touch.jump { background: #0284c7; width: 58px; height: 50px; border-radius: 50%; font-size: 11px; }
    .btn-touch.gas { background: #22c55e; border-color: #4ade80; display: none; }
    .btn-touch.brake { background: #ef4444; border-color: #f87171; display: none; }
    .btn-touch.sprint { background: #eab308; border-color: #fde047; color: #000; }
    .btn-touch.dance { background: #ec4899; border-color: #f472b6; }
    .btn-touch.dive { background: #06b6d4; border-color: #67e8f9; display: none; }

    #drone-view-btn { position: absolute; bottom: 165px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(15, 23, 42, 0.88); border: 2px solid #a855f7; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; z-index: 35; cursor: pointer; }

    #chat-box { position: absolute; bottom: 20px; left: 125px; width: 175px; background: rgba(15, 23, 42, 0.88); border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); padding: 5px; z-index: 30; }
    #chat-msgs { height: 40px; overflow-y: auto; font-size: 10px; color: #fff; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
    .chat-bubble { background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; }
    .chat-controls { display: flex; gap: 4px; }
    #chat-in { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #fff; font-size: 10px; padding: 2px 4px; outline: none; }
    #chat-send { background: #0284c7; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
    .modal-card { background: #0f172a; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 18px; width: 320px; color: #fff; display: flex; flex-direction: column; gap: 10px; max-height: 85vh; overflow-y: auto; }
    .modal-card h3 { font-size: 15px; color: #38bdf8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-action { background: #1e293b; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 9px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-action.primary { background: #0284c7; border-color: #38bdf8; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="top-bar">
    <div class="hud-row">
      <div class="badges-group">
        <div class="badge stars" onclick="openModal('stars-modal')">⭐ <span id="hud-stars">350</span> STARS</div>
        <div class="badge" onclick="openMasterSettings()">🚪 <span id="hud-room">Global</span></div>
        <div class="badge">🟢 <span id="hud-online">1</span> Online</div>
      </div>
      <div class="comm-btns">
        <button class="btn-circle" onclick="openMasterSettings()">⚙️</button>
      </div>
    </div>
  </div>

  <div id="score-hud">
    <div>⚽ Goals:<span id="score-goals" class="score-val">0</span></div>
  </div>

  <div id="swim-indicator">🏊 SWIMMING</div>
  <div id="speedo">0 KM/H</div>
  <button id="action-btn">ACTION</button>
  <button id="dismount-btn" onclick="exitSeatOrVehicle()">🚪 EXIT</button>
  <button id="drone-view-btn" onclick="toggleDroneView()">⬆️</button>

  <div id="joy-base"><div id="joy-stick"></div></div>

  <div class="extra-controls">
    <div class="ctrl-row">
      <button id="btn-steer-left" class="btn-touch">◀️</button>
      <button id="btn-steer-right" class="btn-touch">▶️</button>
      <button id="btn-sprint" class="btn-touch sprint">⚡ RUN</button>
      <button id="btn-dance" class="btn-touch dance" onclick="triggerDanceEmote()">🕺 DANCE</button>
    </div>
    <div class="ctrl-row">
      <button id="btn-pedal-gas" class="btn-touch gas">⚡ GAS</button>
      <button id="btn-pedal-brake" class="btn-touch brake">🛑 STOP</button>
      <button id="btn-dive" class="btn-touch dive" onclick="triggerUnderwaterDive()">🤿 DIVE</button>
      <button id="btn-jump" class="btn-touch jump" onclick="triggerJump()">JUMP</button>
    </div>
  </div>

  <div id="chat-box">
    <div id="chat-msgs"><div class="chat-bubble"><b>System:</b> Welcome to Metaverse Island!</div></div>
    <div class="chat-controls">
      <input type="text" id="chat-in" placeholder="Chat..." maxlength="45">
      <button id="chat-send" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <div id="master-settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⚙️ Settings</h3>
      <input type="text" id="upd-player-name" class="btn-action" style="text-align:left; background:#000;" placeholder="Player Name">
      <div class="grid-btns">
        <button class="btn-action" onclick="applyGenderSelect('man')">👦 Boy</button>
        <button class="btn-action" onclick="applyGenderSelect('girl')">👧 Girl</button>
      </div>
      <button class="btn-action primary" onclick="closeMasterSettings()">Save & Close</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const socket = io();
    let currentRoom = "Global";
    let playerName = "Player_" + Math.floor(Math.random() * 899 + 100);
    let penaltyGoals = 0;
    let starsCount = 350;
    let isDroneView = false;
    let isDancing = false;
    let isUnderwater = false;

    window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; };
    window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; };
    window.openMasterSettings = () => { document.getElementById('master-settings-modal').style.display = 'flex'; };
    window.closeMasterSettings = () => {
      const n = document.getElementById('upd-player-name').value.trim();
      if (n) { playerName = n; }
      document.getElementById('master-settings-modal').style.display = 'none';
    };

    // Synthesizer Audio
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
      if (actx.state === 'suspended') actx.resume();
      const now = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);
      if (type === 'kick') {
        osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'goal') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.15);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'engine') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(75, now); osc.frequency.linearRampToValueAtTime(115, now + 0.12);
        gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'music') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554.37, now + 0.1);
        gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e3a8a);
    scene.fog = new THREE.FogExp2(0x1e3a8a, 0.0018);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.8;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.6);
    scene.add(hemiLight);
    const sun = new THREE.DirectionalLight(0xfff1dc, 0.8);
    sun.position.set(60, 100, 50);
    scene.add(sun);

    // Deep Ocean Water
    const ocean = new THREE.Mesh(
      new THREE.PlaneGeometry(1600, 1600),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.85 })
    );
    ocean.rotation.x = -Math.PI / 2; ocean.position.y = 0.0; scene.add(ocean);

    // 1. SOLID 3D LAYERED ISLAND (Zero Sinking Ground)
    const island = new THREE.Mesh(new THREE.CylinderGeometry(72, 78, 8, 64), new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.85 }));
    island.position.set(0, 0.3, 0); scene.add(island);

    const snowBase = new THREE.Mesh(new THREE.CylinderGeometry(24, 25, 8.1, 32), new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.9 }));
    snowBase.position.set(30, 0.35, 25); scene.add(snowBase);

    const desertBase = new THREE.Mesh(new THREE.CylinderGeometry(24, 25, 8.1, 32), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.9 }));
    desertBase.position.set(-32, 0.35, -28); scene.add(desertBase);

    const turf = new THREE.Mesh(new THREE.BoxGeometry(26, 8.2, 42), new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.6 }));
    turf.position.set(0, 0.35, -44); scene.add(turf);

    // 2. ACTIVE VOLCANO & REAL-TIME LAVA EMISSION
    const volcanoGroup = new THREE.Group(); volcanoGroup.position.set(0, 0, -145); scene.add(volcanoGroup);
    const lavaLight = new THREE.PointLight(0xff4500, 3.5, 90);
    lavaLight.position.set(0, 22, -145); scene.add(lavaLight);

    const lavaGeo = new THREE.BufferGeometry();
    const pCount = 80;
    const lPos = new Float32Array(pCount * 3);
    const lVels = [];
    for (let i = 0; i < pCount; i++) {
      lPos[i * 3] = (Math.random() - 0.5) * 6;
      lPos[i * 3 + 1] = 18 + Math.random() * 4;
      lPos[i * 3 + 2] = -145 + (Math.random() - 0.5) * 6;
      lVels.push({ vx: (Math.random() - 0.5) * 0.4, vy: 0.2 + Math.random() * 0.3, vz: (Math.random() - 0.5) * 0.4 });
    }
    lavaGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3));
    const lavaParticles = new THREE.Points(lavaGeo, new THREE.PointsMaterial({ color: 0xff3b00, size: 1.4 }));
    scene.add(lavaParticles);

    // Model Loader
    const mixers = [];
    const gltfLoader = new THREE.GLTFLoader();
    function loadGLB(file, size, onLoad) {
      const handle = (gltf) => {
        const root = gltf.scene;
        const bbox = new THREE.Box3().setFromObject(root);
        const sz = new THREE.Vector3(); bbox.getSize(sz);
        const maxD = Math.max(sz.x, sz.y, sz.z);
        if (maxD > 0 && size) root.scale.setScalar(size / maxD);
        if (gltf.animations && gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(root);
          mixer.clipAction(gltf.animations[0]).play();
          mixers.push(mixer);
        }
        onLoad(root);
      };
      gltfLoader.load(file, handle, undefined, () => gltfLoader.load('/' + file, handle, undefined, () => {}));
    }

    loadGLB('volcano.glb', 50, m => volcanoGroup.add(m));

    // 3. GODZILLA & KING KONG (Natural Realistic Skin Matched)
    const godzillaSea = new THREE.Group(); godzillaSea.position.set(-110, 0, -85); scene.add(godzillaSea);
    loadGLB('godzilla.glb', 28, m => godzillaSea.add(m));

    const kingKongSea = new THREE.Group(); kingKongSea.position.set(-90, 0, -85); kingKongSea.rotation.y = -Math.PI / 2; scene.add(kingKongSea);
    loadGLB('king kong.glb', 26, m => {
      m.traverse(node => {
        if (node.isMesh) {
          node.material = new THREE.MeshStandardMaterial({ color: 0x3f3833, roughness: 0.85, metalness: 0.1 });
        }
      });
      kingKongSea.add(m);
    });

    // 4. PENALTY SPOT & FOOTBALL (Center Positioned & Scaled)
    const penaltyPost = new THREE.Group(); penaltyPost.position.set(0, 4.4, -62); scene.add(penaltyPost);
    loadGLB('goalpost.glb', 5.5, m => penaltyPost.add(m));

    const ballCenterPos = new THREE.Vector3(0, 4.75, -48);
    const fBall = new THREE.Group(); fBall.position.copy(ballCenterPos); scene.add(fBall);
    loadGLB('football.glb', 0.8, m => { m.rotation.set(0, 0, 0); fBall.add(m); });

    // 5. SNOW ZONE ANIMALS (Safe on Land Y: 4.4, Zero Sea Sinking)
    loadGLB('falling_snow_loop.glb', 24, m => { m.position.set(30, 8.5, 25); scene.add(m); });
    loadGLB('ski_station.glb', 10, m => { m.position.set(22, 4.4, 18); scene.add(m); });
    loadGLB('ski_lift_station.glb', 7, m => { m.position.set(22, 4.4, 24); scene.add(m); });
    loadGLB('winter_market.glb', 8, m => { m.position.set(34, 4.4, 20); scene.add(m); });
    loadGLB('iceberg_large.glb', 14, m => { m.position.set(48, 0.0, 52); scene.add(m); });
    loadGLB('polar_bear.glb', 3.8, m => { m.position.set(28, 4.4, 28); scene.add(m); });
    loadGLB('reindeer.glb', 3.4, m => { m.position.set(24, 4.4, 26); scene.add(m); });
    loadGLB('snow_leopard.glb', 2.8, m => { m.position.set(32, 4.4, 24); scene.add(m); });
    loadGLB('penguin_single.glb', 1.4, m => { m.position.set(34, 4.4, 30); scene.add(m); });
    loadGLB('ice_penguins.glb', 4.5, m => { m.position.set(30, 4.4, 32); scene.add(m); });

    // 6. SAFE TRACK TRAINS & TRAMS (Collision Free)
    const bulletTrainRig = new THREE.Group(); scene.add(bulletTrainRig);
    loadGLB('bullet_train.glb', 6.5, m => bulletTrainRig.add(m));

    const tram1Rig = new THREE.Group(); scene.add(tram1Rig);
    loadGLB('tram1.glb', 5.0, m => tram1Rig.add(m));

    const tram2Rig = new THREE.Group(); scene.add(tram2Rig);
    loadGLB('tram2.glb', 5.0, m => tram2Rig.add(m));

    const cableCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(22, 7.5, 22), new THREE.Vector3(4, 14, 34), new THREE.Vector3(-22, 20.0, 46)]);
    const cableLine = new THREE.Mesh(new THREE.TubeGeometry(cableCurve, 32, 0.05, 8, false), new THREE.MeshBasicMaterial({ color: 0x1e293b }));
    scene.add(cableLine);
    const cableCarRig = new THREE.Group(); scene.add(cableCarRig);
    loadGLB('cablecar.glb', 3.2, m => cableCarRig.add(m));

    // 7. RICH FOREST (Multi-Dinosaurs & Dense Foliage)
    loadGLB('forest_terrain.glb', 45, m => { m.position.set(-36, 4.4, 28); scene.add(m); });
    loadGLB('rope_bridge.glb', 10, m => { m.position.set(-18, 4.4, 22); scene.add(m); });
    loadGLB('Trex.glb', 5.5, m => { m.position.set(-38, 4.4, 22); scene.add(m); });
    loadGLB('Triceratops.glb', 4.5, m => { m.position.set(-28, 4.4, 30); scene.add(m); });
    loadGLB('Stegosaurus.glb', 4.5, m => { m.position.set(-42, 4.4, 28); scene.add(m); });
    loadGLB('velociraptor.glb', 3.2, m => { m.position.set(-34, 4.4, 26); scene.add(m); });
    loadGLB('Oviraptor.glb', 2.8, m => { m.position.set(-30, 4.4, 18); scene.add(m); });
    loadGLB('oviraptor_2.glb', 2.8, m => { m.position.set(-26, 4.4, 20); scene.add(m); });

    const treeList = ['twisted_tree_1.glb', 'twisted_tree_2', 'forest_trees.glb', 'tree_large.glb', 'tree.glb', 'palm_tree.glb'];
    treeList.forEach((t, i) => loadGLB(t, 6.0, m => { m.position.set(-20 - i * 4, 4.4, 16 + i * 3); scene.add(m); }));
    const flowerList = ['flower_bush.glb', 'flower_group.glb', 'flower_single.glb', 'flower_yellow.glb', 'flowers_small.glb'];
    flowerList.forEach((f, i) => loadGLB(f, 2.0, m => { m.position.set(-16 - i * 3, 4.4, 16 + i * 4); scene.add(m); }));
    loadGLB('panda.glb', 2.0, m => { m.position.set(-32, 4.4, 32); scene.add(m); });
    loadGLB('bird_house.glb', 2.0, m => { m.position.set(-36, 4.4, 34); scene.add(m); });

    // Flying Forest Orbit
    const flyingGroup = new THREE.Group(); flyingGroup.position.set(-36, 16, 28); scene.add(flyingGroup);
    loadGLB('dragon.glb', 6.5, m => { m.position.set(12, 0, 0); flyingGroup.add(m); });
    loadGLB('Pterodactylus.glb', 4.2, m => { m.position.set(-12, 1, 0); flyingGroup.add(m); });
    loadGLB('eagle.glb', 2.5, m => { m.position.set(0, 2, 10); flyingGroup.add(m); });
    loadGLB('bird.glb', 1.2, m => { m.position.set(6, 0, 8); flyingGroup.add(m); });
    loadGLB('bird_2.glb', 1.2, m => { m.position.set(-6, 1, -8); flyingGroup.add(m); });
    loadGLB('parrot.glb', 1.4, m => { m.position.set(0, -1, -10); flyingGroup.add(m); });

    // Insects
    const insectGroup = new THREE.Group(); insectGroup.position.set(-22, 5.2, 22); scene.add(insectGroup);

      });
      remotePlayers[data.id] = { group, data };

    function checkInteractions() {
      if (currentActiveSeat) { actBtn.style.display = 'none'; return; }
      const p = localPlayer.position;

      // Penalty Kick
      if (p.distanceTo(fBall.position) < 2.5) {
        actBtn.innerText = "⚽ PENALTY KICK"; actBtn.style.display = 'block';
        actBtn.onclick = () => {
          playSfx('kick');

            playSfx('goal');

            document.getElementById('hud-stars').innerText = starsCount;
            fBall.position.copy(ballCenterPos);
          }, 450);
        };
        return;
      }

      // Board Vehicle
      for (let key in multiVehicles) {
        const v = multiVehicles[key];
        const worldPos = new THREE.Vector3(); v.object.getWorldPosition(worldPos);
        if (p.distanceTo(worldPos) < (key === 'cruise' ? 25.0 : 6.0)) {
          actBtn.innerText = `🚗 DRIVE ${key.toUpperCase()}`;
          actBtn.style.display = 'block';
          actBtn.onclick = () => {
            currentActiveSeat = { rigKey: key };
            v.object.add(localAvatar);
            localAvatar.position.copy(v.offsets[0]);
            localAvatar.visible = !v.isClosedCockpit;
            document.getElementById('speedo').style.display = 'block';
            document.getElementById('dismount-btn').style.display = 'block';
          };
          return;
        }
      }
      actBtn.style.display = 'none';
    }

      const v = multiVehicles[currentActiveSeat.rigKey];
      localPlayer.add(localAvatar);
      localAvatar.visible = true;
      localAvatar.position.set(0, 0, 0);
      const worldPos = new THREE.Vector3(); v.object.getWorldPosition(worldPos);
      localPlayer.position.set(worldPos.x + 3.0, 4.4, worldPos.z);
      document.getElementById('speedo').style.display = 'none';
      document.getElementById('dismount-btn').style.display = 'none';
      currentActiveSeat = null;
    };

    // Game Loop
    const clock = new THREE.Clock();
    let bulletT = 0, tram1T = 0, tram2T = 0, cableCarT = 0, cableDir = 1;

    function animate() {
      requestAnimationFrame(animate);
      checkInteractions();
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();
      mixers.forEach(m => m.update(delta));

      // Lava Eruption Animation
      const posArr = lavaParticles.geometry.attributes.position.array;
      for (let i = 0; i < pCount; i++) {
        posArr[i * 3 + 1] += lVels[i].vy;
        posArr[i * 3] += lVels[i].vx;
        posArr[i * 3 + 2] += lVels[i].vz;
        if (posArr[i * 3 + 1] > 26) {
          posArr[i * 3] = (Math.random() - 0.5) * 6;
          posArr[i * 3 + 1] = 18;
          posArr[i * 3 + 2] = -145 + (Math.random() - 0.5) * 6;
        }
      }
      lavaParticles.geometry.attributes.position.needsUpdate = true;
      lavaLight.intensity = 2.5 + Math.sin(time * 4) * 1.0;

      // Safe Tracks (Collision Free Loops)
      bulletT += delta * 0.4;
      bulletTrainRig.position.set(Math.sin(bulletT) * 15, 4.4, Math.cos(bulletT) * 15);
      bulletTrainRig.rotation.y = bulletT + Math.PI / 2;

      tram1T += delta * 0.25;
      tram1Rig.position.set(30 + Math.sin(tram1T) * 10, 4.4, 25 + Math.cos(tram1T) * 10);
      tram1Rig.rotation.y = tram1T + Math.PI / 2;

      tram2T += delta * 0.25;
      tram2Rig.position.set(-32 + Math.sin(tram2T) * 10, 4.4, -28 + Math.cos(tram2T) * 10);
      tram2Rig.rotation.y = tram2T + Math.PI / 2;

      cableCarT += delta * 0.08 * cableDir;
      if (cableCarT >= 1.0) { cableCarT = 1.0; cableDir = -1; }
      else if (cableCarT <= 0.0) { cableCarT = 0.0; cableDir = 1; }
      cableCarRig.position.copy(cableCurve.getPoint(cableCarT));

      // Sea Cargo Ship Continuous Ocean Sailing
      cargoShip.position.x = Math.sin(time * 0.08) * 120;
      cargoShip.position.z = 95 + Math.cos(time * 0.08) * 40;
      cargoShip.rotation.y = Math.atan2(Math.cos(time * 0.08) * 120, -Math.sin(time * 0.08) * 40);

      // Flying Orbits
      flyingGroup.rotation.y = time * 0.3;
      planeEntity.rotation.y = time * 0.15;
      planeEntity.position.x = Math.sin(time * 0.15) * 80;
      planeEntity.position.z = Math.cos(time * 0.15) * 80;

      // Local Player & Upright Clamping (Zero Dead Pose)
      if (!currentActiveSeat) {
        localAvatar.rotation.z = 0; // Completely locks out falling/side flips
        
        const distFromCenter = Math.hypot(localPlayer.position.x, localPlayer.position.z);
        const inWater = distFromCenter > 72;

        if (inWater) {
          document.getElementById('swim-indicator').style.display = 'block';
          document.getElementById('btn-dive').style.display = 'flex';
          localAvatar.rotation.x = Math.PI / 3; // Swimming angle
          localPlayer.position.y = isUnderwater ? -1.4 : 0.2;
        } else {
          document.getElementById('swim-indicator').style.display = 'none';
          document.getElementById('btn-dive').style.display = 'none';
          isUnderwater = false;
          localAvatar.rotation.x = 0; // Upright standing pose
          if (localPlayer.position.y > 4.4) localPlayer.position.y = Math.max(4.4, localPlayer.position.y - 0.15);
          else localPlayer.position.y = 4.4;
        }

        const effJoyX = joyX !== 0 ? joyX : steerBtnX;
        if (effJoyX !== 0 || joyZ !== 0) {
          isDancing = false;
          const speed = inWater ? 0.25 : (isSprint ? 0.65 : 0.35);
          const fx = effJoyX * Math.cos(camRotX) + joyZ * Math.sin(camRotX);
          const fz = -effJoyX * Math.sin(camRotX) + joyZ * Math.cos(camRotX);
          localPlayer.position.x += fx * speed;
          localPlayer.position.z += fz * speed;
          localPlayer.rotation.y = Math.atan2(fx, fz);

          socket.emit('playerMoved', { room: currentRoom, x: localPlayer.position.x, y: localPlayer.position.y, z: localPlayer.position.z, rotY: localPlayer.rotation.y });
        }
      }

      // Camera Angle
      if (isDroneView) {
        camera.position.set(0, 130, 95);
        camera.lookAt(0, 0, 0);
      } else {
        const t = (currentActiveSeat && currentActiveSeat.rigKey) ? multiVehicles[currentActiveSeat.rigKey].object : localPlayer;
        const tp = new THREE.Vector3(); t.getWorldPosition(tp);
        camera.position.x = tp.x + Math.sin(camRotX) * 10;
        camera.position.y = tp.y + 3.2;
        camera.position.z = tp.z + Math.cos(camRotX) * 10;
        camera.lookAt(tp.x, tp.y + 3.0, tp.z);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
