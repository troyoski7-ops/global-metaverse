<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe 3D</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: system-ui, -apple-system, sans-serif; }
    #game-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
    .top-bar, .side-dock, .chat-box, .modal-card, #joystick-base { pointer-events: auto; }

    /* ഹെഡർ ബാർ */
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .badges { display: flex; gap: 6px; align-items: center; }
    .owner-tag { background: linear-gradient(45deg, #ffd700, #ff8c00); color: #000; font-weight: 900; padding: 4px 8px; border-radius: 12px; font-size: 11px; }
    .vip-tag { background: linear-gradient(45deg, #a855f7, #ec4899); color: #fff; font-weight: bold; padding: 4px 8px; border-radius: 12px; font-size: 11px; }
    .points-tag { background: rgba(15, 23, 42, 0.85); color: #ffd700; padding: 4px 10px; border-radius: 12px; font-weight: bold; border: 1px solid #ffd700; font-size: 11px; }
    
    .top-actions { display: flex; gap: 5px; }
    .pill-btn { background: rgba(15, 23, 42, 0.85); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); padding: 6px 9px; border-radius: 12px; font-size: 11px; backdrop-filter: blur(8px); cursor: pointer; }
    .star-gold { background: linear-gradient(45deg, #eab308, #ca8a04); color: #000; font-weight: bold; border: none; }

    /* വലതുവശത്തെ ആക്ഷൻ മെനുകൾ */
    .side-dock { position: absolute; right: 10px; top: 50px; display: flex; flex-direction: column; gap: 6px; }
    .dock-btn { background: rgba(15, 23, 42, 0.85); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 8px 12px; border-radius: 12px; font-size: 11px; backdrop-filter: blur(8px); cursor: pointer; }

    /* 🕹️ സുഗമമായ 360° ടച്ച് ജോയ്സ്റ്റിക്ക് */
    #joystick-base { position: absolute; left: 16px; bottom: 20px; width: 110px; height: 110px; background: rgba(0, 0, 0, 0.25); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); touch-action: none; }
    #joystick-stick { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 10px rgba(56, 189, 248, 0.8); pointer-events: none; }

    /* ഗ്രൂപ്പ് ചാറ്റ് */
    .chat-box { position: absolute; right: 10px; bottom: 12px; width: 220px; background: rgba(15, 23, 42, 0.9); border-radius: 12px; padding: 6px; border: 1px solid rgba(255, 255, 255, 0.2); }
    #chat-content { height: 45px; overflow-y: auto; font-size: 11px; color: #fff; margin-bottom: 4px; }
    .emoji-row { display: flex; gap: 8px; font-size: 15px; margin-bottom: 3px; cursor: pointer; }
    .chat-controls { display: flex; gap: 3px; }
    .chat-controls input { flex: 1; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 4px 6px; border-radius: 6px; font-size: 10px; }
    .chat-controls button { background: #0284c7; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }

    /* മോഡലുകൾ */
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-card { background: #1e293b; color: #fff; padding: 16px; border-radius: 16px; width: 85%; max-width: 310px; display: flex; flex-direction: column; gap: 8px; text-align: center; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0; }
    .color-row { display: flex; justify-content: space-around; margin: 8px 0; }
    .color-dot { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; }
    .btn-action { background: #0284c7; color: #fff; border: none; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-pink { background: #ec4899; color: #fff; border: none; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-close { background: #64748b; color: #fff; border: none; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    .star-buy-row { background: #334155; border: 1px solid #eab308; color: #fff; padding: 8px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="ui-layer">
    <!-- ടോപ്പ് ബാർ -->
    <div class="top-bar">
      <div class="badges">
        <div id="owner-badge" class="owner-tag hidden">👑 OWNER</div>
        <div id="vip-badge" class="vip-tag hidden">⭐ VIP</div>
        <div class="points-tag">🪙 <span id="pts-val">100</span></div>
      </div>
      <div class="top-actions">
        <button class="pill-btn" onclick="openBox('avatar-box')">🧑 Character</button>
        <button class="pill-btn" onclick="openBox('server-box')">🌐 Server</button>
        <button class="pill-btn star-gold" onclick="openBox('stars-box')">⭐ Stars</button>
      </div>
    </div>

    <!-- സൈഡ് ബട്ടണുകൾ -->
    <div class="side-dock">
      <button class="dock-btn" onclick="openBox('rides-box')">🚀 Rides & Giants</button>
      <button class="dock-btn" onclick="openBox('stage-box')">🎤 Concert Stage</button>
      <button class="dock-btn" onclick="openBox('friends-box')">❤️️ Friends & Love</button>
      <button class="dock-btn" onclick="takeInstantSelfie()">📸 Selfie Zone</button>
    </div>

    <!-- 🕹️ ജോയ്സ്റ്റിക്ക് -->
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>

    <!-- ലൈവ് ഗ്രൂപ്പ് ചാറ്റ് -->
    <div class="chat-box">
      <div id="chat-content"></div>
      <div class="emoji-row">
        <span onclick="putEmoji('❤️')">❤️</span>
        <span onclick="putEmoji('🔥')">🔥</span>
        <span onclick="putEmoji('🎉')">🎉</span>
        <span onclick="putEmoji('💍')">💍</span>
      </div>
      <div class="chat-controls">
        <input type="text" id="chat-txt" placeholder="Group chat..." maxlength="80">
        <button onclick="postChat()">Send</button>
      </div>
    </div>
  </div>

  <!-- 1. ക്യാരക്ടർ മോഡൽ (Boy / Girl) -->
  <div id="avatar-box" class="modal hidden">
    <div class="modal-card">
      <h3>Select Your Character</h3>
      <div class="grid-btns">
        <button onclick="setCharGender('boy')" class="btn-action">👦 Boy</button>
        <button onclick="setCharGender('girl')" class="btn-pink">👧 Girl</button>
      </div>
      <p style="font-size:11px;">Outfit Color:</p>
      <div class="color-row">
        <button class="color-dot" style="background:#ef4444;" onclick="setCharColor('#ef4444')"></button>
        <button class="color-dot" style="background:#2563eb;" onclick="setCharColor('#2563eb')"></button>
        <button class="color-dot" style="background:#10b981;" onclick="setCharColor('#10b981')"></button>
        <button class="color-dot" style="background:#f59e0b;" onclick="setCharColor('#f59e0b')"></button>
        <button class="color-dot" style="background:#8b5cf6;" onclick="setCharColor('#8b5cf6')"></button>
      </div>
      <button onclick="closeBox('avatar-box')" class="btn-close">Done</button>
    </div>
  </div>

  <!-- 2. റൈഡുകളും ജയന്റ്സും -->
  <div id="rides-box" class="modal hidden">
    <div class="modal-card">
      <h3>Mount Rides & Giants</h3>
      <div class="grid-btns">
        <button onclick="mountRide('walk')" class="btn-action">🏃 Walk</button>
        <button onclick="mountRide('car')" class="btn-action">🏎️ Red Car</button>
        <button onclick="mountRide('bike')" class="btn-action">🏍️ Bike</button>
        <button onclick="mountRide('kong')" class="btn-action">🦍 King Kong</button>
        <button onclick="mountRide('godzilla')" class="btn-action">🦖 Godzilla</button>
        <button onclick="mountRide('heli')" class="btn-action">🚁 Helicopter</button>
      </div>
      <button onclick="closeBox('rides-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 3. സെർവർ റൂമുകൾ (Kerala, UAE, USA) -->
  <div id="server-box" class="modal hidden">
    <div class="modal-card">
      <h3>🌐 Select World Server</h3>
      <div class="grid-btns">
        <button onclick="joinServer('kerala', '🌴 Kerala')" class="btn-action">🌴 Kerala</button>
        <button onclick="joinServer('india', '🇮🇳 India')" class="btn-action">🇮🇳 India</button>
        <button onclick="joinServer('uae', '🇦🇪 UAE/Dubai')" class="btn-action">🇦🇪 UAE</button>
        <button onclick="joinServer('usa', '🇺🇸 USA/Global')" class="btn-action">🇺🇸 Global</button>
      </div>
      <button onclick="closeBox('server-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 4. കോൺസേർട്ട് സ്റ്റേജ് & മൈക്ക് -->
  <div id="stage-box" class="modal hidden">
    <div class="modal-card">
      <h3>🎤 Live Stage & Concert</h3>
      <button id="stage-mic-btn" onclick="toggleStageMic()" class="btn-action" style="background:#ef4444;">🎙️ Start Singing (Live Mic)</button>
      <p style="font-size:11px; margin-top:6px;">Sync DJ Songs:</p>
      <button onclick="playStageTrack('https://commondatastorage.googleapis.com/codeskulptor-demos/riceracer_assets/music/win.ogg', 'Neon EDM Beat')" class="btn-action">🎵 Play Neon Beat</button>
      <button onclick="playStageTrack('https://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg', 'Chill Lo-Fi')" class="btn-action">🎶 Play Lo-Fi Groove</button>
      <button onclick="closeBox('stage-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 5. ഒഫീഷ്യൽ Telegram Stars ഷോപ്പ് -->
  <div id="stars-box" class="modal hidden">
    <div class="modal-card">
      <h3>⭐ Telegram Stars Gifts</h3>
      <div class="star-buy-row" onclick="buyStarItem('VIP All-Access Pass', 'Unlock VIP badge and all rides', 25, 'vip_pass')">
        <span>👑 VIP Metaverse Pass</span>
        <strong style="color:#facc15;">⭐ 25 Stars</strong>
      </div>
      <div class="star-buy-row" onclick="buyStarItem('Super Fireworks Gift', 'Trigger fireworks for everyone', 10, 'star_gift')">
        <span>🎆 Fireworks Gift</span>
        <strong style="color:#facc15;">⭐ 10 Stars</strong>
      </div>
      <button onclick="closeBox('stars-box')" class="btn-close">Close</button>
    </div>
  </div>

  <!-- 6. ഫ്രണ്ട്സ് & പ്രൊപ്പോസ് -->
  <div id="friends-box" class="modal hidden">
    <div class="modal-card">
      <h3>❤️ Social & Friends Hub</h3>
      <button onclick="addFriendNearby()" class="btn-action">➕ Add Player as Friend</button>
      <button onclick="proposeWithFireworks()" class="btn-action" style="background:#eab308; color:#000;">💍 Propose Marriage (Fireworks)</button>
      <button onclick="closeBox('friends-box')" class="btn-close">Close</button>
    </div>
  </div>

  <script>
    const socket = io();
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let isOwner = false;
    let myColor = '#2563eb';
    let myGender = 'boy';
    let activeRide = 'walk';
    let userPoints = 100;

    // --- 3D Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('game-container').appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(40, 70, 40);
    scene.add(dirLight);

    // പച്ചപ്പുല്ല് ദ്വീപ് & നീലക്കടൽ
    const island = new THREE.Mesh(new THREE.CylinderGeometry(110, 115, 4, 32), new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 }));
    island.position.y = -2;
    scene.add(island);

    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2 }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = -3.8;
    scene.add(ocean);

    // 🪙 നിലത്ത് കറങ്ങുന്ന ഗോൾഡ് കോയിനുകൾ (Collect Points)
    const coins = [];
    const coinGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 16);
    const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
    for (let i = 0; i < 30; i++) {
      const c = new THREE.Mesh(coinGeo, coinMat);
      const angle = Math.random() * Math.PI * 2;
      const dist = 10 + Math.random() * 85;
      c.position.set(Math.cos(angle) * dist, 1, Math.sin(angle) * dist);
      c.rotation.z = Math.PI / 2;
      scene.add(c);
      coins.push(c);
    }

    // 🎤 ലൈവ് കോൺസേർട്ട് സ്റ്റേജ്
    const stage = new THREE.Group();
    const stageBase = new THREE.Mesh(new THREE.BoxGeometry(16, 1.5, 12), new THREE.MeshStandardMaterial({ color: 0x111827 }));
    stageBase.position.y = 0.75; stage.add(stageBase);
    const stageRoof = new THREE.Mesh(new THREE.BoxGeometry(16, 0.6, 12), new THREE.MeshStandardMaterial({ color: 0xec4899, emissive: 0xec4899, emissiveIntensity: 0.4 }));
    stageRoof.position.y = 7; stage.add(stageRoof);
    stage.position.set(0, 0, -45);
    scene.add(stage);

    // 🦖 യഥാർത്ഥ ഗോഡ്സില്ല
    const godzilla = new THREE.Group();
    const gzB = new THREE.Mesh(new THREE.BoxGeometry(6, 9, 9), new THREE.MeshStandardMaterial({ color: 0x14532d }));
    gzB.position.y = 4.5; godzilla.add(gzB);
    const gzH = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 6), new THREE.MeshStandardMaterial({ color: 0x052e16 }));
    gzH.position.set(0, 9.5, 5); godzilla.add(gzH);
    godzilla.position.set(-35, 0, 20);
    scene.add(godzilla);

    // 🦍 യഥാർത്ഥ കിംഗ് കോങ്
    const kong = new THREE.Group();
    const kB = new THREE.Mesh(new THREE.BoxGeometry(6, 8, 5), new THREE.MeshStandardMaterial({ color: 0x1f2937 }));
    kB.position.y = 4; kong.add(kB);
    const kH = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), new THREE.MeshStandardMaterial({ color: 0x111827 }));
    kH.position.set(0, 8.8, 0.5); kong.add(kH);
    kong.position.set(35, 0, 20);
    scene.add(kong);

    // 🏎️ റെഡ് സ്പോർട്സ് കാർ
    const car = new THREE.Group();
    const carB = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.2, 6), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
    carB.position.y = 0.8; car.add(carB);
    const carC = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1, 3), new THREE.MeshStandardMaterial({ color: 0x111827 }));
    carC.position.set(0, 1.8, -0.2); car.add(carC);
    car.position.set(-18, 0, -20);
    scene.add(car);

    // 🏍️ ബൈക്ക്
    const bike = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 3), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
    bike.position.set(18, 0.8, -20);
    scene.add(bike);

    // 🧑‍🤝‍🧑 യഥാർത്ഥ Boy & Girl അവതാർ
    let player = new THREE.Group();
    scene.add(player);

    function renderAvatar() {
      while (player.children.length > 0) player.remove(player.children[0]);
      
      const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.3, 0.6), new THREE.MeshStandardMaterial({ color: myColor }));
      body.position.y = 1.3;
      player.add(body);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.MeshStandardMaterial({ color: '#ffd166' }));
      head.position.y = 2.4;
      player.add(head);

      if (myGender === 'girl') {
        const hair = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.95, 0.9), new THREE.MeshStandardMaterial({ color: 0x7c2d12 }));
        hair.position.set(0, 2.5, -0.1);
        player.add(hair);
      } else {
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.25, 8), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        cap.position.y = 2.85;
        player.add(cap);
      }

      const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, 0.4), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
      lLeg.position.set(-0.25, 0.4, 0); player.add(lLeg);
      const rLeg = lLeg.clone();
      rLeg.position.set(0.25, 0.4, 0); player.add(rLeg);

      player.userData = { body, lLeg, rLeg };
    }
    renderAvatar();

    // രജിസ്ട്രേഷൻ
    socket.emit('registerUser', {
      name: tg?.initDataUnsafe?.user?.first_name || "Gokul",
      telegramId: tg?.initDataUnsafe?.user?.id || 1689374364,
      shirtColor: myColor,
      gender: myGender
    });

    socket.on('ownerVerified', (d) => {
      isOwner = d.isOwner;
      userPoints = d.points;
      document.getElementById('pts-val').innerText = userPoints;
      if (isOwner) document.getElementById('owner-badge').classList.remove('hidden');
      if (d.isVIP) document.getElementById('vip-badge').classList.remove('hidden');
    });

    // 🕹️ സുഗമമായ അനലോഗ് ജോയ്സ്റ്റിക്ക് കൺട്രോൾ
    let moveX = 0, moveZ = 0;
    const jBase = document.getElementById('joystick-base');
    const jStick = document.getElementById('joystick-stick');
    const center = { x: 55, y: 55 };

    function touchHandler(cx, cy) {
      const b = jBase.getBoundingClientRect();
      let dx = cx - b.left - center.x;
      let dy = cy - b.top - center.y;
      const dist = Math.hypot(dx, dy);
      const maxR = 35;
      if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
      jStick.style.left = `${center.x + dx - 20}px`;
      jStick.style.top = `${center.y + dy - 20}px`;
      moveX = dx / maxR;
      moveZ = dy / maxR;
    }

    const clearTouch = () => { jStick.style.left = '35px'; jStick.style.top = '35px'; moveX = 0; moveZ = 0; };
    jBase.addEventListener('touchstart', (e) => { e.preventDefault(); touchHandler(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });
    jBase.addEventListener('touchmove', (e) => { e.preventDefault(); touchHandler(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });
    jBase.addEventListener('touchend', clearTouch);
    jBase.addEventListener('touchcancel', clearTouch);

    // മോഡൽ കൺട്രോൾസ്
    window.openBox = (id) => document.getElementById(id).classList.remove('hidden');
    window.closeBox = (id) => document.getElementById(id).classList.add('hidden');

    window.setCharGender = (g) => { myGender = g; renderAvatar(); };
    window.setCharColor = (c) => { myColor = c; renderAvatar(); };

    window.joinServer = (key, name) => {
      closeBox('server-box');
      socket.emit('switchRegionServer', key);
      alert(`🌍 Joined ${name} Server!`);
    };

    window.mountRide = (type) => {
      activeRide = type;
      closeBox('rides-box');
      if (type === 'car') player.position.set(car.position.x, 1.2, car.position.z);
      else if (type === 'bike') player.position.set(bike.position.x, 1.2, bike.position.z);
      else if (type === 'kong') player.position.set(kong.position.x, 9, kong.position.z);
      else if (type === 'godzilla') player.position.set(godzilla.position.x, 10.5, godzilla.position.z);
      else if (type === 'heli') player.position.y = 25;
      else player.position.y = 0;
    };

    // ⭐ ഒഫീഷ്യൽ Telegram Stars പേയ്‌‌മെന്റ്
    window.buyStarItem = (title, desc, stars, type) => {
      closeBox('stars-box');
      socket.emit('requestOfficialInvoice', { title, description: desc, stars, type });
    };

    socket.on('openTelegramInvoiceWindow', (d) => {
      if (tg?.openInvoice) tg.openInvoice(d.invoiceUrl, (st) => { if (st === 'paid') alert("⭐ Stars Paid Successfully!"); });
      else window.open(d.invoiceUrl, '_blank');
    });

    socket.on('vipUnlocked', () => {
      document.getElementById('vip-badge').classList.remove('hidden');
      alert("👑 VIP Pass Active! All rides and features unlocked.");
    });

    // 🎙️ ലൈവ് മൈക്ക് (Stage Mic)
    let micLive = false, mediaRec = null, streamObj = null;
    window.toggleStageMic = async () => {
      const btn = document.getElementById('stage-mic-btn');
      if (!micLive) {
        try {
          streamObj = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRec = new MediaRecorder(streamObj);
          mediaRec.ondataavailable = (e) => {
            if (e.data.size > 0 && micLive) {
              const r = new FileReader();
              r.onload = () => socket.emit('streamSingerAudio', r.result);
              r.readAsDataURL(e.data);
            }
          };
          mediaRec.start(250);
          micLive = true;
          btn.innerText = "🛑 Stop Singing";
          btn.style.background = "#475569";
          alert("🎙️ മൈക്ക് ഓൺ ആയി! നിങ്ങൾ പാടുന്നത് എല്ലാവരും ലൈവായി കേൾക്കും.");
        } catch (err) { alert("Mic Permission Denied: " + err.message); }
      } else {
        micLive = false;
        if (mediaRec) mediaRec.stop();
        if (streamObj) streamObj.getTracks().forEach(t => t.stop());
        btn.innerText = "🎙️ Start Singing (Live Mic)";
        btn.style.background = "#ef4444";
      }
    };
    socket.on('playLiveSingerVoice', (d) => new Audio(d.audio).play().catch(() => {}));

    // കോൺസേർട്ട് മ്യൂസിക്
    let stageAudio = new Audio();
    window.playStageTrack = (url, title) => {
      closeBox('stage-box');
      socket.emit('syncStageTrack', url);
      alert(`🎶 Playing "${title}" on Concert Stage!`);
    };
    socket.on('playConcertTrackForAll', (d) => {
      stageAudio.src = d.url;
      stageAudio.play().catch(() => {});
    });

    // ഫ്രണ്ട്സ് & പ്രൊപ്പോസൽ
    window.addFriendNearby = () => { closeBox('friends-box'); alert("🤝 Player added as Friend!"); };
    window.proposeWithFireworks = () => {
      closeBox('friends-box');
      socket.emit('proposeInGame');
      alert("💍 Marriage Proposal Sent! Fireworks across the sky! 🎆");
    };

    // സെൽഫി
    window.takeInstantSelfie = function() {
      document.getElementById('ui-layer').style.display = 'none';
      setTimeout(() => {
        const dataUrl = renderer.domElement.toDataURL("image/png");
        const link = document.createElement('a');
        link.download = `globevibe-selfie.png`;
        link.href = dataUrl;
        link.click();
        document.getElementById('ui-layer').style.display = 'flex';
      }, 200);
    };

    // ഗ്രൂപ്പ് ചാറ്റ്
    window.postChat = () => {
      const f = document.getElementById('chat-txt');
      if (f.value.trim()) { socket.emit('sendGroupChatMsg', { text: f.value.trim() }); f.value = ''; }
    };
    window.putEmoji = (em) => { document.getElementById('chat-txt').value += em; };
    socket.on('broadcastChatMessage', (d) => {
      const c = document.getElementById('chat-content');
      c.innerHTML += `<div><strong>${d.isOwner ? '👑 ' : (d.isVIP ? '⭐ ' : '')}${d.sender}:</strong> ${d.text}</div>`;
      c.scrollTop = c.scrollHeight;
    });
    socket.on('incomingSystemChat', (d) => {
      const c = document.getElementById('chat-content');
      c.innerHTML += `<div style="color:#38bdf8;"><em>${d.text}</em></div>`;
      c.scrollTop = c.scrollHeight;
    });

    // ആനിമേഷൻ ലൂപ്പ്
    let wCycle = 0;
    function animate() {
      requestAnimationFrame(animate);

      const spd = ['kong', 'godzilla'].includes(activeRide) ? 0.65 : (['car', 'bike'].includes(activeRide) ? 0.8 : 0.4);

      if (moveX !== 0 || moveZ !== 0) {
        player.position.x += moveX * spd;
        player.position.z += moveZ * spd;
        player.rotation.y = Math.atan2(moveX, moveZ);

        wCycle += 0.2;
        if (player.userData.lLeg) {
          player.userData.lLeg.rotation.x = Math.sin(wCycle) * 0.6;
          player.userData.rLeg.rotation.x = -Math.sin(wCycle) * 0.6;
        }

        if (activeRide === 'car') car.position.set(player.position.x, 0, player.position.z);
        if (activeRide === 'bike') bike.position.set(player.position.x, 0, player.position.z);
        if (activeRide === 'kong') kong.position.set(player.position.x, 0, player.position.z);
        if (activeRide === 'godzilla') godzilla.position.set(player.position.x, 0, player.position.z);

        socket.emit('updatePosition', { x: player.position.x, y: player.position.y, z: player.position.z });
      }

      // കോയിൻസ് കറങ്ങുന്നതും കളക്റ്റ് ചെയ്യുന്നതും
      coins.forEach(coin => {
        coin.rotation.y += 0.05;
        if (coin.visible && player.position.distanceTo(coin.position) < 2.5) {
          coin.visible = false;
          userPoints += 10;
          document.getElementById('pts-val').innerText = userPoints;
        }
      });

      camera.position.x = player.position.x;
      camera.position.y = player.position.y + 7;
      camera.position.z = player.position.z + 12;
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
