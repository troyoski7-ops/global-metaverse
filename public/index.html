  <script>
    const socket = io();
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let playerName = tg?.initDataUnsafe?.user?.first_name || "GOKUL";
    document.getElementById('username-input').value = playerName;

    // --- Social Sharing & Invite Link System ---
    function shareSocial(type) {
      const shareUrl = window.location.href;
      const shareText = `🔥 Hey, join me in the GlobeVibe Ultra 3D Metaverse! Ride dragons, drift sports cars, and hang out: ${shareUrl}`;

      if (type === 'whatsapp') {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
      } else if (type === 'telegram') {
        window.open(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent('Join my 3D World!')}`, '_blank');
      } else if (type === 'instagram') {
        navigator.clipboard.writeText(shareUrl);
        alert("📸 Link copied! Paste it in your Instagram Bio or Direct Messages.");
      } else if (type === 'copy') {
        navigator.clipboard.writeText(shareUrl);
        alert("✅ World invite link copied to clipboard!");
      }
    }

    // --- Web Audio Synthesizer & Real-Time Mic Loopback ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioContext();

    function playSound(type) {
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);
      const now = actx.currentTime;

      if (type === 'jump') {
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'engine') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(65, now);
        osc.frequency.linearRampToValueAtTime(140, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'splash') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'kick') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'goal') {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.1);
        osc.frequency.setValueAtTime(659.25, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'swish') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'checkpoint') {
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);

    function loadGLBNormalized(file, targetHeight, onLoad) {
      const run = (gltf) => {
        const root = gltf.scene;
        root.traverse(c => {
          if (c.isMesh) {
            c.castShadow = true; c.receiveShadow = true;
            if (c.material) { c.material.metalness = c.material.metalness ?? 0.15; c.material.roughness = c.material.roughness ?? 0.6; }
          }
        });
        const bbox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        bbox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0 && targetHeight) {
          const factor = targetHeight / maxDim;
          root.scale.set(factor, factor, factor);
        }
        onLoad(root);
      };
      gltfLoader.load(file, run, undefined, () => gltfLoader.load('/' + file, run));
    }

        document.getElementById('dismount-btn').innerText = "🚪 Dismount";
        document.getElementById('speedo').style.display = 'block';
        document.getElementById('jump-btn').style.display = (activeMount === 'skate') ? 'flex' : 'none';
      }
    };

    window.dismountAll = () => {
      if (isClimbing) {
        isClimbing = false;
        document.getElementById('stamina-box').style.display = 'none';
        document.getElementById('dismount-btn').style.display = 'none';
        myPlayer.position.copy(mountainBasePos);
        return;
      }
      if (isSittingAudience) {
        isSittingAudience = false;
        myPlayer.position.z += 1.2;
        document.getElementById('dismount-btn').style.display = 'none';
        return;
      }

      if (activeMountData) {
        myPlayer.add(playerAvatar);
        playerAvatar.position.set(0, 0, 0);
        myPlayer.position.set(activeMountData.mesh.position.x + 3, 1.2, activeMountData.mesh.position.z);
      }

      activeMount = 'walk';
      activeMountData = null;
      vSpeed = 0; vAltitude = 0;
      flyUpBtn.style.display = 'none';
      document.getElementById('vehicle-pedals').style.display = 'none';
      document.getElementById('dismount-btn').style.display = 'none';
      document.getElementById('speedo').style.display = 'none';
      document.getElementById('jump-btn').style.display = 'flex';
    };

    window.playerJump = () => {
      if (activeMount === 'skate') {
        playSound('jump');
        skateEntity.position.y = 2.4;
        skateEntity.rotation.z += Math.PI * 2; // Ollie 360 Flip
        setTimeout(() => { skateEntity.position.y = 1.05; skateEntity.rotation.z = 0; }, 300);
      } else if (myPlayer.position.y <= 1.3 && activeMount === 'walk') {
        myPlayer.position.y = 3.2;
        playSound('jump');
      }
    };

    window.teleportTo = (x, y, z) => {
      if (activeMount !== 'walk' || isSittingAudience || isClimbing) window.dismountAll();
      myPlayer.position.set(x, y, z);
      document.getElementById('drawer-menu').style.display = 'none';
    };

    // Chat
    let chatTab = 'group';
    window.switchChat = t => {
      chatTab = t;
      document.getElementById('tab-group').classList.toggle('active', t === 'group');
      document.getElementById('tab-private').classList.toggle('active', t === 'private');
    };
    function sendChatMessage() {
      const inp = document.getElementById('chat-input');
      if (!inp.value.trim()) return;
      socket.emit('chatMessage', { sender: playerName, text: inp.value.trim(), isPrivate: chatTab === 'private' });
      inp.value = '';
    }
    socket.emit('joinGame', { name: playerName });
    socket.on('initWorld', d => document.getElementById('online-count').innerText = d.count);
    socket.on('playerJoined', d => document.getElementById('online-count').innerText = d.count);
    socket.on('playerLeft', d => document.getElementById('online-count').innerText = d.count);
    socket.on('groupMessage', d => appendChat(d.sender, d.text));
    socket.on('privateMessage', d => appendChat(`[Private] ${d.sender}`, d.text));
    function appendChat(s, t) {
      const box = document.getElementById('chat-messages');
      const m = document.createElement('div');
      m.className = 'chat-msg'; m.innerHTML = `<b>${s}:</b> ${t}`;
      box.appendChild(m); box.scrollTop = box.scrollHeight;
    }

    // ========================================================
    // 10. MAIN PHYSICS & ANIMATION ENGINE LOOP
    // ========================================================
    const raycaster = new THREE.Raycaster();
    const downVec = new THREE.Vector3(0, -1, 0);
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      checkInteractions();

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Sea Waves Animation
      const count = seaPosAttr.count;
      for (let i = 0; i < count; i++) {
        const u = seaPosAttr.getX(i);
        const v = seaPosAttr.getZ(i);
        seaPosAttr.setY(i, Math.sin(u * 0.05 + time * 1.5) * Math.cos(v * 0.05 + time * 1.5) * 0.3);
      }
      seaPosAttr.needsUpdate = true;

      // Marine Animals
      if (whaleMesh) whaleMesh.position.x = -80 + Math.sin(time * 0.8) * 12;
      if (sharkMesh) sharkMesh.position.z = 130 + Math.cos(time * 0.8) * 10;

      // Dinosaur & Dragon Dynamic Life Cycles (Head bobbing, tail movement)
      dinoEntity.position.y = 1.2 + Math.sin(time * 3.0) * 0.06;
      dinoEntity.rotation.y += Math.sin(time * 0.8) * 0.003;
      dragonEntity.position.y = 1.5 + Math.sin(time * 2.5) * 0.15; // Wing hovering
      dragonEntity.rotation.z = Math.sin(time * 2.0) * 0.05;

      // Football Rolling Physics & Kick Detection
      fballMesh.position.add(fballVelocity);
      fballVelocity.multiplyScalar(0.96);
      if (myPlayer.position.distanceTo(fballMesh.position) < 1.2 && activeMount === 'walk') {
        playSound('kick');
        const kickDir = new THREE.Vector3().subVectors(fballMesh.position, myPlayer.position).normalize();
        fballVelocity.copy(kickDir.multiplyScalar(0.6));
      }
      if (fballMesh.position.z < -52 && Math.abs(fballMesh.position.x + 55) < 6) {
        playSound('goal');
        currentScore.goals += 1;
        currentScore.stars += 10;
        updateScores();
        fballMesh.position.set(-55, 1.4, -20);
        fballVelocity.set(0, 0, 0);
      }

      // Mountain Climbing Loop
      if (isClimbing) {
        climbStamina = Math.max(0, climbStamina - 0.15);
        document.getElementById('stamina-fill').style.width = `${climbStamina}%`;
        if (climbStamina <= 0) { window.dismountAll(); }
        else {
          myPlayer.position.lerp(mountainPeakPos, 0.004);
          if (myPlayer.position.distanceTo(mountainPeakPos) < 2.0) {
            alert("🚩 YOU CONQUERED THE PEAK! +50 STARS ⭐");
            currentScore.stars += 50;
            updateScores();
            window.dismountAll();
          }
        }
      }

      // Walking Movement & Ground Raycast
      if (activeMount === 'walk' && !isSittingAudience && !isClimbing) {
        if (moveX !== 0 || moveZ !== 0) {
          const fx = moveX * Math.cos(camAngleX) + moveZ * Math.sin(camAngleX);
          const fz = -moveX * Math.sin(camAngleX) + moveZ * Math.cos(camAngleX);
          myPlayer.position.x += fx * 0.45;
          myPlayer.position.z += fz * 0.45;
          myPlayer.rotation.y = Math.atan2(fx, fz);
        }

        raycaster.set(new THREE.Vector3(myPlayer.position.x, myPlayer.position.y + 2.0, myPlayer.position.z), downVec);
        const hits = raycaster.intersectObjects(colliderMeshes, true);
        if (hits.length > 0) {
          const targetY = hits[0].point.y + 1.2;
          myPlayer.position.y = Math.max(targetY, myPlayer.position.y - 0.15);
        } else {
          myPlayer.position.y = Math.max(-0.6, myPlayer.position.y - 0.15);
        }
      }

      // Universal Mount Engine Loop (Vehicle Dynamics)
      if (activeMountData) {
        const ent = activeMountData.mesh;
        const maxSpd = activeMountData.speed;

        if (isGasPressed) { vSpeed = Math.min(vSpeed + 0.06, maxSpd); playSound('engine'); }
        else if (isBrakePressed) { vSpeed = Math.max(vSpeed - 0.06, -0.6); }
        else { vSpeed *= 0.95; }

        if (activeMountData.isFlying) {
          if (isAscendPressed) vAltitude = Math.min(vAltitude + 0.35, 180);
          else vAltitude = Math.max(vAltitude - 0.06, 0);
          ent.position.y = 1.2 + vAltitude;
        }

        // Turning & Dynamic Tilting (Skate lean & car steering)
        ent.rotation.y -= moveX * 0.04;
        if (activeMount === 'skate') {
          ent.rotation.z = -moveX * 0.2; // Realistic Body/Board Lean
        } else if (activeMount === 'car') {
          ent.rotation.z = -moveX * 0.08; // Suspension drift tilt
        }

        const nextX = ent.position.x + Math.sin(ent.rotation.y) * vSpeed;
        const nextZ = ent.position.z + Math.cos(ent.rotation.y) * vSpeed;

        const targetZone = isWaterZone(nextX, nextZ);
        if (activeMountData.waterOnly && targetZone === 'land') {
          vSpeed = 0;
        } else {
          ent.position.x = nextX;
          ent.position.z = nextZ;
        }

        // Racing Circuit Checkpoint Tracking
        if (activeMount === 'car') {
          currentScore.lapTime += delta;
          const cpPos = raceCheckpoints[currentScore.checkpoint];
          if (ent.position.distanceTo(cpPos) < 12) {
            playSound('checkpoint');
            currentScore.checkpoint++;
            if (currentScore.checkpoint >= raceCheckpoints.length) {
              currentScore.checkpoint = 0;
              currentScore.lap++;
              if (currentScore.lap > 3) currentScore.lap = 1;
            }
          }
          const mins = Math.floor(currentScore.lapTime / 60);
          const secs = Math.floor(currentScore.lapTime % 60);
          document.getElementById('hud-lap').innerText = `LAP ${currentScore.lap}/3 (${mins}:${secs < 10 ? '0' : ''}${secs})`;
        }

        myPlayer.position.copy(ent.position);
        document.getElementById('speedo').innerText = `${Math.abs(Math.round(vSpeed * 50))} KM/H`;
      }

      // Camera Follow
      const target = activeMount === 'walk' ? myPlayer.position : (activeMountData ? activeMountData.mesh.position : myPlayer.position);
      const camDist = 18;
      camera.position.x = target.x + Math.sin(camAngleX) * camDist * Math.cos(camAngleY);
      camera.position.y = target.y + 6 + Math.sin(camAngleY) * camDist;
      camera.position.z = target.z + Math.cos(camAngleX) * camDist * Math.cos(camAngleY);
      camera.lookAt(target.x, target.y + 1.5, target.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
