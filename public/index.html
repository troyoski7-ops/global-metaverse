<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobeVibe Metaverse GTA</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top HUD Elements */
    .top-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 40; pointer-events: none; }
    .top-bar * { pointer-events: auto; }
    .hud-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .badges-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; gap: 5px; }
    .badge.stars { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
    .badge.btn-interactive { cursor: pointer; transition: 0.2s; }
    .badge.btn-interactive:active { transform: scale(0.95); }

    .comm-btns { display: flex; gap: 6px; }
    .btn-circle { width: 38px; height: 38px; border-radius: 50%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1.5px solid rgba(255,255,255,0.2); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
    .btn-circle.active { background: #22c55e; border-color: #4ade80; box-shadow: 0 0 12px #22c55e; }

    /* Scoreboard */
    #score-hud { position: absolute; top: 85px; left: 8px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid #38bdf8; border-radius: 12px; padding: 8px 12px; color: #fff; font-size: 11px; font-weight: 700; z-index: 30; }
    .score-line { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 2px; }
    .score-val { color: #38bdf8; font-family: monospace; font-size: 12px; }

    /* Floating Interaction Buttons */
    #action-btn { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); background: #0284c7; color: #fff; border: 2px solid #fff; padding: 12px 26px; border-radius: 30px; font-size: 13px; font-weight: 900; display: none; z-index: 35; box-shadow: 0 4px 15px rgba(2,132,199,0.6); }
    #dismount-btn { position: absolute; top: 85px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; border: 1.5px solid #fff; padding: 6px 18px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 40; }
    #speedo { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); color: #38bdf8; border: 1px solid #38bdf8; padding: 5px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 35; }

    /* Mobile Controls */
    #joy-base { position: absolute; left: 16px; bottom: 25px; width: 95px; height: 95px; background: rgba(15, 23, 42, 0.6); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); z-index: 30; }
    #joy-stick { position: absolute; left: 30px; top: 30px; width: 35px; height: 35px; background: #38bdf8; border-radius: 50%; pointer-events: none; }
    #jump-btn { position: absolute; bottom: 40px; right: 20px; width: 64px; height: 64px; border-radius: 50%; background: rgba(15, 23, 42, 0.85); border: 2px solid #38bdf8; color: #fff; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; z-index: 35; }

    .vehicle-pedals { position: absolute; bottom: 30px; right: 20px; display: none; flex-direction: column; gap: 8px; z-index: 35; }
    .pedal { width: 68px; height: 44px; border-radius: 12px; border: 1.5px solid #fff; color: #fff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    #pedal-gas { background: #22c55e; }
    #pedal-brake { background: #ef4444; }
    #pedal-fly { background: #8b5cf6; display: none; }

    /* Live Chat */
    #chat-box { position: absolute; bottom: 20px; left: 120px; width: 190px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); padding: 6px; z-index: 30; }
    #chat-msgs { height: 48px; overflow-y: auto; font-size: 10px; color: #fff; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
    .chat-bubble { background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; word-break: break-all; }
    .chat-controls { display: flex; gap: 4px; }
    #chat-in { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #fff; font-size: 10px; padding: 2px 4px; }
    #chat-send { background: #0284c7; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

    /* Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-card { background: #0f172a; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 18px; width: 310px; color: #fff; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto; }
    .modal-card h3 { font-size: 16px; color: #38bdf8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-action { background: #1e293b; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-action.primary { background: #0284c7; border-color: #38bdf8; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="hud-row">
      <div class="badges-group">
        <div class="badge stars">⭐ <span id="hud-stars">0</span> STARS</div>
        <div class="badge btn-interactive" onclick="openModal('room-modal')">🚪 <span id="hud-room">Global</span></div>
        <div class="badge">🟢 <span id="hud-online">1</span> Online</div>
      </div>
      <div class="comm-btns">
        <button id="btn-prox-mic" class="btn-circle" onclick="toggleProximityMic()" title="Proximity Mic">🎙</button>
        <button id="btn-glob-mic" class="btn-circle" onclick="toggleGlobalMic()" title="Global Mic">📢</button>
        <button class="btn-circle" onclick="openModal('menu-modal')">☰</button>
      </div>
    </div>
    <div class="hud-row">
      <div class="badges-group">
        <div class="badge btn-interactive" onclick="openModal('lang-modal')">🌐 <span id="hud-lang">English</span></div>
        <div class="badge btn-interactive" onclick="openModal('weather-modal')">⛅ <span id="hud-weather">Sunny</span></div>
        <div class="badge btn-interactive" onclick="openModal('profile-modal')">👤 <span id="hud-player">Player</span></div>
      </div>
    </div>
  </div>

  <!-- Scoreboard -->
  <div id="score-hud">
    <div class="score-line"><span>⚽ Penalty Goals:</span><span id="score-goals" class="score-val">0</span></div>
    <div class="score-line"><span>🏀 Baskets:</span><span id="score-baskets" class="score-val">0</span></div>
    <div class="score-line"><span>🏎️ Track Lap:</span><span id="score-lap" class="score-val">1/3</span></div>
  </div>

  <!-- Controls & Interactions -->
  <div id="speedo">0 KM/H</div>
  <button id="action-btn" onclick="executeInteraction()">ACTION</button>
  <button id="dismount-btn" onclick="exitSeatOrVehicle()">🚪 EXIT</button>
  <button id="jump-btn" onclick="triggerJump()">JUMP</button>

  <div class="vehicle-pedals" id="vehicle-pedals">
    <button id="pedal-fly" class="pedal">FLY ⬆</button>
    <button id="pedal-gas" class="pedal">GAS 🏎</button>
    <button id="pedal-brake" class="pedal">BRAKE 🛑</button>
  </div>

  <div id="joy-base"><div id="joy-stick"></div></div>

  <!-- Live Chat -->
  <div id="chat-box">
    <div id="chat-msgs"><div class="chat-bubble"><b>System:</b> Connected to Global Island!</div></div>
    <div class="chat-controls">
      <input type="text" id="chat-in" placeholder="Chat..." maxlength="45">
      <button id="chat-send" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <!-- 1. Room Modal -->
  <div id="room-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>🚪 Room Management</h3>
      <input type="text" id="room-input" class="btn-action" style="text-align:left; background:#000;" placeholder="Enter Custom Room Name">
      <div class="grid-btns">
        <button class="btn-action primary" onclick="joinRoomFromInput()">Join / Create</button>
        <button class="btn-action" onclick="resetToGlobal()">Global Server</button>
      </div>
      <button class="btn-action" onclick="closeModal('room-modal')">Close</button>
    </div>
  </div>

  <!-- 2. Language Modal (11 Languages) -->
  <div id="lang-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>🌐 Select Language</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="setLanguage('en')">English</button>
        <button class="btn-action" onclick="setLanguage('ml')">മലയാളം</button>
        <button class="btn-action" onclick="setLanguage('hi')">हिन्दी</button>
        <button class="btn-action" onclick="setLanguage('fa')">فارسی</button>
        <button class="btn-action" onclick="setLanguage('id')">Indonesian</button>
        <button class="btn-action" onclick="setLanguage('ru')">Русский</button>
        <button class="btn-action" onclick="setLanguage('it')">Italiano</button>
        <button class="btn-action" onclick="setLanguage('uz')">O'zbek</button>
        <button class="btn-action" onclick="setLanguage('tg')">Тоҷикӣ</button>
        <button class="btn-action" onclick="setLanguage('my')">မြန်မာ</button>
        <button class="btn-action" onclick="setLanguage('zh')">中文</button>
      </div>
      <button class="btn-action" onclick="closeModal('lang-modal')">Close</button>
    </div>
  </div>

  <!-- 3. Profile & Share Modal -->
  <div id="profile-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>👤 Profile & Avatar</h3>
      <input type="text" id="player-name-in" class="btn-action" style="text-align:left; background:#000;" placeholder="Your Name">
      <button class="btn-action primary" onclick="updatePlayerName()">Save Name</button>
      <div class="grid-btns">
        <button class="btn-action" onclick="selectGender('man')">Boy (Man)</button>
        <button class="btn-action" onclick="selectGender('girl')">Girl</button>
      </div>
      <h3 style="margin-top:5px;">🔗 Share Game Link</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="shareSocial('wa')">WhatsApp</button>
        <button class="btn-action" onclick="shareSocial('tg')">Telegram</button>
        <button class="btn-action" onclick="shareSocial('ig')">Instagram</button>
        <button class="btn-action" onclick="shareSocial('copy')">Copy Link</button>
      </div>
      <button class="btn-action" onclick="closeModal('profile-modal')">Close</button>
    </div>
  </div>

  <!-- 4. Weather Modal -->
  <div id="weather-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>⛅ Environmental Weather</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="applyWeather('sunny')">☀️ Sunny</button>
        <button class="btn-action" onclick="applyWeather('sunset')">🌅 Sunset</button>
        <button class="btn-action" onclick="applyWeather('storm')">⛈️ Storm</button>
        <button class="btn-action" onclick="applyWeather('night')">🌙 Night</button>
      </div>
      <button class="btn-action" onclick="closeModal('weather-modal')">Close</button>
    </div>
  </div>

  <!-- 5. Navigation Menu Modal -->
  <div id="menu-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>📍 Island Teleport Locations</h3>
      <div class="grid-btns">
        <button class="btn-action" onclick="teleportPlayer(0, 1.2, 0)">City Center</button>
        <button class="btn-action" onclick="teleportPlayer(45, 1.2, 0)">Race Circuit</button>
        <button class="btn-action" onclick="teleportPlayer(-40, 1.2, -30)">Football Stadium</button>
        <button class="btn-action" onclick="teleportPlayer(30, 1.2, -25)">Concert Stage</button>
        <button class="btn-action" onclick="teleportPlayer(0, 1.2, 60)">Harbor Dock</button>
        <button class="btn-action" onclick="teleportPlayer(-35, 1.2, 25)">Dino Safari</button>
      </div>
      <button class="btn-action" onclick="closeModal('menu-modal')">Close</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // SECTION 1: GLOBAL STATE, AUDIO & LOCALIZATION
    // =========================================================================
    const socket = io();
    let currentRoom = "Global";
    let myPlayerId = null;
    let playerName = "Player_" + Math.floor(Math.random() * 899 + 100);
    let selectedGender = "man";
    let starsCount = 100;
    let penaltyGoals = 0, basketsCount = 0, currentLap = 1;

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    const translations = {
      en: { room: "Room", online: "Online", goals: "Penalty Goals", baskets: "Baskets", lap: "Track Lap", jump: "JUMP", drive: "DRIVE CAR", kick: "PENALTY KICK", basket: "SHOOT BASKET", sit: "SIT DOWN", exit: "EXIT", skate: "SKATEBOARD", ride: "RIDE" },
      ml: { room: "റൂം", online: "ഓൺലൈൻ", goals: "പെനാൽറ്റി ഗോൾ", baskets: "ബാസ്‌ക്കറ്റ്", lap: "ട്രാക്ക് ലാപ്", jump: "ചാടുക", drive: "കാർ ഓടിക്കുക", kick: "പെനാൽറ്റി കിക്ക്", basket: "ബാസ്കറ്റ് എറിയുക", sit: "ഇരിക്കുക", exit: "ഇറങ്ങുക", skate: "സ്കേറ്റ്ബോർഡ്", ride: "കയറുക" },
      hi: { room: "कमरा", online: "ऑनलाइन", goals: "पेनाल्टी गोल", baskets: "बास्केट", lap: "ट्रैक लैप", jump: "कूदें", drive: "कार चलाएं", kick: "पेनाल्टी किक", basket: "बास्केट मारें", sit: "बैठें", exit: "उतरें", skate: "स्केटबोर्ड", ride: "सवारी करें" },
      fa: { room: "اتاق", online: "آنلاین", goals: "گل پنالتی", baskets: "سبدها", lap: "دور پیست", jump: "پرش", drive: "رانندگی", kick: "ضربه پنالتی", basket: "پرتاب توپ", sit: "نشستن", exit: "خروج", skate: "اسکیت", ride: "سوار شدن" },
      id: { room: "Ruang", online: "Online", goals: "Gol Penalti", baskets: "Keranjang", lap: "Putaran", jump: "LOMPAT", drive: "SETIR MOBIL", kick: "TENDANGAN", basket: "LEMPAR BOLA", sit: "DUDUK", exit: "KELUAR", skate: "SKATEBOARD", ride: "NAIK" },
      ru: { room: "Комната", online: "Онлайн", goals: "Пенальти", baskets: "Корзины", lap: "Круг", jump: "ПРЫЖОК", drive: "ВЕСТИ МАШИНУ", kick: "УДАР", basket: "БРОСОК", sit: "СЕСТЬ", exit: "ВЫЙТИ", skate: "СКЕЙТ", ride: "ЕХАТЬ" },
      it: { room: "Stanza", online: "Online", goals: "Rigori", baskets: "Canestri", lap: "Giro", jump: "SALTO", drive: "GUIDA", kick: "RIGORE", basket: "CANESTRO", sit: "SIEDITI", exit: "ESCI", skate: "SKATE", ride: "SALI" },
      uz: { room: "Xona", online: "Onlayn", goals: "Penalti Gollar", baskets: "Savatlar", lap: "Aylanish", jump: "SAKRASH", drive: "HAYDASH", kick: "TEPISH", basket: "TO'P OTISH", sit: "O'TIRISH", exit: "CHIQISH", skate: "SKEYT", ride: "MINISH" },
      tg: { room: "Ҳуҷра", online: "Онлайн", goals: "Голҳои пеналтӣ", baskets: "Сабадҳо", lap: "Давра", jump: "ҶАҲИДАН", drive: "РОНДАН", kick: "ЗАРБА", basket: "АНДОХТАН", sit: "НИШАСТАН", exit: "БАРОМАДАН", skate: "СКЕЙТ", ride: "САВОР ШУДАН" },
      my: { room: "အခန်း", online: "လိုင်းပေါ်", goals: "ပင်နယ်တီဂိုး", baskets: "ဘတ်စကက်", lap: "ပတ်လမ်း", jump: "ခုန်ပါ", drive: "ကားမောင်း", kick: "ကန်သွင်း", basket: "ပစ်သွင်း", sit: "ထိုင်ပါ", exit: "ထွက်ပါ", skate: "စကိတ်", ride: "စီးပါ" },
      zh: { room: "房间", online: "在线", goals: "点球进球", baskets: "投篮", lap: "圈数", jump: "跳跃", drive: "驾驶赛车", kick: "点球射门", basket: "投篮得分", sit: "坐下", exit: "离开", skate: "滑板", ride: "骑乘" }
    };
    let currentLang = 'en';

    window.setLanguage = (lang) => {
      currentLang = lang;
      const t = translations[lang] || translations.en;
      document.getElementById('hud-lang').innerText = lang.toUpperCase();
      document.getElementById('jump-btn').innerText = t.jump;
      closeModal('lang-modal');
    };

    // Live Web Audio Synthesizer (No external asset dependency)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioContext();

    function playSfx(type) {
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);
      const now = actx.currentTime;

      if (type === 'kick') {
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'goal') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.15);
        osc.frequency.setValueAtTime(783.99, now + 0.3);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
      } else if (type === 'swish') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'engine') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(65, now);
        osc.frequency.linearRampToValueAtTime(120, now + 0.2);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'roar') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(90, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.8);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      }
    }

    // Voice Networking (Proximity vs Global)
    let isProxMic = false, isGlobMic = false;
    let localStream = null;

    async function getMicStream() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
      return localStream;
    }

    window.toggleProximityMic = async () => {
      const btn = document.getElementById('btn-prox-mic');
      if (!isProxMic) {
        try {
          await getMicStream();
          isProxMic = true;
          btn.classList.add('active');
          if (isGlobMic) window.toggleGlobalMic();
        } catch(e) { alert("Microphone access denied!"); }
      } else {
        isProxMic = false;
        btn.classList.remove('active');
      }
    };

    window.toggleGlobalMic = async () => {
      const btn = document.getElementById('btn-glob-mic');
      if (!isGlobMic) {
        try {
          await getMicStream();
          isGlobMic = true;
          btn.classList.add('active');
          if (isProxMic) window.toggleProximityMic();
        } catch(e) { alert("Microphone access denied!"); }
      } else {
        isGlobMic = false;
        btn.classList.remove('active');
      }
    };

    // Social Sharing
    window.shareSocial = (platform) => {
      const url = window.location.href;
      const msg = encodeURIComponent("Join me in GlobeVibe GTA Island Metaverse!");
      if (platform === 'wa') window.open(`https://api.whatsapp.com/send?text=${msg}%20${url}`);
      else if (platform === 'tg') window.open(`https://t.me/share/url?url=${url}&text=${msg}`);
      else if (platform === 'ig') { navigator.clipboard.writeText(url); alert("Link copied for Instagram Bio/Story!"); }
      else if (platform === 'copy') { navigator.clipboard.writeText(url); alert("Game link copied to clipboard!"); }
      closeModal('profile-modal');
    };

    function loadGLBModel(file, targetSize, onLoad) {
      const process = (gltf) => {
        const root = gltf.scene;
        root.traverse(c => {
          if (c.isMesh) {
            c.castShadow = true;
            c.receiveShadow = true;
          }
        });
        const bbox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        bbox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0 && targetSize) {
          const factor = targetSize / maxDim;
          root.scale.setScalar(factor);
        }
        onLoad(root);
      };
      gltfLoader.load(file, process, undefined, () => {
        gltfLoader.load('/' + file, process, undefined, () => console.warn("Asset Missing: " + file));
      });
    }

      ctx.fillRect(0, 0, 256, 64);
      ctx.font = 'bold 28px sans-serif';
      ctx.fillStyle = '#38bdf8';
      ctx.textAlign = 'center';
      ctx.fillText(name, 128, 44);
      const tex = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));

    // Detection of Interactivity Zones

    function evaluateInteractions() {
      if (currentSeatState) { actBtn.style.display = 'none'; return; }
      const p = localPlayer.position;
      const t = translations[currentLang] || translations.en;

      // 1. Penalty Football Kick
      if (p.distanceTo(fBall.position) < 2.5) {
        targetedAction = { type: 'kick_penalty' };
        actBtn.innerText = t.kick; actBtn.style.display = 'block'; return;
      }

      // 2. Shoot Basketball
      if (p.distanceTo(bBall.position) < 3.0) {
        targetedAction = { type: 'shoot_basket' };
        actBtn.innerText = t.basket; actBtn.style.display = 'block'; return;
      }

      // 3. Mountain Climbing
      if (p.distanceTo(mountainPos) < 8.0) {
        targetedAction = { type: 'climb' };
        actBtn.innerText = "🧗 CLIMB PEAK"; actBtn.style.display = 'block'; return;
      }

      // 4. Multi-Passenger Vehicles
      for (let type in passengerRegistry) {
        const v = passengerRegistry[type];
        if (p.distanceTo(v.group.position) < (type === 'ship' ? 12 : 5.5)) {
          const isDriver = v.passengers.length === 0;
          targetedAction = { type: 'board_vehicle', vType: type, isDriver };
          actBtn.innerText = isDriver ? `${t.drive || 'DRIVE'} (${type.toUpperCase()})` : `RIDE AS PASSENGER (${v.passengers.length}/${v.maxSeats})`;
          actBtn.style.display = 'block'; return;
        }
      }

      // 5. Concert Benches
      for (let benchPos of audienceBenches) {
        if (p.distanceTo(benchPos) < 2.2) {
          targetedAction = { type: 'sit_concert', pos: benchPos };
          actBtn.innerText = t.sit; actBtn.style.display = 'block'; return;
        }
      }

      actBtn.style.display = 'none'; targetedAction = null;
    }

    window.executeInteraction = () => {
      if (!targetedAction) return;

      if (targetedAction.type === 'kick_penalty') {
        playSfx('kick');
        fBall.position.set(-45, 2.5, -52); // Ball into goal net
        setTimeout(() => {
          playSfx('goal');
          penaltyGoals++;
          starsCount += 10;
          document.getElementById('score-goals').innerText = penaltyGoals;
          document.getElementById('hud-stars').innerText = starsCount;
          fBall.position.set(-45, 1.2, -43);
        }, 500);
        return;
      }

      if (targetedAction.type === 'shoot_basket') {
        playSfx('swish');
        bBall.position.set(40, 4.0, -48);
        setTimeout(() => {
          playSfx('goal');
          basketsCount++;
          starsCount += 5;
          document.getElementById('score-baskets').innerText = basketsCount;
          document.getElementById('hud-stars').innerText = starsCount;
          bBall.position.set(40, 1.2, -38);
        }, 600);
        return;
      }

      if (targetedAction.type === 'climb') {
        isClimbing = true;
        document.getElementById('dismount-btn').style.display = 'block';
        return;
      }

      if (targetedAction.type === 'sit_concert') {
        currentSeatState = { type: 'bench' };
        localPlayer.position.copy(targetedAction.pos);
        localPlayer.position.y = 1.1;
        document.getElementById('dismount-btn').style.display = 'block';
        return;
      }

      if (targetedAction.type === 'board_vehicle') {
        const v = passengerRegistry[targetedAction.vType];
        const sIndex = v.passengers.length;
        if (sIndex >= v.maxSeats) { alert("Vehicle is Full!"); return; }

        v.passengers.push(myPlayerId);
        currentSeatState = { type: targetedAction.vType, isDriver: targetedAction.isDriver, seatIndex: sIndex };

        v.group.add(localAvatar);
        localAvatar.position.copy(v.offsets[sIndex] || new THREE.Vector3(0, 0.4, 0));

        if (targetedAction.isDriver) {
          document.getElementById('vehicle-pedals').style.display = 'flex';

        }
        document.getElementById('dismount-btn').style.display = 'block';
        document.getElementById('jump-btn').style.display = targetedAction.vType === 'skate' ? 'flex' : 'none';
      }
    };

    window.exitSeatOrVehicle = () => {
      if (isClimbing) { isClimbing = false; localPlayer.position.copy(mountainPos); document.getElementById('dismount-btn').style.display = 'none'; return; }

      if (currentSeatState.type === 'bench') {
        currentSeatState = null;
        localPlayer.position.z += 1.5;
        document.getElementById('dismount-btn').style.display = 'none';
        return;
      }

      const v = passengerRegistry[currentSeatState.type];
      if (v) {
        v.passengers = v.passengers.filter(id => id !== myPlayerId);
        localPlayer.add(localAvatar);
        localAvatar.position.set(0, 0, 0);
        localPlayer.position.set(v.group.position.x + 2.5, 1.0, v.group.position.z);
      }

      currentSeatState = null;
      vSpeed = 0; vAlt = 0;
      document.getElementById('vehicle-pedals').style.display = 'none';
      document.getElementById('speedo').style.display = 'none';
      document.getElementById('dismount-btn').style.display = 'none';
      document.getElementById('jump-btn').style.display = 'flex';
    };

    // =========================================================
    // SECTION 7: RENDER LOOP, DYNAMICS & CAMERA CONTROLS
    // =========================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      evaluateInteractions();

      const time = clock.getElapsedTime();

      // Ferris Wheel & Deep Sea Animals
      if (ferrisWheel) ferrisWheel.rotation.x += 0.004;
      if (whaleMesh) whaleMesh.position.x = -110 + Math.sin(time * 0.7) * 15;
      if (sharkMesh) sharkMesh.position.z = 90 + Math.cos(time * 0.8) * 12;

      // Godzilla Breathing Roar Animation (Stationary coastal guardian)
      if (godzillaMesh) {
        godzillaMesh.position.y = 1.0 + Math.sin(time * 2.0) * 0.08;
        godzillaMesh.rotation.y = Math.sin(time * 0.4) * 0.15;
      }

      // Mountain Climbing Interpolation
      if (isClimbing) {
        localPlayer.position.lerp(mountainPeak, 0.005);
        if (localPlayer.position.distanceTo(mountainPeak) < 2.0) {
          alert("🚩 Peak Conquered! +50 Stars");
          starsCount += 50; document.getElementById('hud-stars').innerText = starsCount;
          window.exitSeatOrVehicle();
        }
      }

      // On-Foot Movement (GTA Island Clamped)
      if (!currentSeatState && !isClimbing) {
        if (joyX !== 0 || joyZ !== 0) {
          const fx = joyX * Math.cos(camRotX) + joyZ * Math.sin(camRotX);
          const fz = -joyX * Math.sin(camRotX) + joyZ * Math.cos(camRotX);
          localPlayer.position.x += fx * 0.42;
          localPlayer.position.z += fz * 0.42;
          localPlayer.rotation.y = Math.atan2(fx, fz);

          // Prevent walking into deep sea (Radius: 78m)
          const dist = Math.hypot(localPlayer.position.x, localPlayer.position.z);
          if (dist > 78) {
            localPlayer.position.x = (localPlayer.position.x / dist) * 78;
            localPlayer.position.z = (localPlayer.position.z / dist) * 78;
          }

          socket.emit('playerMove', {
            room: currentRoom,
            x: localPlayer.position.x,
            y: localPlayer.position.y,
            z: localPlayer.position.z,
            rotY: localPlayer.rotation.y
          });
        }
        if (localPlayer.position.y > 1.0) localPlayer.position.y = Math.max(1.0, localPlayer.position.y - 0.1);
      }

      // Multi-Seat Vehicle Driver Physics
      if (currentSeatState && currentSeatState.isDriver) {
        const v = passengerRegistry[currentSeatState.type];
        const ent = v.group;

        if (isGas) { vSpeed = Math.min(vSpeed + 0.04, 1.8); playSfx('engine'); }
        else if (isBrake) { vSpeed = Math.max(vSpeed - 0.05, -0.4); }
        else { vSpeed *= 0.95; }

        if (isFly) { vAlt = Math.min(vAlt + 0.2, 50); ent.position.y = 1.1 + vAlt; }
        else if (vAlt > 0) { vAlt = Math.max(0, vAlt - 0.1); ent.position.y = 1.1 + vAlt; }

        ent.rotation.y -= joyX * 0.035;
        const nx = ent.position.x + Math.sin(ent.rotation.y) * vSpeed;
        const nz = ent.position.z + Math.cos(ent.rotation.y) * vSpeed;

        // Asphalt Track Restriction for Cars
        if (currentSeatState.type === 'car') {
          const cDist = Math.hypot(nx, nz);
          if (cDist >= 44 && cDist <= 62) {
            ent.position.x = nx; ent.position.z = nz;
          } else { vSpeed = 0; } // Hits boundary
        } else {
          ent.position.x = nx; ent.position.z = nz;
        }

        localPlayer.position.copy(ent.position);
        document.getElementById('speedo').innerText = `${Math.abs(Math.round(vSpeed * 60))} KM/H`;

        socket.emit('playerMove', {
          room: currentRoom,
          x: ent.position.x,
          y: ent.position.y,
          z: ent.position.z,
          rotY: ent.rotation.y
        });
      }

      // Camera Follow Target
      const activeObj = currentSeatState ? passengerRegistry[currentSeatState.type].group : localPlayer;
      const camDist = 14;
      camera.position.x = activeObj.position.x + Math.sin(camRotX) * camDist;
      camera.position.y = activeObj.position.y + 4.5;
      camera.position.z = activeObj.position.z + Math.cos(camRotX) * camDist;
      camera.lookAt(activeObj.position.x, activeObj.position.y + 1.2, activeObj.position.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
